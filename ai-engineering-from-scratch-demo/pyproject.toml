[project]
name = "aiefs-demo"
version = "0.1.0"
description = "Runnable, verified solutions to every exercise in ai-engineering-from-scratch"
requires-python = ">=3.11"
dependencies = []

# D8 — dependency groups per phase cluster, not one requirements.txt.
[project.optional-dependencies]
math   = ["numpy>=1.26"]                       # phases 01-03
vision = ["numpy>=1.26", "pillow>=10"]         # phases 04, 12
audio  = ["numpy>=1.26"]                       # phase 06
llm    = ["openai>=1.40"]                      # phases 07, 10, 11  (§8 Q3)
agents = []                                    # phases 13-16
infra  = []                                    # phase 17
dev    = ["pytest>=8"]

[project.scripts]
demo = "harness.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests", "demos"]
python_files = ["test_*.py"]
# Every lesson ships a tests/test_practice.py (D6). Under pytest's default
# "prepend" import mode those identical basenames collide; importlib mode gives
# each its own module identity, so no lesson needs an __init__.py.
addopts = "--import-mode=importlib"
