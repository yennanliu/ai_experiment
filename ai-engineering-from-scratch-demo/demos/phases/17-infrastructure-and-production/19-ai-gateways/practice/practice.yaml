  - index: 5
    slug: sliding_window_because_a_token_bucket_cannot_grant_the_burst_and_the_full_rate_under_one_cap
    kind: code
    tier: T0
    deps_group: none
    en: |
      Design a rate-limit policy for a multi-tenant SaaS: free tier, trial tier, paid tier. Token-bucket or sliding-window?
    zh: |
      替一套多租戶 SaaS 設計速率限制政策：免費層、試用層、付費層。要用權杖桶還是滑動窗口？
    verifies: >-
      a tenant idle 30 s then flooding at 4x its quota for 90 s, tiers 20 / 100 / 1000 per minute: the
      sliding-window log admits at most 20 / 100 / 1000 in any 60 s, the natural token bucket 39 / 199
      / 1999 (2L - 1), the fixed window 40 / 200 / 2000 and the sliding-window counter 30 / 150 /
      1500. A half-size bucket stays under the quota (19 / 99 / 999) but serves 24 / 124 / 1249 over
      the flood against the log's 40 / 200 / 2000. code/main.py defines no name matching limit,
      bucket, window or throttle
