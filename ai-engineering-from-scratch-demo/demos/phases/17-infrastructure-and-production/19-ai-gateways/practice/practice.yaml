exercises:
  - index: 1
    slug: at_five_percent_the_chain_serves_99_9875_percent_and_the_gateway_changes_nothing_but_a_constant
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py`. Configure fallback from OpenAI→Anthropic→self-hosted. What's the expected hit rate at 5% provider error rate?
    zh: |
      跑 `code/main.py`。把退路設定成 OpenAI→Anthropic→自架。在供應商錯誤率 5% 時，預期命中率是多少？
    verifies: >-
      the shipped PROVIDERS are already OpenAI -> Anthropic -> Self-hosted; at a 5% error rate the
      chain serves exactly 0.999875 and makes 0.0525 fallback calls per request, and the simulator at
      200,000 requests serves 0.9999 with 10,434 fallbacks, while at its own n = 1000 it prints 100.0%
      with 60. On the shipped run all four gateways report (1.0, 34, 34) and mean latency 183.048 ms
      plus their overhead. retries - fallbacks = 10,454 - 10,434 = 20 = the requests that failed all
      three, so every retry is a fallback. A failed 180 ms call costs 54.0 ms, not half, and 'Six core
      features' numbers 7 items
  - index: 2
    slug: no_gateway_fits_because_the_baseline_alone_is_100_ms_over_and_the_tail_is_the_fallback
    kind: code
    tier: T0
    deps_group: none
    en: |
      Your SLA is TTFT P99 < 200 ms on a 300 ms baseline. Which gateways stay within budget?
    zh: |
      你的 SLA 是在 300 毫秒基線上做到 TTFT P99 < 200 毫秒。哪些閘道還在預算內？
    verifies: >-
      with P99 overheads LiteLLM 15, Portkey 40, Kong 8, Cloudflare 3 ms, a 300 ms baseline under a
      200 ms SLA leaves a -100 ms budget and no gateway, while 200 ms of headroom (500 total) admits
      all four. On the lesson's chain 3% of requests fall back, so the P99 is 274 ms with no gateway
      and 284 / 304 / 279 / 276 ms with LiteLLM / Portkey / Kong / Cloudflare. The lesson's 'P99 < 100
      ms: Kong or Cloudflare' holds only for baselines 85..91 ms, below the simulator's fastest 100 ms
      provider
