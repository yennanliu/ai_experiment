  - index: 5
    slug: the_405b_needs_261_gb_under_2_percent_of_a_gb200_nvl72_and_the_code_calls_it_multi_gpu
    kind: code
    tier: T0
    deps_group: none
    en: |
      Compute the HBM needed for a 405B model at NVFP4 weights + FP8 KV cache at 128k context. Does it fit on a single GB200 NVL72 node?
    zh: |
      算出一個 405B 模型在 NVFP4 權重 + FP8 KV 快取、128k 脈絡下所需的 HBM。它裝得進單一個 GB200 NVL72 節點嗎？
    verifies: >-
      at 131,072 tokens the module sizes 405B at 202.5 GB NVFP4 weights + 58.4 GB FP8 KV = 260.9 GB,
      1.9% of NVIDIA's 13.4 TB rack, too big for one GPU but inside one 372 GB superchip, with room
      for 224 more sequences. The module's 217.7 layers are 1.73x Llama 3.1 405B's 126; the real shape
      gives 33.8 GB KV and 390 sequences per rack. The GB200 NVL72 stack's hbm_gb is 192, so the fit
      test fails the rack row; KV is 22% of each decode step's bytes and decode_throughput takes only
      (active_b, stack)
