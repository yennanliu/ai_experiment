  - index: 4
    slug: tcp_matters_only_for_ttft_where_it_adds_50_percent_and_streaming_kv_per_layer_hides_both_behind_prefill
    kind: code
    tier: T0
    deps_group: none
    en: |
      Compute KV transfer cost: 4K prefill on 70B FP8 = ~500 MB KV. At RDMA 100 GB/s, transfer = 5 ms. At TCP 10 GB/s = 50 ms. Which matters for your SLA?
    zh: |
      算 KV 轉移成本：70B FP8 上 4K 的預填約 500 MB KV。在 RDMA 100 GB/s 下轉移要 5 毫秒。在 TCP 10 GB/s 下要 50 毫秒。哪一個對你的 SLA 要緊？
    verifies: >-
      4096 x 125,000 B = 512 MB moves in 5.12 ms RDMA and 51.2 ms TCP; TTFT 102.4 -> 107.52 / 153.6
      ms, TPOT unchanged, end to end 2885.3 -> 2931.4 ms (+1.6%). Streamed per layer over 80 layers
      the exposed transfer is 0.064 / 0.64 ms, hidden above 5 GB/s; 10 GbE takes 409.6 ms and exposes
      308.5 ms. The lesson says 20-80 ms; at Llama 3.3 70B's 163,840 B/token the KV is 671 MB, 6.71 /
      67.1 ms
  - index: 5
    slug: routing_leaves_the_kv_transfer_alone_and_makes_decode_read_8x_more_weight_per_token_than_dense_at_batch_64
    kind: code
    tier: T0
    deps_group: none
    en: |
      MoE expert routing changes KV access patterns. How does disaggregation behave with MoE that activates different experts per token?
    zh: |
      MoE 的專家路由會改變 KV 的存取樣式。當 MoE 對每個詞元啟動不同專家時，分離的行為會怎樣？
    verifies: >-
      DeepSeek-V3 MLA KV is 35,136 B/token (0.28 of the lesson's constant), a 4K prompt 143.9 MB in
      1.44 ms RDMA through the reference; a seeded top-8-of-256 router touches all 256 experts per
      layer in a 4096-token prefill and 8 / 57.1 / 223.7 / 256.0 per layer at decode batch 1 / 8 / 64
      / 256, 37.0 -> 670.4 GB per step. Per token MoE reads 37.0 GB vs dense 70 at batch 1 but 9.19 vs
      1.09 (8.4x) at batch 64, 2.3 tokens per expert; the reference has no expert, batch or MoE name
