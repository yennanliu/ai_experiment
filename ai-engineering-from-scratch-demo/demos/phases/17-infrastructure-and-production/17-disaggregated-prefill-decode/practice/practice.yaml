lesson: 17-disaggregated-prefill-decode
phase: 17-infrastructure-and-production
source: phases/17-infrastructure-and-production/17-disaggregated-prefill-decode/docs/en.md
exercises:
  - index: 1
    slug: there_is_no_prompt_length_crossover_disaggregation_wins_every_row_because_the_decode_pool_is_given_faster_hardware
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py`. At what prompt length does disaggregation beat colocation?
    zh: |
      跑 `code/main.py`。提示詞要多長，分離才會勝過共置？
    verifies: >-
      disaggregation wins all 8 rows (256..32768) over RDMA and TCP, RDMA margins 444.12 -> 8847.93
      ms; each output token saves 4.444 ms, so colocation wins only past prompt 3556 (RDMA) / 356
      (TCP) per output token, and at 0 output. With the decode pool on the colocated GPU (0.10 tok/ms)
      every margin is minus the RDMA transfer, -0.32 .. -40.96 ms. At (256, 100) the win is 444.12 ms
      against a 0.32 / 3.2 ms tax, contradicting the lesson's 512/200 threshold. Prefill implies 5600
      TFLOPS against the text's 2000, decode 100 tok/s against a 42.9 tok/s bound at 3 TB/s, and the
      output has no cost
  - index: 2
    slug: three_prefill_gpus_to_two_decode_gpus_because_kv_memory_caps_the_decode_batch_and_the_codes_batch_of_one_says_one_to_eight
    kind: code
    tier: T0
    deps_group: none
    en: |
      Design the prefill pool and decode pool for a RAG service with P99 prefix length 8K, output 300.
    zh: |
      替一個 P99 前綴長度 8K、輸出 300 的 RAG 服務，設計預填池與解碼池。
    verifies: >-
      at 10 req/s of 8192 + 300 tokens: 3 prefill GPUs at <= 70% utilization and 2 H200 decode GPUs,
      KV-capped batch 66, TPOT 28.92 ms, 86.8 requests in flight, TTFT 204.8 + 10.24 ms. The code's
      batch-1 decode gives 8.14 decode GPU-ms per prefill ms; batched, prefill needs 1.56x the decode
      pool's time. The lesson's 125,000 B/token is 0.76 of Llama 3.3 70B's 163,840; at the real size
      the batch is 51, the ratio 1.2, still 2 decode GPUs, and full-batch TPOT is over 5x the code's
      5.56 ms
