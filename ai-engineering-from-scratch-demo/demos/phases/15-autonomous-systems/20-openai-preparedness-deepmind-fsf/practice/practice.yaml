    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py`. Confirm the diff tool's output matches the policies for at least two capabilities you can verify against the source documents.
    zh: |
      跑 `code/main.py`。挑至少兩項你能對照原始文件驗證的能力，確認 diff 工具的輸出與政策相符。
    verifies: >-
      the headline restates 2 of the 7 capabilities across 3 policies, of which 5 of the 6
      classifications appear verbatim in the tables and DeepMind's long-range autonomy is summarised
      as 'domain-folded', so the confirmable set is the set the lesson repeats and the other 21-entry
      tables have no in-lesson corroboration; main diffs 5 of the 7 keys, leaving cyber_uplift and
      bio_uplift in all three tables and out of the output; OpenAI carries 2 classifications and 2
      actions across 7 rows against 6 actions each for the other two
