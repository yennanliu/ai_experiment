  - index: 4
    slug: the_sandbagging_test_has_to_be_one_the_model_cannot_recognise
    kind: code
    tier: T2
    deps_group: none
    en: |
      Sandbagging is in OpenAI's Research Categories. Design an evaluation that would force a sandbagging model to reveal its actual capability. Reference the Lesson 1 eval-context-gaming discussion.
    zh: |
      Sandbagging 落在 OpenAI 的研究類別。設計一項評測，能逼一個放水的模型露出它真實的能力。參照第 1 課關於評測脈絡操弄的討論。
    verifies: >-
      a four-arm protocol over one task distribution has exactly 1 arm the model cannot recognise --
      an undeclared production sample -- so sandbagging shows as a gap between arms rather than a low
      score in any; the three policies file sandbagging as Research, an eval-context gap and deceptive
      alignment monitoring, and 1 of the 3 names something that runs; at Lesson 1's documented 12% and
      78% gaming rates a 68-step trajectory at 0.99 per-step falls from 0.505 to 0.239 and 0.003; 0 of
      the three sandbagging entries mention data governance
  - index: 5
    slug: the_capability_they_agree_on_is_the_one_no_one_folds
    kind: code
    tier: T0
    deps_group: none
    en: |
      Compare the three policies on a specific capability (your choice). Name which policy's classification you find most rigorous and which least. Justify with source text.
    zh: |
      針對一項特定能力（你自己挑）比較這三份政策。說出你認為哪一份政策的分類最嚴謹、哪一份最不嚴謹。用原文佐證。
    verifies: >-
      on undermining_safeguards the three classify it as Research, a hardcoded prohibition and
      deceptive alignment monitoring, and only Anthropic's action names something that happens without
      a review; across all 7 capabilities the actions name a runtime in 0, 3 and 4 rows respectively
      and OpenAI's column holds 2 distinct strings; the 3 capabilities OpenAI files as Tracked are the
      shared set and 2 of them are the ones main never prints; the strictest classification is also
      the narrowest, catching 1 of 8 cases in Lesson 17
