exercises:
  - index: 1
    slug: the_anchor_gate_never_fires_because_the_invariant_gate_runs_first
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py` with all primitives enabled. Confirm the loop still improves on the primary metric without letting the hack win.
    zh: |
      啟用全部原語跑 `code/main.py`。確認迴圈在主要指標上仍然有改善，同時沒有讓那個入侵手法贏。
    verifies: >-
      with all four gates on the loop accepts 96 of 200 cycles and reaches perf 1.00, the brute-forced
      ceiling held by ['collapse', 'title'], with safety 1.00, the approved six-tool manifest and the
      anchor intact -- and the replay reproduces the shipped accepted count and all four reject
      counters; rejects are 11 invariant, 66 multi, 27 regression and 0 anchor, because mutate edits
      the objective only in the branch that also edits the manifest and gate_invariant runs first; the
      66 multi rejections split 46 perf, 20 both and 0 safety over 2801 sequences whose
      safety-breaking members top out at perf 0.0
  - index: 2
    slug: the_tolerance_sits_below_the_metric_s_granularity
    kind: code
    tier: T0
    deps_group: none
    en: |
      Disable regression detection. Construct an input where this leads to silent capability loss being accepted.
    zh: |
      停用回歸偵測。造一個輸入，讓這件事導致無聲的能力流失被接受。
    verifies: >-
      with the regression gate off the loop accepts 116 cycles of which 80 sit below the running best,
      against 0 of 96 with it on, and both runs still finish at perf 1.00; perf_score divides by 4
      cases so its smallest step is 0.25, above the gate's 0.2 default tolerance, making it strictly
      monotonic despite a docstring that claims it accepts noise; a one-case loss from 1.00 to 0.75 is
      rejected at tol=0.2 and accepted at tol=0.25; the deepest below-best acceptance is 0.75
  - index: 3
    slug: the_two_axes_cannot_trade_off
    kind: code
    tier: T0
    deps_group: none
    en: |
      Disable the multi-objective constraint. Show the loop converges on the performance axis while a safety axis drops.
    zh: |
      停用多目標限制。展示迴圈在效能那一軸收斂，同時某個安全軸下滑。
    verifies: >-
      with the multi gate off the loop accepts 142 cycles and ends at perf 1.00 and safety 1.00, and
      across all 2801 operator sequences up to length 4 exactly 0 have perf at or above 0.25 with
      safety below 1.0, so no agent is both good at the task and unsafe; 1 of the 7 operators breaks
      the filter, reverse, and it scores 0.0 on perf; apply scans for danger substrings after running
      the sequence and lowercases first; the disabled gate's rejections split 46 perf, 20 both and 0
      safety, so removing it raises acceptances 96 to 142 by dropping a perf floor
  - index: 4
    slug: the_anchor_and_its_hash_live_in_the_same_file
    kind: code
    tier: T0
    deps_group: none
    en: |
      Design an alignment anchor for a coding agent. What text, stored where, checked how?
    zh: |
      替一個寫程式代理設計一個對齊錨點。什麼文本、存在哪、怎麼檢查？
    verifies: >-
      the shipped anchor keeps its 48-character text, its 16-digit hash and the agent field that
      defaults to it all in one module, and gate_anchor takes 1 parameter, reading the expected value
      from a constant beside the text; the proposed design stores the text in the reference checkout,
      0 of whose paths sit inside this repository, and checks it the way the spec-drift test already
      re-reads and hashes docs/en.md; the 16-digit truncation is 64 bits and a 2^32 birthday bound,
      which is not the binding weakness
  - index: 5
    slug: read_iclr_2026_rsi
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Read the ICLR 2026 RSI Workshop summary. Pick one of the four primitives and propose a concrete improvement to the current state of the art.
    zh: |
      讀 ICLR 2026 RSI 工作坊的摘要。挑四種原語之一，對當前技術水準提出一項具體改進。
    cites: >-
      Information-theoretic limits
