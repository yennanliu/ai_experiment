exercises:
  - index: 1
    slug: every_beta_in_the_sweep_is_pareto_optimal
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Easy.** Change `β` in `code/main.py` to `0.01`, `0.1`, `1.0`, `5.0`. Record the final reconstruction MSE and KL. Which β is Pareto-best for your synthetic data?
    zh: |
      **簡單。** 把 `code/main.py` 裡的 `β` 改成 `0.01`、`0.1`、`1.0`、`5.0`。記錄最後的重建 MSE 與 KL。對你的合成資料來說，哪個 β 是 Pareto 最佳？
    verifies: >-
      the four betas are run through the lesson's own init_vae, forward, backward and apply_update at
      the lesson's own settings -- 8-D input, 10 hidden, 2-D latent, lr 0.01, 40 epochs, 60 points --
      on 5 seeds each. Reconstruction rises with beta and KL falls with it at every step of the
      sweep, so no point is beaten on both axes and all four are Pareto-optimal: the question as
      asked has four answers, and picking one needs a scalarisation the exercise never states. The
      left end is pinned by the data rather than by beta, since gauss(0, 0.2) noise on 8 dimensions
      puts a floor of 8 * 0.2^2 = 0.32 under reconstruction and beta=0.01 reaches 0.325, 1.02x that
      floor, with the two floor-end betas not separable at all -- on 1 seed of 5 beta=0.1
      reconstructs better than beta=0.01. The exchange rate across the sweep falls by a factor of
      556, from 200 nats of KL per unit of reconstruction between 0.01 and 0.1 to 0.36 between 1.0
      and 5.0, which makes beta=0.1 the last point bought cheaply. And the KL axis has no floor at
      the one bit the two clusters carry: beta=20 drives KL to 6.3e-05, 11691x below the smallest
      value in the sweep, and reconstruction to 0.98x that of a model ignoring its input entirely
    uses_reference:
      - init_vae
      - forward
      - backward
      - apply_update
      - loss_value
      - sample_mixture
  - index: 2
    slug: binarising_removes_what_the_likelihoods_disagree_about
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Medium.** Replace the Gaussian decoder likelihood with a Bernoulli likelihood (cross-entropy loss). Compare sample quality on a binarized version of the same synthetic data.
    zh: |
      **中等。** 把高斯解碼器似然換成白努利似然（交叉熵損失）。在同一份合成資料的二值化版本上比較樣本品質。
    verifies: >-
      only the decoder likelihood changes: both arms run the lesson's own init_vae, forward and
      backward, and the Bernoulli arm reaches ref.backward unmodified by handing it the target for
      which its d recon/d x_hat = 2(x_hat - t) equals the Bernoulli sigmoid(x_hat) - x, an identity
      checked to 7.6e-16 rather than asserted. Sample quality, scored as the fraction of decoded
      N(0, I) draws landing on one of the two patterns the binarised data contains, is 0.979 for the
      Gaussian decoder against 0.987 for the Bernoulli one over 5 seeds and 400 draws each -- a gap
      of 0.009 against one standard error of 0.007, so the axis the exercise names cannot separate
      them. What the swap changes is the support rather than the quality: 38.6% of prior draws leave
      the Gaussian decoder with a coordinate outside [0, 1], the worst by +0.143, and the Bernoulli
      decoder does this 0% of the time because its output is a sigmoid. The reason the quality axis
      is flat is that the exercise's own binarisation destroys the comparison -- two likelihoods
      differ in how they model the residual, and binarising leaves 2 distinct patterns in 400 rows
      with 0 deviations, because centres at +-1 against gauss(0, 0.2) noise make a sign flip a
      5-sigma event
    uses_reference:
      - init_vae
      - forward
      - backward
      - apply_update
      - sample_mixture
      - tanh
      - add
      - matmul
  - index: 3
    slug: two_of_thirty_two_is_the_mode_count_not_collapse
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Hard.** Extend `code/main.py` into a mini VQ-VAE: replace the continuous `z` with a nearest-neighbour lookup in a codebook of K=32 entries. Compare reconstruction MSE and report how many codebook entries get used (codebook collapse is real).
    zh: |
      **困難。** 把 `code/main.py` 擴充成一個迷你 VQ-VAE：把連續的 `z` 換成在 K=32 條目的碼本裡做最近鄰查表。比較重建 MSE，並回報有多少碼本條目真的被用到（碼本崩潰是真實存在的）。
    verifies: >-
      the lesson's own network is kept and only the latent is replaced: forward is called with eps=0,
      which makes z equal mu to 0.0 exactly, the nearest of K entries is substituted, and the decoder
      is re-run from that entry, so the gradient is ref.backward at beta=0 -- where dz/dmu of 1 is
      itself the straight-through estimator and beta=0 removes the KL a VQ-VAE does not have. A
      codebook of 32 settles on 2 entries at every one of 3 seeds and reconstructs to 0.3272, 1.02x
      the 8 * 0.2^2 = 0.32 noise floor, which is the same wall the continuous VAE hits in Exercise 1
      but reached with a 1-bit latent rather than 2 continuous dimensions. Two of thirty-two is the
      mode count rather than collapse, since sample_mixture draws from two centres and a codebook
      using all 32 would be encoding the noise around them -- a usage fraction cannot diagnose
      collapse without knowing how many modes the data has. K itself does not matter: recon across
      K = 2, 8, 32 and 128 spans 0.0004 and usage stays at 2, so 30 of the exercise's 32 entries are
      memory that is never addressed. And one bit buys what 5.13 nats of continuous KL bought in
      Exercise 1, 7.4x less rate for the same distortion
    uses_reference:
      - init_vae
      - forward
      - backward
      - apply_update
      - sample_mixture
      - tanh
      - add
      - matmul
