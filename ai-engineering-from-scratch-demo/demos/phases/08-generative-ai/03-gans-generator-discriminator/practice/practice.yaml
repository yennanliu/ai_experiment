exercises:
  - index: 1
    slug: the_non_saturating_loss_does_not_saturate
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Easy.** Run `code/main.py` with the stock settings. Then set `D_LR = 5 * G_LR` and rerun. How fast does G's loss collapse to a constant?
    zh: |
      **簡單。** 用預設設定執行 `code/main.py`。然後設 `D_LR = 5 * G_LR` 重跑。G 的損失多快就塌成一個常數？
    verifies: >-
      the lesson's own update_d and update_g are driven at the lesson's own settings -- z_dim 4,
      hidden 16, batch 32, 800 steps, g_lr 0.02 -- with only the discriminator's learning rate
      changed, and G's loss is computed the way update_g defines it, -log D(G(z)), since neither
      update function returns one. It does not collapse: over 6 seeds the last-100-step mean is
      0.791 at the stock d_lr = 0.5x g_lr against 0.787 at 5x, a gap of 0.004 where the same
      quantity spans 0.425 across seeds within one setting, 115x the gap. Three seeds are not
      enough to see this, since on seeds 0-2 alone the two differ by 0.085 and look separated. The
      exercise is asking how fast the non-saturating loss saturates: update_g's own docstring reads
      "Non-saturating G loss: maximize log D(G(z))", and the form that goes flat when D wins is the
      saturating log(1 - D(G(z))), which this code does not use. D never wins at any ratio tried --
      D(fake) stays between 0.43 and 0.46 and D(real) between 0.54 and 0.60 from 0.5x to 50x, a
      critic at chance -- and what a 50x ratio buys is variance, the within-run tail deviation
      rising to 0.136 against 0.025. Finally D_LR and G_LR are not module constants at all but
      locals inside main(), so the edit the exercise describes cannot be made as written
    uses_reference:
      - init_mlp
      - forward_g
      - forward_d
      - sample_real
      - sample_noise
      - update_d
      - update_g
  - index: 2
    slug: the_prescribed_clip_switches_the_critic_off
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Medium.** Replace the Goodfellow BCE loss with the WGAN loss: `loss_D = E[D(fake)] - E[D(real)]`, `loss_G = -E[D(fake)]`, and clip D's weights to `[-0.01, 0.01]`. Is training more stable? Compare wall-clock convergence.
    zh: |
      **中等。** 把 Goodfellow 的 BCE 損失換成 WGAN 損失：`loss_D = E[D(fake)] - E[D(real)]`、`loss_G = -E[D(fake)]`，並把 D 的權重裁切到 `[-0.01, 0.01]`。訓練變穩定了嗎？比較實際耗時的收斂速度。
    verifies: >-
      the model stays the lesson's -- init_mlp, forward_g, forward_d, sample_real, sample_noise, the
      same shapes and the same learning rate -- and only the loss changes; because update_d and
      update_g hard-code the BCE gradient p - target, the WGAN gradient is new code, and it is
      checked against a central difference of ref.forward_d's own raw score over all 16 first-layer
      weights, worst gap 7.6e-12. Neither loss scores the result: both arms are judged by the exact
      1-D Wasserstein distance between 400 generated and 400 real samples, read against two anchors
      -- 0.129 for two fresh real draws and 1.730 for the same generators with training switched
      off. At the prescribed clip WGAN is indeed steadier, 1.715 spanning 0.204 against BCE's 1.470
      spanning 0.973, and that is all it is: it lands on the untrained 1.730, inside its own seed
      spread, because clipping every weight to [-0.01, 0.01] through a 1->16->1 net holds mean
      |D(x)| to 0.0003 against BCE's 0.398 and leaves no slope for the generator to follow. Raise
      the clip and the comparison inverts: at 0.5 WGAN reaches 0.937 spanning 0.158, better than BCE
      and 6.2x steadier, and at 2.0 it diverges with a spread of 5.14 -- so across 0.01, 0.1, 0.5
      and 2.0 the clip is the entire experiment. Wall-clock decides nothing, one WGAN run costing
      1.0x a BCE run, and n_critic, which the exercise never mentions, is the term that would
    uses_reference:
      - init_mlp
      - forward_g
      - forward_d
      - sample_real
      - sample_noise
      - update_d
      - update_g
      - leaky_grad
  - index: 3
    slug: there_is_no_collapse_left_to_fix
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Hard.** Extend the 1-D example to 2-D data (mixture of 8 Gaussians on a ring). Track how many of the 8 modes the generator captures at steps 1k, 5k, 10k. Implement minibatch discrimination and re-measure.
    zh: |
      **困難。** 把這個 1 維範例擴充到 2 維資料（環上的 8 個高斯混合）。追蹤生成器在第 1k、5k、10k 步分別抓到 8 個模式中的幾個。實作 minibatch discrimination 後再量一次。
    verifies: >-
      the ring is the benchmark's own -- radius 2, 8 centres, sigma 0.05 -- and a mode counts as
      captured when it draws at least a quarter of its fair share of 400 probe samples by nearest
      centre, a rule under which the real data itself scores 8 of 8. Both arms run the lesson's own
      update_d at the lesson's own settings; minibatch discrimination appends one feature per row,
      the mean exp(-L1) to the rest of the batch, and that arm needs its own generator backward
      because forward_d then takes 3 inputs where x_hat has 2. Modes captured per seed are 4, 6 and
      8 for the plain arm at step 1000 against 5, 7 and 8 with the feature, then 8, 8 and 8 for both
      arms at 5000 and again at 10000. So the exercise's premise does not occur here: minibatch
      discrimination fixes mode collapse and there is no collapse left to fix on this architecture,
      this ring and this budget, which makes the re-measurement it asks for return the same number
      twice. What the feature does buy is a head start rather than a better endpoint -- ahead or
      level on every seed at step 1000, 0.67 of a mode on average against a plain-arm seed range of
      4 -- and even that is suggestive rather than established, because the two arms are not paired:
      a critic one column wider consumes different draws at initialisation and every sample after
      it differs. Finally, extending the lesson to 2-D is one function: init_mlp, forward_g,
      forward_d, update_d and update_g are all written over len(x) and the plain arm trains through
      them unmodified at width 2, leaving sample_real as the only thing hard-wired to one dimension
    uses_reference:
      - init_mlp
      - forward_g
      - forward_d
      - sample_noise
      - update_d
      - update_g
      - leaky_grad
