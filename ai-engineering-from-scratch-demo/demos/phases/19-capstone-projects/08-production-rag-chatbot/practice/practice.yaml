lesson: 08-production-rag-chatbot
phase: 19-capstone-projects
source: phases/19-capstone-projects/08-production-rag-chatbot/docs/en.md
exercises:
  - index: 1
    slug: the_python_filter_leaks_0_of_60_slots_and_the_typescript_chat_server_leaks_on_15_of_20_probes
    kind: code
    tier: T1
    deps_group: none
    en: |
      Build a second corpus slice under a different jurisdiction (e.g., HIPAA alongside GDPR). Demonstrate role+jurisdiction filtering preventing cross-leak on a 20-question cross-jurisdiction probe.
    zh: |
      在另一個管轄區之下建第二份語料切片（例如在 GDPR 旁邊加上 HIPAA）。在一份 20 題的跨管轄區探測上，示範角色+管轄區過濾能防住跨界洩漏。
    verifies: >-
      a second slice of 4 HIPAA and 3 more GDPR chunks makes 5 + 5; on 20 cross-jurisdiction probes
      the lesson's retrieve leaks 0 of 60 slots, against 48 out-of-scope chunks with labels stripped;
      the lesson's TypeScript /chat/stream retrieve (run through Node type stripping) boosts +2
      instead of filtering, takes no role, and returns foreign-jurisdiction text on 15 of 20 probes
      (25 snippets), GDPR-Art-17 first for a HIPAA erasure question; chat_turn still answers all 20
      probes with 3 citations
  - index: 2
    slug: the_lessons_cache_reports_99_7pct_a_5_minute_ttl_gives_39pct_and_at_115_tokens_a_real_api_caches_nothing
    kind: code
    tier: T0
    deps_group: none
    en: |
      Measure prompt-cache hit rate over a week of production traffic. Identify which queries break the cache prefix. Restructure.
    zh: |
      量測一週生產流量下的提示詞快取命中率。指出哪些查詢會打斷快取前綴。重新調整結構。
    verifies: >-
      a seeded week of 2,100 queries: the lesson's PromptCache reports 99.7% (2,093 hits, 7 keys, no
      expiry), the same keys under a 5-minute TTL hit 39.0%; analyst/GDPR shows 4 context orders and 6
      of 9 phrasings break the modal order (46.8% of its traffic); sorting context by anchor lifts the
      TTL rate to 62.9%, equal to keying on the group alone; the prefix is 461 chars (~115 tokens),
      whole corpus ~155, under the 1,024-token minimum, so the real hit rate is 0%
  - index: 3
    slug: faithfulness_stays_1_for_400_turns_and_one_turn_of_memory_pins_every_citation_to_one_chunk
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add multi-turn memory with a 10k-token summary buffer. Measure whether faithfulness drops as the conversation grows.
    zh: |
      用一個 1 萬詞元的摘要緩衝區加上多輪記憶。量測忠實度會不會隨著對話變長而下降。
    verifies: >-
      a 400-turn analyst/GDPR conversation with a 10,000-token summary buffer (first overflow at turn
      180): verbatim-claim faithfulness is 1.000 on every turn with or without memory; with memory in
      the retrieval query top-1 citation accuracy is 1.0, 0.333, 0.325, 0.333, 0.335 over turns 1 /
      2-10 / 11-50 / 51-179 / 180-400 and the control is 1.0 throughout; from turn 2 (one 58-token
      turn of memory) the top citation is MSA-2024-03-11 s12.4 on every turn
  - index: 4
    slug: no_model_is_called_so_faithfulness_moves_0_and_serverless_llama_costs_14_5pct_of_sonnet_4_6
    kind: code
    tier: T0
    deps_group: none
    en: |
      Swap Claude Sonnet 4.7 for Llama 3.3 70B self-hosted. Measure $/query and faithfulness delta.
    zh: |
      把 Claude Sonnet 4.7 換成自架的 Llama 3.3 70B。量測每次查詢花費與忠實度的差值。
    verifies: >-
      main.py calls no model, so faithfulness is 1.000 under either and the delta is 0; 12 golden
      queries average 114 prompt / 60 completion tokens, $1.24 / $0.82 / $0.18 per 1,000 queries on
      Sonnet 4.6 / Sonnet 5 / Llama 3.3 70B serverless (14.5%), two H100s at $5.49/h break even at
      8,878 queries/h, every prefix under 1,024 tokens; the doc names the nonexistent Claude Sonnet
      4.7 5 times; the stub's 60-character cut ends 4 of 5 chunks mid-word and drops MSA's 'days'
  - index: 5
    slug: every_query_scores_2_61_under_rrf_so_only_a_relevance_gate_cuts_false_confidence_from_14_to_1_of_14
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add an "unsure" mode: if top reranked scores are below a threshold, the agent says "I do not have confident citations" instead of answering. Measure false-confidence reduction.
    zh: |
      加上一個「不確定」模式：若重排後的最高分低於門檻，代理就說「我沒有有把握的引用」而不作答。量測過度自信的下降幅度。
    verifies: >-
      on 14 answerable and 14 unanswerable probes, no gate is false-confident on 14/14; gating the
      best dense_score at 0.05 / 0.10 / 0.15 / 0.20 gives 12 / 1 / 0 / 0 false-confident and 14 / 14 /
      12 / 11 answered correctly; the top RRF score is 2/61 on all 28 so an RRF threshold refuses all
      or none; the lesson's refusal branch fires on 0 of 25 role x jurisdiction pairs
