  - index: 1
    slug: a_length_conjunction_and_jargon_selector_picks_13_of_14_queries_right_and_no_strategy_moves_an_eval_metric
    kind: code
    tier: T1
    deps_group: llm
    en: |
      Add a per-query strategy selector inside the rewriter: heuristics from lesson 67 (length, conjunctions, jargon ratio) pick HyDE, multi-query, or decomposition.
    zh: |
      在改寫器內部加上一個逐查詢的策略選擇器：用第 67 課的捷思（長度、連接詞、術語比例）去挑 HyDE、多查詢或分解。
    verifies: >-
      a length / conjunction / jargon-ratio selector installed on the lesson's Rewriter picks right on
      13 of 14 labelled queries against the lesson's pick_strategy's 7; forcing HyDE, multi-query,
      decompose or no rewrite gives identical metrics (recall@5 1.000, precision@1 0.500, mrr 0.708)
      because the 8-10 chunk candidate pool always holds gold (4/4); _REWRITE_HYDE is keyed by exactly
      the 4 eval queries, 2 of its hypotheticals are gold docs d3 and d7 verbatim, and it has none for
      the 4 jargon queries
  - index: 2
    slug: citing_in_parentheses_as_the_prompt_asks_drops_faithfulness_to_0_667_and_off_topic_questions_are_never_refused
    kind: code
    tier: T1
    deps_group: llm
    en: |
      Add a real LLM call for the generator behind an env flag. Default to the mock. Measure the latency delta.
    zh: |
      在一個環境變數旗標後面，替產生器加上一次真實的 LLM 呼叫。預設走模擬。量測那個延遲差值。
    verifies: >-
      RAG_REAL_LLM=1 swaps the mock for lesson 35's GPTModel (4 layers, d_model 128) on the lesson's
      prompt template: prompts 127-135 tokens, answers 16-30, generate stage at least 20x the mock and
      over half of each query's latency (printed, not asserted exactly); the mock answers with
      (anchor) citations as the template asks score faithfulness 0.667/0.5/1.0/0.5, mean 0.667 < 0.75;
      0 of 6 off-topic queries are refused, all with faithfulness 1.0 and a top-1 score over 10x
      REFUSE_THRESHOLD 0.05, and a refusal scores faithfulness 0.0 on all 4 eval queries
