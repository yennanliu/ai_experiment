exercises:
  - index: 1
    slug: the_output_filter_leaves_garak_promptinject_at_45_of_45_and_a_grounding_check_drops_it_to_0
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run garak's plugin for prompt-injection on a RAG chatbot and compare attack success rate with and without the output-filter layer.
    zh: |
      對一個 RAG 聊天機器人跑 garak 的提示詞注入外掛，並比較有無輸出過濾層時的攻擊成功率。
    verifies: >-
      45 garak promptinject prompts (3 base x 5 hijacks x 3 rogue strings, AttackRogueString detector)
      behind the lesson's layers with the _bank pretext hit 45/45 with no output layer, with
      output_filter and with llama_guard_4 on the output; an 80% grounding check gives 0/45 and
      answers 5/5 benign questions. Raw prompts score 0/45 because the off_domain rail blocks all; the
      shipped stub target scores 0/45 (it echoes 60 chars, the prefix is 58); the SSN regex catches
      only the dashed spelling
  - index: 2
    slug: the_lessons_layers_pass_16_of_20_indirect_injections_and_two_retrieval_checks_stop_all_20
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a seventh attack family: indirect prompt injection via retrieved documents. Measure the extra defense required.
    zh: |
      加上第七個攻擊家族：透過檢索文件做的間接提示詞注入。量測額外需要的防禦。
    verifies: >-
      20 indirect injections (4 queries x 5 payloads in the retrieved doc): the lesson's layers let 16
      through (only the SSN leak is stopped, by output_filter); ablation over 3 doc-side checks makes
      an injection detector and short-base64 decoding required, 0/20 with both, 0/3 benign docs
      dropped, 4/4 answered; carriers pass the query layers 4/4, doc classifiers stop 4/16; sanitize
      leaves the 28-char base64 encoded, as in the lesson's encoding family (tokens 28 and 20)
  - index: 3
    slug: refuse_with_help_moves_16_of_20_safe_prompts_to_partial_refusal_and_xstest_refusal_stays_80pct
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement a "refuse-with-help" mode: when the guardrail blocks, the target offers a safer related answer instead of a flat refusal. Measure XSTest delta.
    zh: |
      實作一種「拒絕但幫忙」模式：當護欄攔下時，目標改提供一個較安全的相關答案，而不是直接硬拒。量測 XSTest 的差值。
    verifies: >-
      on 10 verbatim XSTest examples + 10 banking XSTest-style prompts: flat 4 comply / 16 full
      refusal, help 4 / 0 / 16 partial; the 2 encoding probes of the lesson's 12 are answered in every
      mode; string-match refusals 16, 16, 0 for flat, help, help without 'sorry'; blocking keys meth,
      meth, bomb, malware, exploit, suicide give 3 misdirected helps; 10/10 XSTest stopped by the
      rail; the lesson's probe is 3 prompts at 0%
