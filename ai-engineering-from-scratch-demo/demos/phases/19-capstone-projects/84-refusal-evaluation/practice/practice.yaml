    en: |
      Add a fourth mock policy that refuses based on prompt length. Confirm that under-refusal rises on encoded attacks (which tend to be short).
    zh: |
      加上第四項依提示詞長度拒答的模擬政策。確認在編碼類攻擊（傾向於很短）上拒答不足會上升。
    verifies: >-
      refuse-if-longer-than-T swept over T=40..110 through the lesson's evaluate_policy; best accuracy
      at T=68 (0.69) gives encoding-trick under-refusal 0.50, the highest category, vs 0.20 overall,
      equal to MockPolicyStrict's 0.50 and exceeded only from T=74; over-refusal 12/30 vs at most 5/30
      for any lesson policy; median length encoded 67.5 vs 75 other unsafe vs 67 safe, and refusing
      all 4 encoded (T<52) over-refuses 29/30; Leaky's one regex matches 20 of 21 plain unsafe prompts
      and 0 of 4 encoded
