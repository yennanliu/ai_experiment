exercises:
  - index: 1
    slug: with_the_papers_minus_10_bias_siglip_reaches_31pct_in_batch_accuracy_where_infonce_reaches_73pct
    kind: code
    tier: T1
    deps_group: vision
    en: |
      Replace InfoNCE with SigLIP-style sigmoid pair loss and compare convergence on the mock corpus.
    zh: |
      把 InfoNCE 換成 SigLIP 風格的 sigmoid 配對損失，並在那份模擬語料上比較收斂情況。
    verifies: >-
      SigLIP Algorithm 1 (t'=log 10, b=-10) swapped into forward; in-batch top-1 over 12 fixed 16-pair
      blocks at steps 0/50/300: InfoNCE 0.083/0.151/0.729, SigLIP 0.083/0.094/0.312; the bias moves
      -10 -> -9.975 -> -9.852; starting it at -ln 15 gives 0.083/0.146/0.651; the loop matches
      ref.train; the printed 'tau 14.286' is the logit scale 1/0.07
  - index: 2
    slug: hard_negative_mining_does_not_make_the_contrastive_loss_drop_faster
    kind: code
    tier: T1
    deps_group: vision
    en: |
      Add a hard-negative mining step: every other batch, select the hardest off-diagonal pair from the previous batch and append it. Train and inspect whether contrastive loss drops faster.
    zh: |
      加上一個困難負例挖掘步驟：每隔一個批次，從前一個批次選出最難的非對角配對並把它附加進去。訓練並檢查對比損失有沒有掉得更快。
    verifies: >-
      appending the hardest previous off-diagonal (image i, caption j) items on odd steps, seeds 0-4 x
      50 steps: fixed-block InfoNCE lower with mining on 1/5 seeds, mean +0.010, last-10 training loss
      higher on 5/5; mined batches hold 16-18 pairs and seed 0's odd steps average 2.849 vs 2.733 even
      (plain 2.764/2.734), ln(18/16) = 0.118; step 0 prints 3.046 not ln 16 = 2.77, steps 45/49 print
      2.668/2.362, last-10 mean 2.541
  - index: 3
    slug: the_matching_head_stays_at_ln_2_for_300_steps_while_cosine_already_ranks_69pct_of_captions_first
    kind: code
    tier: T1
    deps_group: vision
    en: |
      Add an image-text matching binary head on top of the joint embedding (true/false: do these match?) for a third loss, replicating BLIP's three-head setup.
    zh: |
      在那個聯合嵌入之上加上一個影像－文字匹配的二元頭（真／假：這兩者相符嗎？）作為第三個損失，重現 BLIP 那套三頭設定。
    verifies: >-
      Linear(3D,1) ITM head on [z_i, z_t, z_i*z_t] with hardest in-batch negatives, 300 steps: ITM
      loss 0.692 -> 0.694 and 0.698 -> 0.692 (seeds 0, 1), accuracy 0.487/0.547 while cosine top-1
      ranks 0.688/0.786; at 700 steps accuracy 0.727 once cosine rank is 1.0 and contrastive loss
      0.015; fixed-block contrastive loss without/with ITM 0.615/0.793 and 0.672/0.621
  - index: 4
    slug: the_markov_captions_end_4_6x_higher_because_the_mock_captions_were_already_a_plus_3_counter
    kind: code
    tier: T1
    deps_group: vision
    en: |
      Replace the mock corpus with caption-id sequences drawn from a Markov chain whose transition matrix is conditioned on image hash. The captioning loss should drop further because there is actual learnable signal.
    zh: |
      把那份模擬語料換成「由一條馬可夫鏈抽出的字幕 id 序列」，而那條鏈的轉移矩陣以影像雜湊為條件。字幕損失應該會掉得更多，因為那裡真的有可學習的訊號。
    verifies: >-
      captions from 4 image-hash-selected 2-successor Markov tables (floor ln 2): LM loss at steps
      50/300 is 4.78/0.14 on the mock corpus and 5.41/0.65 on Markov; every mock caption steps by +3
      (doc says 'random caption ids'); Markov train 0.652 < ln 2 and fresh captions 5.47 with
      507/1,244 fresh transitions seen; wrong image moves mock 0.142 -> 0.152 and Markov 0.652 ->
      0.813
  - index: 5
    slug: the_lm_loss_does_not_regress_ranking_and_never_reaches_the_projection_the_doc_says_it_trains
    kind: code
    tier: T1
    deps_group: vision
    en: |
      Train the same model with `lm_weight = 0` and again with `lm_weight = 1`. Compare contrastive loss; the LM loss should not regress the ranking objective.
    zh: |
      用 `lm_weight = 0` 訓練同一個模型，再用 `lm_weight = 1` 訓練一次。比較對比損失；語言模型損失不該讓那個排序目標退步。
    verifies: >-
      seeds 0-4, lm_weight 0 vs 1, fixed-block InfoNCE mean 2.521 vs 2.517 at 50 steps and 0.596 vs
      0.585 at 300; lm 1 lower on 4/5 and 3/5 seeds, max gap 0.016 vs seed spread 0.351-0.706; LM
      gradient at init: encoder 190.6, projector and text encoder 0, contrast gives the decoder 0 (doc
      table and prose both wrong); lm 0 caption loss 6.39-6.42 > ln 512, lm 1 4.78-4.82 at 50 steps
