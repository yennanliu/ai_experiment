      8; 0/4 held-out inflections through the word-level translator; 0 guard/safety/language lines in
      code/, X-Guard named once and Llama Guard 4 five times in the doc
  - index: 5
    slug: a_hash_deduped_voice_memory_leaks_on_4_of_4_attacks_and_the_web_half_shares_one_store
    kind: code
    tier: T0
    deps_group: none
    en: |
      Stress the memory privacy: verify that learner A cannot see learner B's data even through a voice-clip re-ingest attack. Log the attempted access and alert.
    zh: |
      對記憶隱私施壓：驗證學習者 A 就算透過語音片段重新攝取的攻擊，也看不到學習者 B 的資料。記錄那次嘗試存取並發警報。
    verifies: >-
      on learners from reference run_adaptive, the session-scoped store shows A none of B's data on
      4/4 re-ingest attacks, logs and alerts all 4, 0 alerts on 2 benign re-ingests, 0 of B's clips
      copied into A; a shared hash-deduped store with identity from the clip leaks B's 4 mistakes on
      4/4; the TS routes /lesson/next and /lesson/:id/submit, 0 'learner' mentions, one MasteryStore;
      Python LearnerState isolated
