    zh: |
      加上一種語言切換模式：家教接受西班牙文輸入並以西班牙文教學。量測 X-Guard 的涵蓋率。
    verifies: >-
      Spanish wording for all 4 socratic_policy actions, 0 flagged; language detected 18/18; Spanish
