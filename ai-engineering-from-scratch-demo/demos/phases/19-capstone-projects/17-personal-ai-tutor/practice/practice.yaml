exercises:
  - index: 1
    slug: adaptive_wins_by_1_69_mastery_points_and_a_learner_who_never_learns_scores_9_51
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run the efficacy study with and without the adaptive learner model (random concept order). Report the delta. Expect adaptive to win, but the size is the interesting number.
    zh: |
      在有與沒有自適應學習者模型（概念順序隨機）的情況下各跑一次成效研究。回報差值。預期自適應會贏，但那個幅度才是有趣的數字。
    verifies: >-
      main()'s protocol (ability seed 29, streams 100+i, 60 turns): mastery sums adaptive 9.81,
      round-robin 8.45, random order 8.12; adaptive - random +1.69 (paired 95% CI +0.68..+2.71),
      expected post-test 74.6% vs 69.4% from a 52.3% pre-test; 7/10 adaptive learners stop early (47.7
      turns), 2/10 do better on round-robin; 200 cohorts +1.29 sd 0.39, range +0.09..+2.21, 0 losses.
      A learner at mastery 0.2 answers 52.5-57.4% right vs p_guess 0.15, two right = 0.927, a
      never-learning 55% learner scores 9.51; bkt_update(0.62, correct) = 0.918 vs the doc's 0.77
      (needs prior 0.32); celebrate fires on 55/90,237 turns
  - index: 2
    slug: the_preferred_modality_finishes_7_8_turns_sooner_and_a_10pct_channel_miss_rate_erases_it
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a multimodal probe: the same concept question delivered as text, voice, and photo. Measure whether learners converge faster with the modality they prefer.
    zh: |
      加上一項多模態探測：同一個概念問題分別以文字、語音與照片呈現。量測學習者是否在他們偏好的模態下收斂得更快。
    verifies: >-
      reference run_adaptive with an assumed +0.3-logit preference: preferred modality converges 7.8
      turns sooner (sd 2.4, 100/100 cohorts of 10); with 10% voice / 5% photo misreads the gain by
      preference is text 15.7, photo 9.2, voice 2.0; over 300 voice-preferrers the gap goes -7.9 ->
      +0.2 at a 10% miss rate; with no preference, misreads alone give text -7.2 / voice +7.1; a lost
      right answer at 0.648 gives 0.277 instead of 0.927; the 10 learners split 4/3/3
  - index: 3
    slug: the_learner_record_has_no_timestamp_and_the_web_half_masters_a_lesson_on_one_right_answer
    kind: code
    tier: T0
    deps_group: none
    en: |
      Build a parent dashboard: topics practiced, mastery trajectories, upcoming concepts, safety events (any guardrail hits). COPPA-aligned.
    zh: |
      建一個家長儀表板：練習過的主題、精熟度軌跡、即將學到的概念、安全事件（任何護欄觸發）。符合 COPPA。
    verifies: >-
      week-1 dashboard for the first study learner: 30 turns over 8 topics, next and upcoming
      distributive_property, replayed trajectories end at stored mastery, 6 guardrail hits on 3 days
      with 0 raw messages shown, unverified parent refused, delete leaves 0, 1-year purge keeps
      30/10/0 turns at day 365/368/370; LearnerState has only history, learner_id, mastery;
      mastery_sum grows the record 8 -> 11 entries; the TS store scores 0.7 = MASTERY_THRESHOLD after
      one right answer vs 0.927 after two in Python
  - index: 4
    slug: an_english_filter_catches_1_of_8_spanish_messages_and_the_lesson_ships_no_guard_to_measure
