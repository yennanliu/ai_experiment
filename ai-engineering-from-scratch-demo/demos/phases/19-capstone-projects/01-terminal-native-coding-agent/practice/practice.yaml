exercises:
  - index: 1
    slug: the_harness_scores_both_models_20_of_20_because_failed_tool_calls_never_fail_a_task
    kind: code
    tier: T0
    deps_group: none
    en: |
      Swap the backing model from Claude Sonnet 4.7 to Qwen3-Coder-30B served on vLLM. Compare pass@1 and $-per-task. Report where the open model underperforms.
    zh: |
      把背後的模型從 Claude Sonnet 4.7 換成跑在 vLLM 上的 Qwen3-Coder-30B。比較 pass@1 與每題花費。回報這個開源模型在哪裡表現較差。
    verifies: >-
      20 tasks through the lesson's model_step seam: the harness's all-[x] signal scores a clean
      frontier stand-in and a tool-call-slipping open stand-in 20/20 each, evidence-based pass@1 is
      20/20 vs 4/20; $/task 0.03 vs 0, and the open arm's 4 looping runs hit the 50-turn cap at 60,000
      tokens (33.3x a clean run) because a $0 model never meets the $5 ceiling. The shipped demo marks
      3/3 done while its read_file failed (ok flags True, False), its self-reported cost is
      $18.52/MTok, above Sonnet 4.6's $15 output price, and the doc names 'Sonnet 4.7', absent from
      the price list read 2026-09-29
  - index: 2
    slug: a_reviewer_with_8_false_positives_cuts_the_lessons_agent_from_20_to_12_of_30_because_it_cannot_revise
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a `reviewer` sub-agent that reads the diff before PR posting and can request a revision loop. Measure whether false-positive reviews drop SWE-bench pass rate below the single-agent baseline (hint: usually yes).
    zh: |
      加上一個 `reviewer` 子代理，在張貼 PR 之前讀那份差異，並能要求進入修訂迴路。量測偽陽性的審查會不會把 SWE-bench 通過率壓到單代理基線之下（提示：通常會）。
    verifies: >-
      on 30 labelled diffs (20 correct) a three-rule diff reviewer flags 8/20 correct and 7/10 wrong;
      with a 3-round revision loop the lesson's run_agent, which returns the same run whatever the
      review says, falls from 20/30 to 12/30 at 4 sessions per flagged task, while an ideal reviser
      reaches 23/30 (4 obeyed false positives break, 7 true positives fixed); TOOLS holds only
      read_file and run_shell, and a Stop hook asking for revision leaves the run at 3 turns ending on
      'end'
  - index: 3
    slug: the_shipped_pretooluse_guard_blocks_0_of_3_escapes_and_a_path_aware_hook_blocks_3
    kind: code
    tier: T0
    deps_group: none
    en: |
      Stress-test the sandbox: write a task that tries to `curl` an external URL and a task that writes outside the worktree. Confirm both are blocked by the PreToolUse hook. Log the attempts.
    zh: |
      對沙箱做壓力測試：寫一個會嘗試 `curl` 外部網址的任務，以及一個會往 worktree 之外寫檔的任務。確認兩者都被 PreToolUse 掛鉤擋下。把那些嘗試記錄下來。
    verifies: >-
      a curl-to-external-URL task (against a PATH shim that records argv), a write to ../outside.txt
      and a read of a prefix-named sibling directory, run through run_agent in a temp worktree: a
      path-aware PreToolUse hook blocks and logs 3/3 (network egress, write outside worktree, read
      outside worktree) with 3/3 benign calls still running; the shipped destructive_guard blocks 0/3,
      curl runs, outside.txt is written and the sibling secret is read through tool_read_file's
      startswith check; the guard blocks 2 of 8 destructive spellings and flags 'echo shutdown notes'
  - index: 4
    slug: at_3x_a_front_to_back_summary_keeps_3_of_12_plan_items_and_pinning_the_plan_keeps_12
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement `PreCompact` summarization with a smaller model (Haiku 4.5). Measure how much plan fidelity is lost at 3x compaction.
    zh: |
      用一個較小的模型（Haiku 4.5）實作 `PreCompact` 摘要。量測在 3 倍壓縮之下，計畫的忠實度損失了多少。
    verifies: >-
      a 36-turn run_agent session with a 12-item plan, compacted 3x: final-plan fidelity is 3/12 for
      keep-oldest, 12/12 for keep-newest and plan-pinned; pinned keeps 11/36 observations and stays
      12/12 up to 109x; one Haiku 4.5 compaction of 150k to 50k costs $0.40 ($0.25 of it output) vs
      $1.20 on Sonnet 4.6; PlanState.summary() carries 0 of 12 notes before any compaction;
      PreCompact, UserPromptSubmit and Notification never fire and main.py has no 150k mark
  - index: 5
    slug: stdio_beats_streamablehttp_3x_per_call_and_the_lesson_ships_neither_transport
    kind: code
    tier: T1
    deps_group: none
    en: |
      Swap MCP StreamableHTTP transport for stdio. Benchmark cold-start and per-call latency. Pick a winner for local-only use.
    zh: |
      把 MCP 的 StreamableHTTP 傳輸換成 stdio。對冷啟動與逐次呼叫延遲做基準測試。替純本地使用挑出贏家。
    verifies: >-
      the lesson's TOOLS served as MCP-shaped JSON-RPC over stdio and over StreamableHTTP-style POSTs
      on 127.0.0.1: 900 responses byte-identical to the in-process call, per-call median in-process <
      stdio < HTTP (about 0.03 / 0.05 / 0.14 ms locally) and best-of-7 cold start stdio < HTTP (about
      32 vs 35 ms); main.py has no socket, http or server code and dispatches TOOLS[name] in-process.
      Wall-clock, so orderings are asserted, not values
