  - index: 4
    slug: the_weakest_retriever_carries_thirty_percent_of_the_weight
    kind: code
    tier: T0
    deps_group: none
    en: |
      Design an eval spec for a trip-planner multimodal RAG. What metrics cover image recall, audio recall, and composite correctness?
    zh: |
      為一個行程規劃的多模態 RAG 設計一份評測規格。哪些指標涵蓋影像召回、音訊召回與綜合正確性？
    verifies: >-
      four metrics -- per-retriever recall@k, fused recall@k, fused precision@k and citation coverage
      -- run on the lesson's own corpus against a gold set re-derived from it rather than asserted.
      Fused recall@2 is 1.00 and precision@3 0.67, while standalone recall@2 is image 1.00, audio 1.00
      and text 0.50: the composite hides a retriever finding half the gold set. Text is the weakest
      and carries 0.3 of the weight against image's 0.4, and it is weak because r1 wins outright and
      the second slot is a three-way tie at 0.2857 between r2, r3 and r4 that sorted breaks by
      position rather than relevance, so gold r4 loses it to r2. Citation coverage is 3 of 3
      modalities on every result, 100%, and is worth measuring because it degrades silently -- drop a
      retriever and its evidence line is still printed.
  - index: 5
    slug: the_second_round_changes_no_ranking_so_the_tax_buys_nothing
    kind: code
    tier: T0
    deps_group: none
    en: |
      Agentic multi-hop RAG has a latency tax per round-trip. At what query difficulty does the accuracy gain justify the latency?
    zh: |
      代理式多跳 RAG 每來回一次就要繳一筆延遲稅。查詢要難到什麼程度，準確率的提升才划得過那份延遲？
    verifies: >-
      the lesson's own second round ranks ['r1', 'r4', 'r3'], identical to its first, moving the top
      score 0.6861 -> 0.7336 and the recall by 0.00. The trigger fires on a number the reformulation
      is guaranteed to raise: round 2 shifts 0.1 of weight into the image retriever, whose span is 1.0
      against 0.4286 and 0.425, so the top fused score rises by construction -- a thermostat wired to
      its own heater. At a floor of 0.99 the loop runs two rounds, reaches 0.7336 and returns with no
      signal that the threshold was never met. And the real condition is first-round recall, which
      exercise 4 measures at 1.00 here, so every extra round is pure tax and difficulty is not the
      variable.
