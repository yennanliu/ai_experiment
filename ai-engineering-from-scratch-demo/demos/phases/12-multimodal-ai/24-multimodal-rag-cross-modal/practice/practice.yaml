exercises:
  - index: 1
    slug: a_medical_triage_multimodal_rag
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Propose a medical-triage multimodal RAG: query = photo of injury + text symptoms. What modalities retrieve from what KB?
    zh: |
      提出一套醫療檢傷的多模態 RAG：查詢 = 傷處照片 + 文字症狀。哪些模態要從哪些知識庫檢索？
    cites: >-
      Cross-modal retrieval
  - index: 2
    slug: a_modality_with_no_opinion_still_takes_its_weight
    kind: code
    tier: T0
    deps_group: none
    en: |
      Score fusion is a simple weighted sum. What failure mode does it have that MoE fusion avoids?
    zh: |
      分數融合就是一個簡單的加權和。它有什麼失敗模式是 MoE 融合能避開的？
    verifies: >-
      a constant score is indistinguishable from a low one: on a query with no audio cue the lesson's
      audio_retrieve returns 0.5 for all five restaurants, a constant that shifts every fused score
      and changes no ranking while consuming its share of the weight budget. The same query makes
      image_retrieve return 0.0 for all five, so two of the three modalities are mute and the fusion
      is still a three-term weighted average. The three scores are also on three different scales:
      spans of 0.4286, 1.0 and 0.425, so effective weighting is the nominal weight times the spread
      and nobody computes the product. And doubling every weight cannot change a ranking but takes the
      top fused score from 0.6861 to 1.3721 -- which is the number agentic_loop compares against its
      floor.
  - index: 3
    slug: the_three_canonical_sub_problems
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Read Abootorabi et al.'s taxonomy (Section 3). What are the three canonical sub-problems and how do they map to your chosen product?
