  - index: 4
    slug: what_paligemma_two_added
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Read PaliGemma 2 paper (Google, 2024). What was the key training-data addition that lifted document accuracy vs PaliGemma 1?
    zh: |
      讀 PaliGemma 2 論文（Google，2024）。相對於 PaliGemma 1，讓文件準確率提升的關鍵訓練資料增補是什麼？
    cites: >-
      Era 3 — VLM-native (2024+)
  - index: 5
    slug: a_naive_cross_check_escalates_five_million_fields_a_day
    kind: code
    tier: T0
    deps_group: none
    en: |
      Design a regulatory-safe hybrid: OCR pipeline as primary, VLM as secondary cross-check. How do you resolve disagreement?
    zh: |
      設計一套法規上安全的混合方案：OCR 管線為主，VLM 為輔做交叉核對。兩者不一致時你要怎麼裁決？
    verifies: >-
      agree-and-accept, disagree-and-escalate, and never resolve by confidence, because an OCR
      character posterior and a VLM token log-probability are different quantities on different
      scales. At a stated 2% OCR and 5% VLM per-field error with 10 plausible wrong values,
      primary-only leaves 2.000% silently wrong and the cross-check leaves 0.010% -- 200x better. But
      the disagreement rate is 6.9%, and 10M invoices at the 7 leaf fields of the lesson's own Donut
      schema is 70M fields, so a naive policy escalates 4,823,000 a day: 13,397 reviewer-hours at 10
      seconds each. Gating to the two fields that carry the risk is 1,378,000, 71% fewer -- so the
      design question is which disagreements can be afforded.
