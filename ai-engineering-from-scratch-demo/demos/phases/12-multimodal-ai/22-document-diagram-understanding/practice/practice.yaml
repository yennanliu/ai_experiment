exercises:
  - index: 1
    slug: the_table_has_one_numeric_column_and_the_question_needs_two
    kind: code
    tier: T0
    deps_group: none
    en: |
      Your project is 10M invoices per day. Which stack minimizes cost-per-page without losing accuracy?
    zh: |
      你的專案是每天 1000 萬張發票。哪套堆疊能在不犧牲準確率的前提下，把每頁成本壓到最低？
    verifies: >-
      the OCR pipeline with LayoutLMv3 at 512 tokens a page: 10M invoices is 5.12 billion input
      tokens, $1,280 a day at a stated $0.25 per million, against $30,000 for the frontier row -- a
      23.4x span. The lesson's table is not monotone in era: the cheapest era-2 row is 4,096 tokens
      and the cheapest era-3 row is 2,916, 28.8% less. And 'without losing accuracy' cannot be
      evaluated at all -- 6 rows, 1 numeric column, 0 accuracy figures. The 512 also does not cover
      the lesson's own three-stream input: layoutlm_input returns 8 text ids and 256 patch ids for an
      eight-word page, so the 16x16 grid alone is 50% of the row's budget and 97.0% of the positions.
  - index: 2
    slug: the_bbox_stream_gives_up_scale_invariance
    kind: code
    tier: T0
    deps_group: none
    en: |
      Why does LayoutLMv3 outperform pure-CLIP-VLMs on form QA but underperform at scene-text? What does the bbox stream give up?
    zh: |
      為什麼 LayoutLMv3 在表單問答上勝過純 CLIP 式的 VLM，卻在場景文字上落後？那條 bbox 串流放棄了什麼？
    verifies: >-
      a form's answer is a spatial relation between two text spans, which the one-box-per-token stream
      states directly, and a scene has no layout grammar for a box to encode. What the stream gives up
      is scale, rotation and crop invariance: the boxes are absolute pixel corners, so (100, 50, 300,
      80) becomes (200, 100, 600, 160) at twice the DPI and all 8 change, while a patch grid does not
      move. The lesson's own text stream is also not reproducible between runs -- layoutlm_input
      builds ids with hash(t.text) % 10000 and Python salts string hashing per process. And the three
      streams are 97.0% patches with no alignment stream anywhere, so the box-to-patch correspondence
      is exactly what the model must infer.
