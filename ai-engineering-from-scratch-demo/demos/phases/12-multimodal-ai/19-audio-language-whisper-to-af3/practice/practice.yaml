  - index: 3
    slug: at_initialisation_every_query_returns_the_frame_mean
    kind: code
    tier: T0
    deps_group: none
    en: |
      Audio Q-former with 64 queries vs 32: at what task complexity does 64 pay off? 32 save compute for what?
    zh: |
      64 query 的音訊 Q-former 對上 32 query：任務複雜到什麼程度，64 才划算？32 又替什麼省下了計算？
    verifies: >-
      32 saves exactly half -- 126,720 multiply-adds against 253,440 on the lesson's own 99-frame,
      20-dim fixture -- and sends half the tokens into the LLM. But at initialisation the queries
      barely differentiate: mean attention entropy is 4.411 nats against a uniform 4.595, 96.0%, so
      every query is nearly averaging the whole clip and the mean pairwise cosine between output
      tokens is 0.3299. Doubling the query count moves that cosine from 0.3381 to 0.3299, a gap of
      0.0082, so the doubling buys 2x the compute for a fourth-decimal difference. The answer is
      therefore about the training signal rather than task complexity: an untrained 64 is a strictly
      worse 32.
