  - index: 5
    slug: swapping_two_labels_costs_a_hundred_percent_or_nothing
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement a minimal diarization pipeline using AF3's output. How do you signal speaker changes?
    zh: |
      用 AF3 的輸出實作一條最小的說話者分段標記管線。你要怎麼標示說話者的切換？
    verifies: >-
      a four-field turn schema whose turns tile the timeline with no gaps and whose consecutive turns
      carry different speakers, scored under the best label permutation. Without that permutation a
      perfect transcript with S1 and S2 swapped scores a naive DER of 100.0% and a matched DER of
      0.0%, so a literal comparison measures a naming convention. The metric is boundary-sensitive in
      seconds rather than turns: one boundary moved 0.5 s in a 10-second clip costs 5.0% with the turn
      count, speaker count and order all correct. And the lesson's own table calls cascaded
      diarization 'partial' because Whisper supplies three of the four fields free and must infer the
      fourth from the words.
