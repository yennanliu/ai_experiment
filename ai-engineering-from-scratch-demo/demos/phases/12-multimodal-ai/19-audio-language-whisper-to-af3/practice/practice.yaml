exercises:
  - index: 1
    slug: the_dimension_does_not_change_at_forty_eight_kilohertz
    kind: code
    tier: T0
    deps_group: none
    en: |
      Compute the log-Mel spectrogram dimension for a 30-second clip at 16kHz, 25ms window, 10ms hop, 80 Mel bins. How does this change at 48kHz?
    zh: |
      算出一段 30 秒、16kHz、25ms 窗、10ms 跳距、80 個梅爾頻帶的片段，其對數梅爾頻譜圖的維度。換成 48kHz 會怎麼變？
    verifies: >-
      2998 x 80 at 16 kHz and 2998 x 80 at 48 kHz -- the shape does not change, because tripling the
      sample rate triples the window (400 to 1,200 samples) and the hop (160 to 480) and leaves the
      ratio that sets the frame count untouched. What changes is bandwidth: Nyquist goes 8 kHz to 24
      kHz over the same 80 bins, so a bin spans 100 Hz against 300 Hz, which is why Whisper resamples
      to 16 kHz. The lesson's window_frames runs while i + win <= len(x), so it gives 2998 where
      Whisper pads to 3,000 -- the last 20 ms of every clip discarded. And its own demo prints 98
      frames beside a comment saying 'should be ~99 at 1s'.
