lesson: 14-show-o-discrete-diffusion-unified
phase: 12-multimodal-ai
source: phases/12-multimodal-ai/14-show-o-discrete-diffusion-unified/docs/en.md
exercises:
  - index: 1
    slug: one_step_and_eight_agree_on_all_sixteen_tokens
    kind: code
    tier: T0
    deps_group: none
    en: |
      Masked discrete diffusion samples in ~16 steps. Why not 1? What breaks if you unmask everything at step 0?
    zh: |
      遮罩式離散擴散大約 16 步就取樣完。為什麼不是 1 步？如果你在第 0 步就把全部解開，會壞在哪裡？
    verifies: >-
      one step samples every position from its own marginal, so the joint becomes a product of
      marginals and all cross-position structure is lost. But the lesson's own sampler cannot show
      that: mock_logits reads the index i and the token at that same index and nothing else -- no
      neighbour, no window, no attention -- so one step and eight produce identical output, 16 of 16
      matching tokens, both the deterministic cycle (prompt_seed + i) % 8. Eight forward passes buy
      nothing. The one place a decided token is read is to add 3.0 to that same position's own value,
      which is a commitment device preventing a revisit rather than conditioning.
  - index: 2
    slug: where_inpainting_beats_a_specialist
    kind: explain
    tier: T0
    deps_group: none
    en: |
