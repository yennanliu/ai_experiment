exercises:
  - index: 1
    slug: the_twenty_two_million_is_a_different_encoder
    kind: code
    tier: T0
    deps_group: none
    en: |
      Compute the trainable-parameter count for the 2-layer MLP projector at `1024 → 4096 → 4096`. With GELU and bias, what fraction of LLaVA-13B does it represent?
    zh: |
      算出 `1024 → 4096 → 4096` 這個兩層 MLP 投影器的可訓練參數量。含 GELU 與偏置，它佔 LLaVA-13B 的多少比例？
    verifies: >-
      20,979,712 parameters at 1024 -> 4096 -> 4096 with bias, 0.161% of LLaVA-13B, with the formula
      checked against the lesson's own MLPProjector.num_params() at three small shapes. GELU
      contributes 0 and the biases 8,192. The lesson's takeaway prints 22M, which only a 1408-wide
      encoder produces (22,552,576) -- the EVA/BLIP-2 width, not the CLIP ViT-L 1024 the exercise
      names; SigLIP's 1152 gives 21,504,000. The second layer is 4096 -> 4096 and holds 16,781,312 of
      the total, 80%, while the first already performs the only mapping the projector exists for, so a
      single linear would be 5.0x smaller. And the fraction is the wrong measure: the same projector
      emits 576 tokens an image, 28.1% of a 2,048-token context.
  - index: 2
    slug: a_refusal_prompt_and_what_would_reinforce_it
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Construct a LLaVA prompt for a "refusal" case — the image contains a private individual. Write the expected assistant response. Why should LLaVA refuse this zero-shot and what training data would be needed to reinforce the refusal?
    zh: |
