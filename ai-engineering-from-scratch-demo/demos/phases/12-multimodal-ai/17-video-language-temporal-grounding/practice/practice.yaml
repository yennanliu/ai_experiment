exercises:
  - index: 1
    slug: the_budget_parameter_cannot_reach_the_budget
    kind: code
    tier: T0
    deps_group: none
    en: |
      For a 3-minute cooking demo, pick uniform vs dynamic FPS. Justify with a token count.
    zh: |
      對一段 3 分鐘的烹飪示範，在均勻與動態 FPS 之間做選擇。用詞元數為你的選擇辯護。
    verifies: >-
      uniform, by 5.6x -- 32 frames is 2,592 tokens at Lesson 12.08's pooled 81 a frame, while the
      dynamic sampler asked for the same 32 returns 180 frames and 14,580 tokens, 44.5% of a 32k
      context. total_budget bounds nothing: the per-second allocation is min(fps_cap, max(1,
      round(raw))), so at 180 seconds the reachable range is 180 to 720 frames -- 1 to 4 FPS -- and
      budgets of 8 and 32 both return 180. The lesson's own demo overshoots its stated budget by 25%,
      returning 15 frames for a printed 12, because six of its ten seconds round to 0 and are lifted
      by the max. So the justification is the floor, not the motion: a low-motion video is exactly the
      case the floor protects.
