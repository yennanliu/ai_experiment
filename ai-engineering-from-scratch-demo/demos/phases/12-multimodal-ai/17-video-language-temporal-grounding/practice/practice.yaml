  - index: 3
    slug: sixty_guesses_score_one_point_zero_and_the_honest_three_score_a_third
    kind: code
    tier: T0
    deps_group: none
    en: |
      Write a JSON schema for temporal grounding that a VLM can learn to emit. Include error cases.
    zh: |
      為時間接地寫一份 VLM 學得會吐出來的 JSON schema。要涵蓋錯誤情境。
    verifies: >-
      a four-field schema inside an events/duration envelope under three constraints, each justified
      by running the lesson's own evaluator on the case it rules out. A zero-length event scores 0.0
      when it is exactly right, because iou returns 0 on a zero union. A reversed interval scores 0.0
      and raises nothing. One prediction is credited for two ground-truth events -- a single jump at
      [4.1, 4.6] scores 0.667 against both [4.0, 4.5] and [4.2, 4.7], recall 1.0 -- because matching
      is by label with no assignment step. And the whole metric is recall: 60 half-second windows with
      no model involved score 1.0 while the lesson's own three honest predictions score 0.333 on its
      own demo, and a prediction matching no ground truth costs nothing.
