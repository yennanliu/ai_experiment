  - index: 5
    slug: the_lesson_names_four_benchmarks_and_reports_zero_scores
    kind: code
    tier: T0
    deps_group: none
    en: |
      Given the VideoMME leaderboard, what is the gap between the top open model and the top proprietary model as of 2026? How much of that gap is attributable to temporal encoding vs base LLM scale?
    zh: |
      看 VideoMME 排行榜，截至 2026 年，最強的開放模型與最強的專有模型之間差距多大？這道落差有多少能歸因於時間編碼、多少歸因於基礎 LLM 的規模？
    verifies: >-
      the gap cannot be computed here: the lesson names four benchmarks and carries 0 two-decimal
      scores anywhere in its text, and its arch_compare table has 5 rows and no benchmark column. Its
      one numeric column spans 4x -- 8 to 32 frames, or 648 to 2,592 visual tokens at Lesson 12.08's
      pooled rate -- and every row also differs in compressor, so no two of the five isolate anything.
      By Lesson 12.07's variance weights the attribution splits 4 to 1 toward tokens, 60% against 15%,
      as a stated extrapolation. But those weights are 6 additive terms with 0 products of any two, so
      a question about how the two axes interact has no term to land in -- and they sum to 115%.
