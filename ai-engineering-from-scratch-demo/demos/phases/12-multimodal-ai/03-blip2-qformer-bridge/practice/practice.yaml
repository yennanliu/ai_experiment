  - index: 5
    slug: both_of_them_fit_so_the_question_starts_at_227_frames
    kind: code
    tier: T0
    deps_group: none
    en: |
      For a 10-minute video at 1 FPS sampled to 60 frames, compute the per-frame token cost at (Q-Former → 32 tokens/frame) vs (MLP projector → 576 tokens/frame). Which fits into a 128k-token LLM context window?
    zh: |
      對一段 10 分鐘、以 1 FPS 取樣成 60 個畫格的影片，算出（Q-Former → 每畫格 32 詞元）與（MLP 投影器 → 每畫格 576 詞元）之下每畫格的詞元成本。哪一個塞得進 128k 詞元的 LLM 脈絡視窗？
    verifies: >-
      60 frames is 1,920 tokens through the Q-Former (1.5% of a 128k window) and 34,560 through the
      576-token projector (26.4%) -- both fit, so the question the exercise asks does not
      discriminate. 10 minutes at 1 FPS is 600 frames, so '60 frames' is a 10x decimation applied
      before either bridge is chosen; unsampled, the projector needs 345,600 tokens, 2.64x the window,
      and only the Q-Former survives. The question begins at 227 frames -- 3m47s of video against the
      Q-Former's 4,096 frames and 68m16s, a span of 18.04x. And 576 is LLaVA's 24x24 grid, not this
      lesson's 256-token ViT, which caps the video at 512 frames instead.
