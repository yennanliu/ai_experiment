lesson: 12-emu3-next-token-for-generation
phase: 12-multimodal-ai
source: phases/12-multimodal-ai/12-emu3-next-token-for-generation/docs/en.md
exercises:
  - index: 1
    slug: a_video_frame_costs_four_times_the_same_sized_still
    kind: code
    tier: T0
    deps_group: none
    en: |
      Emu3 produces 4096 tokens per 512x512 image at 8x8 reduction. Compute the equivalent for 1024x1024 and 2048x2048. What happens to inference latency?
    zh: |
      Emu3 在 8x8 縮減之下，每張 512x512 影像產生 4096 個詞元。算出 1024x1024 與 2048x2048 的對應數字。推論延遲會怎麼變化？
    verifies: >-
      16,384 and 65,536 tokens, which at the lesson's own 30 tokens per second is 2:16, 9:06 and 36:24
      -- quadratic in the side. The constant rate is the optimistic bound: an autoregressive decode of
      N tokens touches N(N+1)/2 attention pairs, 8,390,656 at 4,096 and 2,147,516,416 at 65,536, so a
      16x token count carries 255x the attention work. One 2048x2048 image is 32.0 GiB of KV cache at
      512 KiB a token. And the lesson's video rows pass reduction 4 where its image rows pass 8, a 4x
      spatial factor before any frame arithmetic, so a 4-second 512x512 clip is 131,072 tokens -- 2.0x
      the 2048x2048 image and 32x the 512x512 still.
  - index: 2
    slug: why_the_video_patch_is_four_by_four_by_four
    kind: explain
    tier: T0
