    cites: >-
      JanusFlow — the rectified flow variant
  - index: 4
    slug: a_fourth_decoupled_encoder
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Propose a fourth task the Janus-Pro architecture could handle with one more decoupled encoder. Examples: image segmentation (DINO-style), depth (MiDaS-style).
    zh: |
      提出第四項任務，讓 Janus-Pro 的架構只要再多一個解耦編碼器就能處理。例如：影像分割（DINO 風格）、深度（MiDaS 風格）。
    cites: >-
      Decoupled visual encoding
  - index: 5
    slug: four_axes_moved_and_the_table_has_no_ablation
    kind: code
    tier: T0
    deps_group: none
    en: |
      Read Janus-Pro Section 4.2 on data scaling. Which data stage contributes most to the T2I quality gain vs Janus?
    zh: |
      讀 Janus-Pro 第 4.2 節關於資料規模的部分。相對於 Janus，哪一個資料階段對 T2I 品質的提升貢獻最大？
    verifies: >-
      stage 2, the unified stage, at +176.9% -- 26M pairs to 72M -- which leads on the absolute
      reading too, 46M new pairs against 18M and 0.2M. Stage 3's +16.7% is in a different unit:
      instructions rather than pairs, 200,000 against 46,000,000, a 230x difference the percentage
      column hides. Four axes separate the two columns -- three data stages and a 5.4x parameter
      increase -- and the table has 6 rows and 0 ablations, so attributing the +0.19 GenEval to stage
      2 is not identified by this evidence. And the one axis that could be subtracted cannot be:
      Lesson 12.07 measured +7 MMMU per decade but has no GenEval-per-decade row.
