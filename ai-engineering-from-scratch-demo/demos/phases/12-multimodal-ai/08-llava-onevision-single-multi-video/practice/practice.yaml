lesson: 08-llava-onevision-single-multi-video
phase: 12-multimodal-ai
source: phases/12-multimodal-ai/08-llava-onevision-single-multi-video/docs/en.md
exercises:
  - index: 1
    slug: the_saving_the_exercise_asks_about_does_not_exist
    kind: code
    tier: T0
    deps_group: none
    en: |
      Your product supports 80% single-image, 10% multi-image (2-4 images), 10% video (8-16 frames). Design the token budget. Where would you put the extra budget you save from not doing heavy multi-image?
    zh: |
      你的產品有 80% 單影像、10% 多影像（2 到 4 張）、10% 影片（8 到 16 個畫格）。設計那份詞元預算。既然不必做吃重的多影像，省下來的預算你會放到哪裡？
    verifies: >-
      the lesson's three planners return 1,690 / 1,352 / 2,592 at a 4,096-token budget, and the
      80/10/10 mix weights them to 1,746.4 per sample -- 57.4% of the budget never spent, so there is
      nowhere to put a saving. Multi-image is also the CHEAPEST of the three, so dropping it moves the
      expected cost by +43.8 rather than freeing anything. The planners maximise count rather than
      tokens: their loops run count outer and resolution inner, so single-image returns 9 pooled tiles
      at 41.3% of budget when 4 unpooled tiles at 89.0% also fit, and multi-image 33.0% against 71.2%.
      The three plans span 1,240 tokens, 30.3% of the budget, printed directly above a line requiring
      under 30%.
