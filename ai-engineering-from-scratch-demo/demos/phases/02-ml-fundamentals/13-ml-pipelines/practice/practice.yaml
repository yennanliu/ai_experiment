lesson: 13-ml-pipelines
phase: 02-ml-fundamentals
source: phases/02-ml-fundamentals/13-ml-pipelines/docs/en.md
exercises:
  - index: 1
    slug: scratch_encoder_crashes_on_a_missing_category
    kind: code
    tier: T0
    deps_group: math
    en: |
      Build a pipeline that handles a dataset with 3 numeric columns and 2 categorical columns. Use `ColumnTransformer` to apply median imputation + scaling to numerics and most-frequent imputation + one-hot encoding to categoricals. Train with 5-fold cross-validation.
    zh: |
      打造一條管線，處理一個有 3 個數值欄位與 2 個類別欄位的資料集。用 `ColumnTransformer` 對數值欄位套用中位數補值＋縮放，對類別欄位套用最常見值補值＋one-hot 編碼。用 5 折交叉驗證訓練。
    verifies: >-
      a ColumnTransformer (median impute + scale on age, income, score; most-frequent impute + one-hot
      on city, plan) feeding logistic regression scores 0.758 +/- 0.012 under shuffled 5-fold CV on
      the lesson's make_mixed_data(500); the lesson's own FullPipeline scores 0.756 under its
      cross_validate_pipeline. The lesson's pipeline has no categorical imputer: with 5% of city set
      to None or NaN its OneHotEncoder.fit raises TypeError twice, while the sklearn pipeline imputes
      and scores 0.760. On the clean data (26, 12, 0, 0, 0 missing) the sklearn preprocessor matches
      the lesson's num_pipeline + cat_encoder within 5.8e-15 over 11 columns
    uses_reference:
      - make_mixed_data
      - FullPipeline
      - cross_validate_pipeline
      - LogisticRegressionSimple
      - DecisionTreeSimple
  - index: 2
    slug: scaler_leak_moves_no_fold_score
    kind: code
    tier: T0
    deps_group: math
    en: |
      Deliberately introduce data leakage: fit the scaler on the full dataset before splitting. Compare the cross-validation score (leaky) to the pipeline cross-validation score (clean). How large is the difference?
    zh: |
      刻意製造資料洩漏：在切分之前就用完整資料集配適 scaler。把這個（會洩漏的）交叉驗證分數跟管線版（乾淨的）交叉驗證分數比一比。差距有多大？
    verifies: >-
      with the lesson's numeric imputer + scaler fit once on all 500 rows and frozen, the lesson's
      cross_validate_pipeline gives fold scores identical to the clean pipeline in all four runs: tree
      0.724 and 0.712, logistic 0.756 and 0.752 on seeds 42 and 99 (max per-fold gap 0); a fold's
      scaler mean sits at most 0.04 sd from the full-data mean. docs/en.md says this leak 'inflates
      accuracy estimates'. A label-using leak does: top-20 of 2000 pure-noise features chosen on all
      200 rows scores 0.735 under 5-fold CV against 0.490 when chosen inside each fold, mean of 3
      seeds
    uses_reference:
      - make_mixed_data
      - FullPipeline
      - cross_validate_pipeline
      - TransformerPipeline
      - MedianImputer
      - StandardScaler
      - DecisionTreeSimple
      - LogisticRegressionSimple
  - index: 3
    slug: scratch_pipeline_pickle_needs_its_module
    kind: code
    tier: T0
    deps_group: math
    en: |
      Serialize your pipeline with `joblib.dump`. Load it in a separate script and run predictions. Verify the predictions are identical.
    zh: |
      用 `joblib.dump` 序列化你的管線。在另一個獨立的腳本裡載入它並跑預測。驗證預測結果完全一致。
    verifies: >-
      a sklearn ColumnTransformer + logistic regression pipeline fit on the lesson's 400-row train
      split, dumped with joblib and loaded by a loader script in a fresh interpreter, reproduces all
      100 test probabilities with max difference 0.0 and identical labels. The lesson's own
      FullPipeline dumps but the separate script's joblib.load raises ModuleNotFoundError, because the
      pickle names the defining module rather than carrying its code; importing code/pipeline.py under
      that module name first reproduces all 100 from-scratch predictions exactly
    uses_reference:
      - make_mixed_data
      - train_test_split_dict
      - FullPipeline
      - LogisticRegressionSimple
  - index: 4
    slug: poly_goes_after_impute_and_buys_noise
    kind: code
    tier: T0
    deps_group: math
    en: |
      Add a custom transformer to the pipeline that creates polynomial features (degree 2) for the two most important numeric columns. Where should it go in the pipeline?
    zh: |
      在管線裡加一個自訂轉換器，為最重要的兩個數值欄位建立多項式特徵（次數 2）。它應該放在管線的哪個位置？
    verifies: >-
      dropping a column from the lesson's FullPipeline (logistic, lr 0.1, 1000 steps) costs 5-fold CV
      0.064 for income, 0.040 for score, 0.002 for age, so a Square transformer (a^2, ab, b^2) takes
      income and score. Between imputation and scaling CV is 0.766 against 0.758. Before imputation it
      does not crash but the lesson's MedianImputer fills the products with their own medians, wrong
      on all 12 rows with a missing income; after scaling the unscaled squares (income's reaches 30.4)
      drop CV to 0.754. The +0.008 gain is 4 rows of 500, under the 0.012 fold spread: the lesson's
      boundary is linear
    uses_reference:
      - make_mixed_data
      - FullPipeline
      - cross_validate_pipeline
      - TransformerPipeline
      - MedianImputer
      - StandardScaler
      - LogisticRegressionSimple
  - index: 5
    slug: lesson_log_truncates_n_iter_away
    kind: code
    tier: T0
    deps_group: math
    en: |
      Set up MLflow tracking for the pipeline. Run 5 experiments with different hyperparameters. Use the MLflow UI (`mlflow ui`) to compare runs and pick the best model.
    zh: |
      為這條管線設定 MLflow 追蹤。用不同的超參數跑 5 次實驗。用 MLflow UI（`mlflow ui`）比較各次執行，挑出最好的模型。
    verifies: >-
      mlflow is not a dependency, so a tracker writes MLflow's file-store layout to a temp dir and a
      reader ranks the runs; the 5 configs are parsed from the lesson's demo_experiment_tracking. Run
      5 (logistic, lr 0.1, n_iter 1000) wins at 0.758 against 0.744, 0.724, 0.684, 0.684, and wins on
      all 5 CV seeds 0-4. The lesson's own table prints str(config)[:40] of 48-character logistic
      configs, so 0 of 2 rows show n_iter's value; the store keeps all 12 params. Only lr x n_iter
      matters: (0.01, 500), (0.1, 50), (0.001, 5000) give identical fold scores (0.744), as do (0.1,
      1000) and (1.0, 100) (0.758)
    uses_reference:
      - make_mixed_data
      - FullPipeline
      - cross_validate_pipeline
      - demo_experiment_tracking
      - DecisionTreeSimple
      - LogisticRegressionSimple
