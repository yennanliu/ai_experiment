exercises:
  - index: 1
    slug: clipping_not_crowding_breaks_iou
    kind: code
    tier: T0
    deps_group: math
    en: |
      **(Easy)** Run the synthetic tracker above with 3, 10, and 30 objects. Report ID-switch count in each case. Identify where the simple IoU-only association starts to fail.
    zh: |
      **（簡單）** 用上面的合成追蹤器分別跑 3、10、30 個物件。回報每一種情況的身分切換次數。指出單靠 IoU 的資料關聯從哪裡開始失效。
    verifies: SimpleTracker scores 0, 2 and 18 ID switches at 3, 10 and 30 objects, minting 3, 10 and 120 track IDs and ending with 3, 10 and 70 alive. The 30-object failure is boundary clipping, not association: synthetic_frames clamps with max(0.0, cx - 10), so 83 of 750 boxes have non-positive width or height, from 8 of the 30 objects, and bbox_iou scores each 0.0 against everything. A control of 60 objects at up to 3.0 px/frame with every box wholly inside a 4000px canvas gives 60 IDs and 0 switches, so crowding is not the failure mode. The 2 switches at 10 objects are one mutual crossing on frame 8 at IoU 1.0000, charged twice because MOT counts IDSW per ground-truth track. Motion never reaches the gate here: the tightest frame-to-frame self-overlap is 0.4782 against a 0.30 gate, and a 20px box crosses 0.30 only at a 10.77px shift (0.538 box widths) and reaches 0.0 at exactly one box width. Two tracks on one box make every Hungarian cost 0.4615 with both pairings at 0.9231, and the same two detections in the two possible orders send track 1 to x1=-6 or x1=6
  - index: 2
    slug: predict_step_helps_only_under_max_age
    kind: code
    tier: T0
    deps_group: math
    en: |
      **(Medium)** Add a constant-velocity Kalman predict step before association. Show that short (2-3 frame) occlusions no longer cause ID switches.
    zh: |
      **（中等）** 在資料關聯之前加上等速卡爾曼的預測步驟。證明短暫（2-3 幀）的遮擋不再造成身分切換。
    verifies: over occlusion gaps 1-6 the lesson's tracker scores [0, 2, 3, 4, 4, 5] ID switches on [5, 7, 8, 9, 9, 10] IDs for 5 objects, and with a constant-velocity Kalman predict step before association [0, 0, 0, 0, 0, 5] on [5, 5, 5, 5, 5, 10] -- the 2- and 3-frame cases the exercise names go from 2 and 3 switches to 0. The plain arm fails exactly where the frozen box falls through the 0.30 gate: the count below it, [0, 2, 3, 4, 4, 4], equals the surplus IDs for every gap up to 5. After two-point initialisation the prediction is exact -- 4.55e-13px one-step over the run and 2.27e-13px coasting 6 frames with no measurement -- and the innovation inside the tracker is 0.000244px, exactly one float32 ULP at 2316px, because SimpleTracker.step downcasts detections to float32; scaling the measurement noise 1000x changes nothing. The repair stops at max_age: at a 6-frame gap both arms score 5 switches on 10 IDs, identically. On constant acceleration 0.5 px/frame^2 the same filter lags -0.2500, -0.5000 ... -6.2851px, growing every step, so the exactness belongs to the fixture, not the filter
  - index: 3
    slug: mota_unbounded_below_idsw_blind
    kind: code
    tier: T0
    deps_group: math
    en: |
      **(Hard)** Integrate SAM 2's memory-based tracker (via `transformers`) as an alternative tracker backend. Run both SimpleTracker and SAM 2 on a 30-second clip of a crowd and compare ID-switch counts, manually labelling ground-truth IDs for 5 salient people.
    zh: |
      **（困難）** 把 SAM 2 的記憶式追蹤器（透過 `transformers`）接成另一個追蹤後端。在一段 30 秒的人群影片上同時跑 SimpleTracker 與 SAM 2，手動為 5 個顯眼的人標出真實身分，比較兩者的身分切換次數。
    verifies: transformers and sam2 both raise ModuleNotFoundError and the lesson ships no crowd clip or labelled identities, so the comparison has one arm: ID switches 0, 2, 18 at 3, 10, 30 objects for MOTA 1.000, 0.992, 0.260. ID-switch count ranks nothing here -- a tracker emitting k identically-placed copies of every box keeps count_id_switches at 0 for k up to 9 while MOTA reads 1.000, 0.000, -1.000, -3.000, -7.000, exactly 2 - k, because MOTA = 1 - (FN + FP + IDSW)/GT and FP has no ceiling. The lesson's own worst case stays positive at MOTA 0.260 (FN 83 + FP 454 + IDSW 18 over 750), so the negative has to be forced. An ID switch and a fragmentation are different events: the crossing at 10 objects is IDSW 2 / FRAG 0 / MOTA 0.992, while an object stepping 12px aside for the 2 frames its detector misses it is IDSW 0 / FRAG 1 / FN 2 / MOTA 0.800 under a single track ID -- and count_id_switches scores that fragmented run 0, the same as a flawless one
