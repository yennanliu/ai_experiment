lesson: 26-monocular-depth
phase: 04-computer-vision
source: phases/04-computer-vision/26-monocular-depth/docs/en.md
exercises:
  - index: 1
    slug: grayscale_png_erases_metric_scale
    kind: code
    tier: T1
    deps_group: vision
    en: |
      **(Easy)** Run Depth Anything V2 on any 10 images of your desk. Save depth as grayscale PNGs and inspect. Identify one object whose predicted depth looks wrong and explain why the monocular cues failed.
    zh: |
      **（簡單）** 對你書桌的任意 10 張照片跑 Depth Anything V2。把深度存成灰階 PNG 並檢視。找出一個預測深度看起來明顯錯掉的物體，並解釋是哪些單目線索失效了。
    verifies: >-
      depth_anything_v2, transformers and timm all raise ModuleNotFoundError and no weights are
      fetched, so the only prediction available is main()'s gt + 0.4*randn, which reads no image and
      has no monocular cue to fail -- its mean over the object is 2.0031 m against a true 2.0. The
      prescribed inspection medium is the destructive step: per-image min-max to 8-bit is exactly the
      affine family align_scale_shift fits, so five metric scenes spanning 1.00-4.96 m, 10.25-11.24 m
      and 8.00-55.50 m encode to 1 distinct 211-byte PNG, while moving the object -- a non-affine edit
      -- gives 5 distinct PNGs of 5. Gray level 128 decodes to 2.99, 9.66, 10.75, 31.84 and 5.97 m
      across those images, a 10.7x spread. The lesson's own metrics are equally blind: a real PNG
      round trip moves aligned absRel 0.130487 -> 0.130497 and raw absRel 0.136754 -> 0.136782,
      asserted equal to 1e-3, the only measurable cost being the 0.02485 m quantisation step over a
      6.337 m span. 0.50% of the object's 992 pixels read farther than the 3.396 m ramp behind them,
      which is 0.4 sigma of noise on a 1.396 m contrast, not a cue failure
  - index: 2
    slug: scale_invisible_shift_bends
    kind: code
    tier: T1
    deps_group: vision
    en: |
      **(Medium)** Given RGB + depth from Depth Anything V2, lift to a point cloud and render with `open3d`. Compare two scenes (indoor / outdoor) and note which looks more believable.
    zh: |
      **（中等）** 拿 Depth Anything V2 的 RGB + 深度，提升成點雲並用 `open3d` 渲染。比較兩個場景（室內／室外），記下哪一個看起來更可信。
    verifies: >-
      open3d raises ModuleNotFoundError, so believability is scored as cloud geometry instead; the
      lift itself is exact, reprojecting through main()'s own (96, 96, 48, 48) pinhole to 0.0e+00. A
      pure scale is a similarity of the point cloud -- all 62,250 sampled pairwise distances keep
      their proportions, max/min ratio exactly 1.000000000000 for a=2.0 and 1.9e-06 off for a=1.7,
      which is the float32 cast and not geometry, so the identity is asserted at 1e-5 -- and no render
      can grade the a in a*d + b. A shift is not: b=1.0 spreads the same distances 2.0982x and b=0.7
      spreads them 1.3806x, because x = (u - cx) * z / fx carries z as a factor. The outdoor scene
      therefore looks more believable by 8.9x: the same 0.5 m shift bends a 1-5 m plane to flatness
      0.03296 and a 10-50 m plane to 0.00371, while doubling either leaves them at 2.092e-08 and
      1.987e-08. The lesson's own synthetic_depth is not a scene a pinhole could see -- depth linear
      in image row lifts to flatness 0.188207 against 2.1e-08 for a real plane, whose disparity is
      what is linear in row
  - index: 3
    slug: affine_alignment_invents_the_delta
    kind: code
    tier: T1
    deps_group: vision
    en: |
      **(Hard)** Take five pairs of images that differ only by a known object's position (e.g. bottle moved 30 cm closer). Use UniDepth to predict metric depth on both. Report the predicted distance delta vs the true 30 cm.
    zh: |
      **（困難）** 拍五組影像對，每組只差在某個已知物體的位置（例如瓶子往前移動 30 公分）。用 UniDepth 對兩張都預測度量深度。回報預測出的距離差與真實的 30 公分差多少。
    verifies: >-
      unidepth raises ModuleNotFoundError, so the only route to metres is align_scale_shift, which
      least-squares fits a*pred + b against the ground-truth depth the exercise is asking you to
      measure. Five pairs at 1.6, 2.0, 2.4, 3.0 and 4.0 m, each moved exactly 30 cm closer, come back
      as 90.9, 59.8, 40.0, 25.2 and 15.3 cm -- errors 60.9, 29.8, 10.0, -4.8 and -14.7 cm, worst 60.9
      cm, crossing the truth between 2.4 and 3.0 m so one pair is exact by luck. The missing step is
      the reciprocal: fitting the same function against 1/gt and inverting gives 30.0, 30.0, 29.8,
      30.1 and 29.9 cm, within 0.19 cm, and drops absRel from 0.2461 to 0.00292. The prediction
      contributes no scale at all -- c*pred + d for (1.0, 0.0), (5.0, -3.0) and (-1.0, 7.0), a sign
      flip included, all return 59.759 cm, identical to 1e-4 and asserted at 1e-3 -- though the
      ill-conditioned c=0.02, d=100.0 returns 1.6161 cm, so the identity is float32-fragile and must
      not be asserted tighter. delta<1.25 scores 1.0000 on all five pairs despite the physical move,
      and sweeping the base distance over 1.40-1.60 m it fires only at 1.40, 1.45 and 1.50, exactly
      where base/(base - 0.3) reaches 1.25; the drop there is 0.0549 = 225/4096, the object's pixel
      share
