lesson: 16-text-generation-pre-transformer
phase: 05-nlp-foundations-to-advanced
source: phases/05-nlp-foundations-to-advanced/16-text-generation-pre-transformer/docs/en.md
exercises:
  - index: 1
    slug: local_plausibility_is_one_by_construction
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Easy.** Train a trigram LM on a 1,000-sentence Shakespeare corpus. Generate 20 sentences. They will be locally plausible but globally incoherent. This is the canonical demo.
    zh: |
      **簡單。** 在一個 1,000 句的莎士比亞語料庫上訓練一個 trigram 語言模型。生成 20 個句子。它們在局部說得通，但整體不連貫。這是最經典的示範。
    verifies: >-
      the first half of the exercise's prediction is a theorem. A trigram sampler draws only from
      continuations it has counted, so across 20 generated sentences all 157 trigrams and all 157
      bigrams are attested in training -- 'locally plausible' is 1.0000 and could not have been
      otherwise, so the demo cannot fail at the half it is run to show. The second half is real and
      smaller than implied: 9 of the 20 outputs are training sentences reproduced word for word, so
      45% of the generation is retrieval, and the eleven that are new are new by splicing two training
      sentences at a shared bigram. Mean generated length is 6.85 tokens over a 30-word vocabulary,
      inherited from the corpus along with everything else. The lesson also ships only second-order
      machinery -- train_bigrams, kneser_ney_prob and laplace_prob all take a single previous token --
      where the exercise asks for a trigram model in its first sentence and again in exercise 3
    uses_reference:
      - tokenize
      - train_bigrams
  - index: 2
    slug: the_direction_of_the_result_is_a_preprocessing_choice
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Medium.** Implement perplexity for your KN model on a held-out Shakespeare split. Compare against Laplace. You should see KN lower perplexity by 30-50%.
    zh: |
      **中等。** 為你的 KN 模型在保留的莎士比亞切分上實作困惑度。跟 Laplace 比一比。你應該會看到 KN 把困惑度降低 30-50%。
    verifies: >-
      no Shakespeare corpus ships, so the corpus is 725 sentences from this phase's own lesson
      documents over a 1683-word vocabulary, split 80/20. On the open vocabulary Kneser-Ney scores
      perplexity 6763.22 against Laplace's 821.35 -- eight times worse, where the exercise predicts
      30-50% better. Restricted to the 22 test sentences whose every token was seen, it reverses to
      125.48 against 589.62, a 78.7% reduction past the top of the predicted band; replacing unseen
      tokens with a frequent one gives 78.3%. The claim and its opposite come from the same two
      functions on the same corpus, and the deciding step is out-of-vocabulary handling, which the
      exercise never mentions. The cause is that kneser_ney_prob's continuation term is
      len(contexts[w]) / total_unique_bigrams, zero for a word never seen, so with a zero bigram count
      the probability is zero: 369 of 2042 held-out tokens are out of vocabulary (18.1%) and 289
      positions (14.2%) get probability zero, clamped to 1e-12. Laplace has its own defect running the
      other way -- it divides by unigrams[prev] + vocab_size where it needs prev's count as a context,
      so on a three-sentence corpus '</s>' sums to 0.8235 rather than 1, while Kneser-Ney sums to
      exactly 1.0 for every context tested
    uses_reference:
      - tokenize
      - train_bigrams
      - kneser_ney_prob
      - laplace_prob
      - perplexity
  - index: 3
    slug: the_context_the_ranker_needs_is_the_context_it_lacks
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Hard.** Build a trigram spell corrector: given a misspelled word and its context, generate corrections and rank by context probability under the LM. Evaluate on the Birkbeck spelling corpus (public).
    zh: |
      **困難。** 打造一個 trigram 拼字校正器：給定一個拼錯的詞及其上下文，產生候選修正，並依語言模型下的上下文機率排序。在 Birkbeck 拼字語料庫（公開）上評估。
    verifies: >-
      the Birkbeck corpus is not in this checkout, so the 25 evaluation cases are generated by
      corrupting a training word into a non-word that still has three or more real neighbours at edit
      distance one -- 3.68 candidates on average over a 40-word vocabulary of deliberately confusable
      words. That construction is necessary: without confusable words the candidate set has one member
      and no ranker is consulted. Unigram frequency scores 0.3200 and bigram probability under the
      lesson's Kneser-Ney scores 0.7200, with candidate generation never failing (25 of 25 recall, 0
      single-candidate cases). Where the model earns those ten corrections is the point: on the 19
      cases whose correct bigram appeared in the 18 training sentences it is right 16 times against
      frequency's 7, an edge of 0.4737; on the 6 whose bigram did not, 2 against 1, an edge of 0.1667.
      On an unseen context Kneser-Ney falls back to its continuation term, a unigram-like signal --
      which is what the frequency ranker already was -- so the back-off is the half of the system that
      handles the hard cases. Conditioning on two previous tokens instead of one would move cases from
      the seen column to the unseen one
    uses_reference:
      - tokenize
      - train_bigrams
      - kneser_ney_prob
