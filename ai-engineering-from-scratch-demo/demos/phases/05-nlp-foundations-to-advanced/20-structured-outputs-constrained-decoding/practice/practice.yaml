lesson: 20-structured-outputs-constrained-decoding
phase: 05-nlp-foundations-to-advanced
source: phases/05-nlp-foundations-to-advanced/20-structured-outputs-constrained-decoding/docs/en.md
exercises:
  - index: 1
    slug: valid_json_is_not_compliance
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Easy.** Prompt a small open-weights model (e.g., Llama-3.2-3B) without constrained decoding for `Review(sentiment, confidence, evidence_span)`. Measure the fraction that parse as valid JSON on 100 reviews.
    zh: |
      **簡單。** 在不用受限解碼的情況下，提示一個小型開放權重模型（例如 Llama-3.2-3B）產生 `Review(sentiment, confidence, evidence_span)`。在 100 則評論上量出能解析成合法 JSON 的比例。
    verifies: >-
      no open-weights runtime is installed -- transformers, torch, llama_cpp, vllm and outlines are
      all absent -- so the rate cannot be measured, but the metric and the sample size can be. The
      metric over-reports: over 14 outputs covering the failure modes small models produce, 10 parse
      as JSON and only 2 satisfy Review(sentiment, confidence, evidence_span), so 8 are valid JSON and
      not a Review. A bare scalar is a complete JSON document -- 'positive' parses and so does {} --
      which is the gap, not exotic malformed output. It is not parser-independent either: json.loads
      accepts NaN and Infinity where RFC 8259 does not, giving 10 against 9 on the same corpus. And
      100 reviews buys an interval: a clean 100/100 gives a 95% Wilson interval of (96.3, 100.0), so
      the rule of three bounds the true failure rate only at 3.0%, while 80/100 gives (71.1, 86.7);
      certifying 99% needs 300 clean samples and 99.9% needs 3000. The lesson's own baseline repeats
      the mistake -- generate_unconstrained has an exactly computable rate of 0.0031863, measured 4 of
      1000, and main() prints its result at n=20 where an all-invalid run is the modal outcome at
      93.8%. Finally the requested schema puts sentiment before evidence_span, the exact field order
      the lesson's own pitfall section warns against
    uses_reference:
      - PHONE_REGEX
      - generate_unconstrained
  - index: 2
    slug: one_arm_cannot_vary_and_latency_goes_backwards
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Medium.** Same corpus with Outlines JSON mode. Compare compliance rate, latency, and semantic accuracy.
    zh: |
      **中等。** 同一份語料改用 Outlines 的 JSON 模式。比較合規率、延遲與語意正確度。
    verifies: >-
      outlines, vllm, xgrammar, lmformatenforcer and instructor are all absent, so the comparison runs
      against the lesson's own FSM decoder -- the construction Outlines compiles a schema into. Of the
      three axes named, one has nothing to compare, one moves the opposite way from the lesson's
      claim, and one cannot move at all. Compliance: the constrained arm is 1000/1000 and could not be
      less, since generate_constrained samples only from characters valid_next returned; the
      unconstrained arm is 4/1000 against an exactly computable 0.0031863 for 12 draws over 11
      characters. Latency: both arms call fake_llm_logits exactly 12 times per sample -- masking
      happens after the forward pass, not instead of it -- and the constrained arm adds 132 masked
      logit positions, measuring about 1.2x slower. States 3 and 7 have one legal character each, so
      the skip the lesson credits for its speedup would save 16.7% of forward passes and this code
      saves none; at a 100k vocabulary the mask sweep is 1,200,000 positions per sample rather than
      132. Semantic accuracy: at the 10 unforced positions all ten digits stay legal, so the digits
      come out uniform at chi-square 15.63 against 16.92 at 9 degrees of freedom -- the constraint
      buys format and nothing else
    uses_reference:
      - PHONE_REGEX
      - PhoneFSM
      - fake_llm_logits
      - mask_logits
      - generate_constrained
      - generate_unconstrained
  - index: 3
    slug: a_validity_test_cannot_see_a_tight_constraint
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Hard.** Implement a regex-constrained decoder from scratch for phone numbers (`\d{3}-\d{3}-\d{4}`). Verify 0 invalid outputs on 1000 samples.
    zh: |
      **困難。** 從零實作一個受正規表達式約束的解碼器，用來產生電話號碼（`\d{3}-\d{3}-\d{4}`）。驗證 1000 個樣本中有 0 個不合法輸出。
    verifies: >-
      the decoder already ships and scores 1000/1000, so the question is what that run establishes.
      Three mutations of PhoneFSM run through the shipped generate_constrained: an accept state one
      position early scores 0/1000 and an extra '-' allowed at the separator states scores 6/1000, but
      an FSM offering only the digits 0-4 scores 1000/1000 -- passing the exercise's acceptance
      criterion unchanged while able to emit 9,765,625 of 10,000,000,000 phone numbers, 0.098% of the
      space. Validity is invariant to how much of the legal space the constraint removes, so the test
      is blind in exactly the direction constrained decoding fails in production. Sample size is not
      the fix: 1000 draws touch 1e-07 of the space and produce 1000 distinct outputs, so coverage has
      to be computed from the FSM -- the product of branching factors along the accepting path --
      rather than sampled from it. The 1000 samples also cannot see that sample() ends with 'return
      len(probs) - 1', taken whenever the accumulated probability never reaches the draw: index 10 of
      this alphabet is '-', which the mask zeroes at every digit state, so the guarantee rests on
      floating-point summation reaching 1.0 rather than on the mask
    uses_reference:
      - PHONE_REGEX
      - PhoneFSM
      - sample
      - generate_constrained
