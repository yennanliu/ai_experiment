lesson: 05-supervisor-orchestrator-pattern
phase: 16-multi-agent-and-swarms
source: phases/16-multi-agent-and-swarms/05-supervisor-orchestrator-pattern/docs/en.md
exercises:
  - index: 1
    slug: the_crossover_does_not_exist_because_the_work_is_a_sleep
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py`, then modify the lead to spawn 5 workers instead of 3. Observe the wall-clock effect. At what worker count does spawn overhead exceed parallel savings in this demo?
    zh: |
      跑 `code/main.py`，然後把主導代理改成生 5 個 worker 而不是 3 個。觀察牆鐘上的效果。在這個示範裡，worker 數到多少時，生成開銷會超過平行帶來的節省？
    verifies: >-
      there is no crossover at any worker count: a thread costs tens of microseconds to start and join
      against a 0.3s sleep, so parallel wall clock is 0.3 + N x spawn against a 0.3 x N baseline and
      stays flat at N = 3, 5, 10 and 50. Replacing the sleep with a fixed count of arithmetic
      operations -- counted in operations, not wall clock, so GIL contention shows -- makes three
      threads no faster than three sequential calls. plan() returns 3 fixed suffixes for any query.
      stats['wall_clock_seconds'] is measured while '~0.9s' and '~0.35s' are string literals
  - index: 2
    slug: nothing_is_killed_and_the_cut_worker_answers_afterwards
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement a worker timeout: kill any worker that runs longer than 0.5 seconds and have the lead synthesize the remaining results. What observability do you need to know a worker was cut?
    zh: |
      實作 worker 逾時：砍掉任何跑超過 0.5 秒的 worker，並讓主導代理用剩下的結果做綜合。你需要什麼可觀測性才知道某個 worker 被砍了？
    verifies: >-
      a worker logs 2 event kinds and TraceEntry carries 4 fields, 0 of them a status or duration, so
      a cut worker is indistinguishable from a slow one in flight. Thread.join(timeout) stops nothing:
      after the deadline the abandoned worker is alive, the lead synthesizes 2 results, and once the
      worker finishes the list it synthesized from holds 3. synthesize filters None, so a 3-worker run
      with one cut is byte-identical to a 2-worker run. tokens_spent is the literal 800 assigned after
      the fetch, so the cut worker still records its full cost
  - index: 3
    slug: the_simulator_cannot_produce_the_contradiction_it_asks_you_to_find
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a conflict-detection step to the lead's synthesis: if two workers return contradictory answers, the lead notes the disagreement rather than picking one. How do you detect contradiction without calling an LLM?
    zh: |
      替主導代理的綜合加上一個衝突偵測步驟：若兩個 worker 回傳互相矛盾的答案，主導代理要註記這項分歧，而不是挑一個。不呼叫 LLM 的話，你要怎麼偵測矛盾？
    verifies: >-
      grouping (number, noun) pairs by noun detects contradiction without a model and scores 8/8 on a
      labelled set of 8 pairs, 4 positive and 4 negative. fake_web_fetch has 1 template with only the
      query interpolated, so the lead's 3 summaries reduce to 1 distinct claim set and 0 of 3 possible
      pairs conflict. The template contributes 3.0 and 5.0 to every summary while the rest of the
      corpus's numbers come from digits in the interpolated query. tokens are 800N + 1200 by
      construction
  - index: 4
    slug: read_anthropics_research_system_post
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Read Anthropic's Research-system engineering post. List three practices that this toy demo would need to adopt to run in production.
    zh: |
      讀 Anthropic 那篇 Research 系統的工程貼文。列出這個玩具示範若要在生產環境執行，需要採用的三項實務做法。
    cites: >-
      Engineering lessons (Anthropic 2025)
  - index: 5
    slug: compare_create_supervisor_to_tool_calling
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Compare LangGraph's `create_supervisor` (legacy) vs the new tool-calling recommendation. Which gives you better control over what the supervisor sees? Why does Anthropic explicitly pass only sub-answers and not raw worker context into synthesis?
    zh: |
      比較 LangGraph 的 `create_supervisor`（舊版）與新的工具呼叫建議。哪一個讓你對「supervisor 看到什麼」有更好的掌控？為什麼 Anthropic 明確地只把子答案、而不是 worker 的原始脈絡傳進綜合？
    cites: >-
      The graph-native turn
