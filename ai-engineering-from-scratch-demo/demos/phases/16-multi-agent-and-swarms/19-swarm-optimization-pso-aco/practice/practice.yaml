lesson: 19-swarm-optimization-pso-aco
phase: 16-multi-agent-and-swarms
source: phases/16-multi-agent-and-swarms/19-swarm-optimization-pso-aco/docs/en.md
exercises:
  - index: 1
    slug: iterations_saturate_at_ten_and_the_peak_they_converge_on_is_not_the_one_named
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py`. Observe LMPSO convergence. Vary population size 5, 10, 20, 50. At what size does time-to-converge saturate?
    zh: |
      跑 `code/main.py`。觀察 LMPSO 的收斂。把族群大小改成 5、10、20、50。到哪個大小時，收斂所需時間就飽和了？
    verifies: >-
      over 40 seeds, mean iterations to reach within 1e-3 of the true maximum are 14.2, 7.3, 5.7, 3.9
      at 5, 10, 20, 50 particles -- 5->10 saves more than 3x any later doubling -- and evaluations are
      76, 83, 134, 242; the demo's 20 particles converge at iteration 6 of 30. fitness(0.72, 0.40) is
      0.84 with per-axis curvature +38.5, a local minimum; the maxima sit at offsets +/-0.0997 with
      value 1.00945, where all 160 runs end
  - index: 2
    slug: the_swarm_reports_the_old_peak_forever_and_resetting_p_best_rescues_three_in_forty
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement a "catastrophic drift" experiment: after iteration 30, change the fitness function. How fast does PSO adapt? Does resetting `p_best` help?
    zh: |
      實作一次「災難性漂移」實驗：第 30 次迭代之後，改變適應度函數。PSO 適應得多快？重設 `p_best` 有幫助嗎？
    verifies: >-
      with the landscape moved from (0.72, 0.40) to (0.30, 0.75) at iteration 30 of 60, 20 particles,
      40 seeds: no reset adapts 0, re-evaluating p_best 3, plus fresh velocities 14, a restart 40 (6.2
      iterations). A port reproduces run_lmpso exactly before the drift. The reference history reads
      1.00945 from 30 to 60 while g_best's true fitness is 0.0. 58% of the square scores exactly 0
      under the moved function, the old peak included
  - index: 3
    slug: the_higher_gate_blocks_the_wrong_agent_in_one_row_and_the_right_agent_in_another
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a quality gate to AMRO-S: pheromone deposit only on runs with eval score > 0.7. How does this change convergence vs the un-gated version?
    zh: |
      替 AMRO-S 加一道品質閘門：只有評測分數 > 0.7 的執行才沉積費洛蒙。這相對於沒有閘門的版本，如何改變收斂？
    verifies: >-
      best-agent pheromone share after 200 tasks over 40 seeds, ungated/0.6/0.7: code 0.80/0.95/0.95,
      math 0.73/0.93/0.95, writing 0.84/0.95/0.95, planning 0.49/0.74/0.62; routed quality
      0.617/0.670/0.668. Code and writing are identical at 0.6 and 0.7, and at 0.76 planning stays at
      exactly 1/3. A gated-out deposit moves the normalised probabilities by 0.0
  - index: 4
    slug: read_lmpso_arxiv_2504_09247
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Read LMPSO (arXiv:2504.09247). Map the paper's "velocity as a prompt" back to your numeric velocity. What is lost in the simulation and what is preserved?
    zh: |
      讀 LMPSO（arXiv:2504.09247）。把論文裡「速度即提示詞」對映回你的數值速度。模擬中失去了什麼、又保留了什麼？
    cites: >-
      PSO on LLM outputs — LMPSO
  - index: 5
    slug: the_fast_path_saves_the_judge_not_the_pheromones_and_pays_in_staleness
    kind: code
    tier: T0
    deps_group: none
    en: |
      Read AMRO-S (arXiv:2603.12933). Implement the decoupled "inference fast-path" with asynchronous pheromone update. How does this change system latency under sustained load?
    zh: |
      讀 AMRO-S（arXiv:2603.12933）。實作那條解耦的「推論快路徑」與非同步費洛蒙更新。在持續負載下，這如何改變系統延遲？
    verifies: >-
      single FIFO server, inference 1.0 and judge 0.3, 20000 Poisson arrivals: mean latency sync/async
      2.46/1.49, 8.07/2.11, 34.4/2.41, 529.9/2.89 at loads 0.5, 0.7, 0.75, 0.8. With the judge free
      sync equals async exactly; deposit is one *= and one +=. A buffered port equals run_amro_s at
      B=1; quality falls 0.670, 0.667, 0.643, 0.614, 0.578, 0.502 at B=1, 8, 32, 64, 100, never, and
      B=64 gives up about a third of the gain over random
