      讀 MultiAgentBench（arXiv:2503.01935）。針對你自己的任務領域，判斷 MARBLE 會建議四種拓撲中的哪一種。用論文的結果來論證。
    cites: >-
      MultiAgentBench (MARBLE) — ACL 2025
