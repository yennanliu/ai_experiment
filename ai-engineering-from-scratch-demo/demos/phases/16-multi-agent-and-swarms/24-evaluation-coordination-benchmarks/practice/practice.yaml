  - index: 4
    slug: the_signal_is_the_channel_ablation_not_a_random_constant
    kind: code
    tier: T0
    deps_group: none
    en: |
      Read COMMA's finding on multimodal coordination. Design a simple multimodal coordination task you could add to your internal benchmark. What would count as a useful signal?
    zh: |
      讀 COMMA 關於多模態協調的發現。設計一項你可以加進內部基準的簡單多模態協調任務。什麼才算是有用的訊號？
    verifies: >-
      on a 4-wire, 3-stage solver/expert task the channel-cut arm scores the exact random baseline, SR
      (1/4)^3 = 0.0156 and PSR 0.109, within 0.005 and 0.01 over 20000 episodes, while fidelity 0.8
      scores a PSR over 0.5 higher; the lesson's random_baseline returns 0.15 for every rng. A
      two-proportion test at 5%/80% needs under 100 episodes per arm for COMMA's 41.74-vs-18.70 gap
      and over 3000 for a 3-point gap; 160 per arm resolve 0.16
  - index: 5
    slug: marbles_three_percent_grades_f_and_the_rubric_grades_one_claim_two_ways
    kind: code
    tier: T0
    deps_group: none
    en: |
      Apply the benchmark-claims checklist to one recent multi-agent paper's headline result. What grade would you give the claim?
    zh: |
      把那份基準宣稱檢查清單套用到近期某篇多代理論文的頭條結果上。你會給那個宣稱什麼評級？
    verifies: >-
      encoding skill-benchmark-reader's rubric, MARBLE's cognitive-planning +3% fails contamination,
      baseline, statistics, diversity and cost -- D by count, F by the no-statistics disqualifier. The
      lesson's own scorecard (n_seen=40, random_baseline constant, one task family) is D by count and
      F by hard rejects. A claim missing only its baseline is B by count and F by hard reject
