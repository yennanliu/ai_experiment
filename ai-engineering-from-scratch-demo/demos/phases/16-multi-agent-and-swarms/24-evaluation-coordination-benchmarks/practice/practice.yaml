      Read the SWE-bench Pro paper. What specifically makes it contamination-resistant? Could the same technique be applied to other benchmarks you care about?
    zh: |
      讀 SWE-bench Pro 論文。具體是什麼讓它抗汙染？同樣的技術能不能套用到其他你在意的基準上？
    cites: >-
