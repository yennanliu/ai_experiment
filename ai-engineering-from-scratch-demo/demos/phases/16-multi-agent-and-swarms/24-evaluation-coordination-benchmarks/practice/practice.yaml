exercises:
  - index: 1
    slug: b_is_cheapest_per_milestone_on_every_seed_and_never_the_most_accurate
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py`. Identify which of the three simulated systems has the best cost-per-milestone. Does it match the highest raw-accuracy system?
    zh: |
      跑 `code/main.py`。指認出三套被模擬系統中「每里程碑成本」最好的那一套。它跟原始準確率最高的那一套一致嗎？
    verifies: >-
      system-B is cheapest per milestone ($0.164) and system-A most accurate (0.731 held); over 400
      seeds B is cheapest on 400 and A most accurate on at least 98%. A and C cost $0.3825 and $0.3820
      in expectation, and A is cheaper on 35-55% of seeds. The seen-held > 0.1 flag fires on the
      uncontaminated B and C on 8-20% of seeds and on A on over 90%. The takeaways calling B
      lowest-accuracy and C middle are false: B's held 0.681 > C's 0.550 and C is lowest on 98%+ of
      seeds. cost/mil divides by the milestone rate, so B's per-milestone cost is $0.041;
      random_baseline returns 0.15 for every rng
