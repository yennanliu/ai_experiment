exercises:
  - index: 1
    slug: all_three_retrievers_return_the_same_first_chunk
    kind: code
    tier: T0
    deps_group: none
    en: |
      Compare BM25 vs vector search vs hybrid search on the sample documents. For each of the 5 test queries, record which approach returns the most relevant chunk in position #1. Hybrid search should win on at least 3 out of 5.
    zh: |
      在樣本文件上比較 BM25、向量搜尋與混合搜尋。對 5 個測試查詢的每一個，記下哪種做法在第 1 名回傳了最相關的塊。混合搜尋應該至少在 5 個裡贏 3 個。
    verifies: >-
      'most relevant' is the document that answers the query, recorded as a gold index, and the chunks
      are the lesson's own at its default chunk size, which is one chunk per document, six of them.
      Hybrid wins 0 of 5 because it never differs: vector, BM25 and hybrid return the identical rank-1
      chunk on all five queries and each is correct on 4 of 5. The pool is larger than the corpus --
      hybrid_search retrieves retrieval_pool=15 from each arm against 6 chunks, so both arms return
      everything and the fusion is a rank-sum over identical candidate sets. reciprocal_rank_fusion
      also discards the scores: [(0, 99000.0), (1, 0.0)] and [(0, 0.001), (1, 0.0)] fuse to identical
      values, and with k=60 the fused spread across the whole six-chunk ranking is 0.00248, 7% of the
      top score. The query all three get wrong, 'how much does professional cost', contributes only
      'does' and 'professional' to the embedding, one of them a stopword, because the corpus never
      writes 'cost' or 'much'. Re-chunking without overlap gives 13 chunks with 0 queries where the
      arms differ, 23 chunks with 0, and 31 chunks -- past the 15-item pool, five times the shipped
      corpus -- with 1
    uses_reference:
      - chunk_text
      - build_vocabulary
      - compute_idf
      - tfidf_embed
      - vector_search
      - BM25
      - hybrid_search
      - reciprocal_rank_fusion
      - SAMPLE_DOCUMENTS
  - index: 2
    slug: the_four_categories_do_not_cover_the_corpus
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement a metadata filter. Add a "category" field to each document (security, billing, api, product). Before running vector search, filter chunks to only the relevant category. Test with "What encryption is used?" and verify it only searches security-category chunks.
    zh: |
      實作一個元資料過濾器。為每份文件加一個「category」欄位（security、billing、api、product）。在跑向量搜尋之前，先把塊過濾到相關類別。用「What encryption is used?」測試，並驗證它只搜尋 security 類別的塊。
    verifies: >-
      the filter is applied before vector_search as written, the relevant category is chosen by
      keyword since the exercise gives no routing rule, and the categories are assigned by hand from
      each document's own title. The exercise's own test case is unmoved: 'What encryption is used?'
      routes to security, searches 1 chunk instead of 6, and returns the same chunk in the same
      position, because unfiltered vector search already ranks the security document first -- 4 of the
      5 queries are unchanged. Two of the six documents have no category among security, billing, api
      and product: the Q3 earnings report and the uptime SLA, so a router forced to pick one of four
      sends earnings questions somewhere arbitrary and a filter that respects the four can never
      retrieve those two. After filtering the category is the result -- each named category holds
      exactly 1 chunk, so a top-3 over a filtered set returns the whole category. Where the filter is
      applied decides whether the scores move: filtering the embedding list leaves the IDF computed
      over all six chunks (6 distinct values) untouched, while re-indexing the filtered set recomputes
      it over 1 document and collapses it to 1 value. The filter earns its place on one query of six:
      'what encryption does the enterprise plan include' goes to the product document unfiltered,
      because 'enterprise' appears in all six chunks and is the only in-vocabulary content word
    uses_reference:
      - chunk_text
      - build_vocabulary
      - compute_idf
      - tfidf_embed
      - vector_search
      - SAMPLE_DOCUMENTS
  - index: 3
    slug: the_hypothesis_adds_five_stopwords_and_loses_a_hit
    kind: code
    tier: T0
    deps_group: none
    en: |
      Build a full HyDE pipeline using the simple generate function from Lesson 06. Compare retrieval quality (top-3 relevance) between direct query search and HyDE search on all 5 test queries. HyDE should improve results for vague queries.
    zh: |
      用第 06 課那個簡單的生成函數建一條完整的 HyDE 管線。在 5 個測試查詢上比較「直接查詢搜尋」與「HyDE 搜尋」的檢索品質（top-3 相關性）。HyDE 應該能改善模糊查詢的結果。
    verifies: >-
      the lesson's hyde_search already is the HyDE pipeline, and lesson 06's simple_generate is loaded
      from the reference repo for the generation half because the exercise names it. Top-3 relevance
      is direct 5 of 5 against HyDE 4 of 5: HyDE loses the encryption query, whose answering document
      falls out of the top 3, and gains nowhere. The mechanism is that hyde_generate_hypothesis is a
      template, so its 30-word 'document' -- against a 6-word query -- adds exactly five in-vocabulary
      words, and they are 'and', 'on', 'that', 'the' and 'to'. Every content word it invents
      (documentation, policies, procedures, requirements) is absent from the corpus, so it retrieves
      nothing and the stopwords re-weight the ranking. The query it breaks had no content words to
      begin with: 'what encryption is used at rest' contributes 'at', 'is' and 'rest', because the
      corpus writes 'encrypted' not 'encryption' and 'using' not 'used'. The topic extraction also
      drops words it should keep -- its filler list includes 'is', 'at' and 'the', so the topic is
      'encryption used rest', which then appears alongside the quoted query and doubles three terms. A
      hypothesis that is the query plus the extracted topic and nothing else scores 5 of 5, matching
      direct search
    uses_reference:
      - hyde_search
      - hyde_generate_hypothesis
      - vector_search
      - tfidf_embed
      - build_rag_prompt
      - SAMPLE_DOCUMENTS
  - index: 4
    slug: the_baseline_chunk_size_the_exercise_names_hangs
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement the parent-child chunking strategy on the sample documents. Use child_size=30 and parent_size=100. Search with child chunks but return parent chunks in the prompt. Compare the generated answers to standard chunking with chunk_size=50.
    zh: |
      在樣本文件上實作父子切塊策略。用 child_size=30、parent_size=100。用子塊搜尋，但在提示詞裡回傳父塊。把生成的答案和 chunk_size=50 的標準切塊做比較。
    verifies: >-
      the generator is lesson 06's simple_generate, loaded from the reference repo because exercise 3
      of this lesson names it and this lesson ships no generation function, and the baseline is run at
      chunk_text(doc, 50, 0). chunk_text(doc, 50) does not terminate: the default overlap is 50, so
      the step is 0 and a bounded clone makes 500 chunks with start still at 0 -- the baseline has to
      be run at an overlap the exercise does not give. The two strategies then tie on recall, both
      putting the answering document in the top 3 for 5 of 5 queries, and parent-child costs 34% more
      prompt: 931 words of parents against 693 of standard chunks, because a parent is 100 words where
      a chunk is 50. The generated answers differ on 2 of the 5, because simple_generate scores every
      sentence it is given and a 100-word parent offers more of them. 5 of the 24 children are under
      10 words -- children tile with child_start += child_size and stop at the parent boundary, so a
      91-word document under one 100-word parent yields 30, 30, 30 and 1 -- and those fragments are
      embedded and searchable like any other child. And the child index and the parent index are
      different corpora, 24 against 7, so the score attached to a returned parent was never computed
      for that text
    uses_reference:
      - create_parent_child_chunks
      - chunk_text
      - build_vocabulary
      - compute_idf
      - tfidf_embed
      - vector_search
      - build_rag_prompt
      - SAMPLE_DOCUMENTS
  - index: 5
    slug: twelve_points_one_value_and_only_reranking_ever_moves
    kind: code
    tier: T0
    deps_group: none
    en: |
      Create an evaluation dataset: 10 questions with known answer chunks. Measure Recall@3, Recall@5, and Recall@10 for (a) vector search only, (b) BM25 only, (c) hybrid search, (d) hybrid + reranking. Plot the results and identify where reranking helps most.
    zh: |
      建一個評估資料集：10 個已知答案所在塊的問題。對 (a) 只用向量搜尋、(b) 只用 BM25、(c) 混合搜尋、(d) 混合 + 重排，分別量測 Recall@3、Recall@5 和 Recall@10。把結果畫出來，找出重排在哪裡幫助最大。
    verifies: >-
      the known answer chunks are derived rather than asserted -- a chunk is relevant when it contains
      the question's answer string -- so the labels cannot drift from the chunking, and recall is the
      lesson's own evaluate_retrieval_recall over its own four configurations. At the shipped chunk
      size the plot is twelve points at 1.000: six chunks, ten questions, three values of k, four
      configurations, every cell perfect, because k=10 and k=5 retrieve the whole corpus and k=3 is
      enough when each answer sits in one of six documents. Re-chunked to 31, vector, BM25 and hybrid
      all score 0.778, 0.889, 1.000 at k = 3, 5, 10 -- identical to each other at every k, so four
      requested curves are two. Reranking helps most at k=3 and is the only thing that helps: hybrid +
      rerank is 1.000 everywhere, a lift of +0.222, +0.111 and 0.000, which is exactly the recall the
      smaller k was throwing away. rerank's initial_score * 5.0 term also weighs its input 66x
      differently by retriever -- spanning 0.133 to 0.164 on hybrid's RRF values against whole-number
      term-overlap counts, and 0.000 to 2.043 on vector cosines. And the labels move with the
      chunking: at 20-word chunks '$99 per month' is split across a boundary and the pair count goes
      10 -> 9
    uses_reference:
      - evaluate_retrieval_recall
      - vector_search
      - BM25
      - hybrid_search
      - rerank
      - chunk_text
      - tfidf_embed
      - build_vocabulary
      - compute_idf
      - SAMPLE_DOCUMENTS
