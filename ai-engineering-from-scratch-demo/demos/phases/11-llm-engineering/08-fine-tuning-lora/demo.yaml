proves: >
  The lesson's hand-written LoRALayer is numerically identical to peft's
  lora.Linear at the same rank and alpha: same forward pass, same trainable-parameter
  accounting, same merged weights after folding the adapter back into the base layer.
  It also measures where the lesson diverges -- its "NF4" quantiser is symmetric
  int4-range, not the NF4 codebook -- and prints the reconstruction error that costs.
