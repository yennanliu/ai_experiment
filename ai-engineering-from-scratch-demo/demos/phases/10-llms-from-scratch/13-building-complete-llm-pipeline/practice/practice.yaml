lesson: 13-building-complete-llm-pipeline
phase: 10-llms-from-scratch
source: phases/10-llms-from-scratch/13-building-complete-llm-pipeline/docs/en.md
exercises:
  - index: 1
    slug: there_is_nothing_to_run_in_parallel
    kind: code
    tier: T0
    deps_group: none
    en: |
      Extend the orchestrator to support parallel execution of stages 07 and 08. Use the stdlib `concurrent.futures` module. Confirm the final manifest records both stages' outputs and that stage 09's input hash is a deterministic combination of both.
    zh: |
      擴充編排器，支援第 07 與第 08 站平行執行。使用標準函式庫的 `concurrent.futures` 模組。確認最終的 manifest 記錄了兩個階段的輸出，而且第 09 站的輸入雜湊是這兩者的確定性組合。
    verifies: >-
      the two stages are run through a ThreadPoolExecutor exactly as asked and the manifest that
      comes back is compared field by field against the serial one, with the counterfactual run
      directly -- stage 09's blob rebuilt from the same two hashes in the order a parallel scheduler
      would have completed them -- because "confirm it is deterministic" is only worth confirming if
      it could have failed. The two manifests are identical across all twelve stage records, and
      there is nothing to parallelise: simulate_stage builds a JSON blob and returns a wall-clock
      and a cost looked up from a table keyed on stage_type alone, so a policy stage is (5400, 300)
      whatever its inputs are. Manifest has no wall-clock total to improve either -- its nine fields
      are pipeline_version, seed, git_commit, stages, gates, eval_metrics, budget_usd,
      total_cost_usd and shippable, and run accumulates total_cost_usd and nothing else, so the 10.3
      hours of per-stage wall_clock_sec are recorded twelve times and summed zero times. The
      determinism comes from deps rather than from the scheduler: input_hashes = [name_to_hash[d]
      for d in deps] walks the declared dependency list, and handing the same two hashes to
      simulate_stage in the other order gives a different blob hash, because json.dumps(...,
      sort_keys=True) sorts dictionary keys and leaves list order alone -- an implementation that
      appended hashes as futures resolved would break it silently. And the pipeline is a pure
      function of its seed: two fresh runs give the same twelve output hashes and changing the seed
      changes all twelve, since nothing in simulate_stage reads a clock, a file or a random number
    uses_reference:
      - run
      - simulate_stage
      - STAGES
      - Manifest
      - StageRecord
      - ArtifactStore
  - index: 2
    slug: the_gate_holds_the_ship_not_the_run
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a "contamination check" gate. Given the eval dataset hash and the training dataset shards, compute the overlap (exact string match or 13-gram match). The gate fails if overlap exceeds 0.1%. Feed it a contaminated training set and confirm the gate holds the run.
    zh: |
      加一道「污染檢查」關卡。給定評估資料集的雜湊值與訓練資料集的分片，計算兩者重疊程度（精確字串比對或 13-gram 比對）。重疊超過 0.1% 就不通過。餵它一份被污染的訓練集，確認關卡會擱置這次執行。
    verifies: >-
      both overlap measures the exercise offers are built, because "exact string match or 13-gram
      match" reads as interchangeable and the case contamination checks exist for is the one where
      they are not, and the gate itself is a DEFAULT_GATES entry applied through the lesson's own
      gate(). The gate holds the ship rather than the run: run executes all twelve stages,
      accumulates total_cost_usd to $1,941 and only then assigns eval_metrics, while gate is a
      separate call that reads them, so a contaminated training set is caught after pre-training,
      SFT, two policies and CAI have been paid for -- nothing in run consults a gate except the
      budget check. The two measures disagree exactly where it matters: on 200 eval items against
      2,000 shards, a clean set reads 0.000% either way, one verbatim leak 0.500% either way, and
      five leaks pasted into the middle of longer training lines read 2.500% to 13-gram and 0.000%
      to exact match. The 0.1% threshold is also below the resolution of the eval set, since one
      leaked item of 200 is 0.500% -- five times the threshold -- and the finest non-zero reading
      the metric has is 1/200, so distinguishing 0.1% from zero would need at least 1,000 eval items
      and on anything smaller the gate is binary. And the eval dataset hash cannot be used for this
      at all: a SHA-256 supports equality, while overlap needs the shards' contents, which this
      pipeline never stores -- every artifact in the ArtifactStore is a simulate_stage metadata blob
    uses_reference:
      - run
      - gate
      - Manifest
      - DEFAULT_GATES
      - ArtifactStore
  - index: 3
    slug: six_n_d_lands_within_one_and_a_half_percent
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement a cost estimator from first principles. For stage 04 (pre-training), estimate FLOPs as 6 x params x tokens, assume 40% MFU (model FLOPs utilization) on H100 at 989 TFLOPs BF16, at $2.50/GPU-hour. Report the estimate for a 7B model trained on 2T tokens. Compare to published Llama 2 numbers.
    zh: |
      從第一性原理實作一個成本估算器。對第 04 站（預訓練），把 FLOPs 估為 6 x params x tokens，假設在 989 TFLOPs BF16 的 H100 上達到 40% MFU（模型 FLOPs 使用率），費率 $2.50/GPU-hour。回報一個 7B 模型在 2T 詞元上訓練的估算值，並與 Llama 2 公布的數字比較。
    verifies: >-
      the estimator is built with the constants the exercise gives and the comparison to Llama 2 is
      made in Llama 2's units, since Meta reports 184,320 A100-80GB hours for the 7B rather than
      H100 hours or dollars, so the same FLOPs are re-divided by the A100's 312 TFLOPs BF16 before
      the numbers are set beside each other. 6 x 7e9 x 2e12 is 8.400e22 FLOPs; at 989 TFLOPs and 40%
      MFU that is 58,982 H100-hours or $147,455 at $2.50 an hour, and at 312 TFLOPs it is 186,966
      A100-hours against Meta's 184,320 -- a ratio of 1.014, so a back-of-envelope with two
      constants and one published utilisation figure lands within 1.4% of a real pre-training run.
      The pipeline books the same stage at $400: simulate_stage's cost_table gives a checkpoint
      stage a flat (7200, 400), so the estimator disagrees with the pipeline it is written for by
      369x, and the whole twelve-stage pipeline costs $1,941 in the manifest where stage 04 alone
      costs $147,455 in reality. The budget gate is the wrong order of magnitude in both directions
      -- cost_total_usd is <= 50,000 and budget_usd is 50,000, the simulated pipeline spends 3.9% of
      that so the budget never binds, and the real stage 04 is 2.95x the entire budget so it would
      halt the run at stage 04 and never reach the gate. The mechanism is that the 6 is arithmetic,
      one multiply-accumulate per parameter per token doubled for the backward pass and again for
      the gradient, while the 40% is the only measured term in the estimate
    uses_reference:
      - run
      - simulate_stage
      - Manifest
      - DEFAULT_GATES
      - ArtifactStore
  - index: 4
    slug: the_cache_key_is_the_output
    kind: code
    tier: T0
    deps_group: none
    en: |
      Build a partial rollback. Simulate a failure at stage 09 (CAI), then re-run stages 09 through 12 while leaving 01-08 cached. The orchestrator should detect the cached artifacts by hash and skip them. Measure wall-clock saved versus full re-run.
    zh: |
      做一次部分回滾。模擬第 09 站（CAI）失敗，然後重跑第 09 到 12 站，同時讓 01-08 維持快取狀態。編排器應該要靠雜湊值認出已快取的產出物並跳過它們。量測相較於整條重跑省下的實際時間。
    verifies: >-
      "detect the cached artifacts by hash" is taken at its word and then rejected, because the only
      hash a stage has is its output hash and store.put(simulate_stage(...)) is what produces it, so
      the orchestrator here keys on the inputs -- (name, stage_type, input_hashes, seed) -- which is
      exactly the payload simulate_stage serialises, and wall clock is read from the manifest since
      simulate_stage returns it from a table rather than measuring it. Caching stages 01-08 and
      re-running 09-12 takes wall clock from 37,050 to 6,330 seconds, a saving of 30,720 or 82.9%,
      and cost from $1,941 to $331; the figure is exact rather than approximate because every
      wall_clock_sec is a cost_table lookup keyed on stage_type. Detecting by hash is circular:
      asking the store whether an artifact is present requires having run the stage, and the cache
      key built here is byte-for-byte the blob the stage returns, so the key and the answer are one
      object. There is nothing for a rollback to invalidate either -- the full run, the cached
      re-run and a third independent run all produce the same twelve output hashes, so re-running
      stage 09 after a failure produces the artifact that was already there, and if the seed changes
      to make it differ then stage 01 changes too and nothing is cached. And run has no cache at
      all: its loop is simulate_stage then store.put, unconditionally, twelve times, with the budget
      check as its only early exit, while ArtifactStore.has exists and run never calls it
    uses_reference:
      - run
      - simulate_stage
      - STAGES
      - ArtifactStore
      - StageRecord
      - Manifest
  - index: 5
    slug: three_of_the_four_attributes_do_not_exist
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add observability. Emit OpenTelemetry spans for each stage, with attributes for params, tokens seen, loss, and cost. Pipe the spans to a local collector. The point is not dashboards; the point is that every stage's health is traceable from a single trace ID.
    zh: |
      加上可觀測性。為每一階段送出 OpenTelemetry span，屬性包含參數量、看過的詞元數、損失與成本。把這些 span 導到一個本地 collector。重點不是儀表板，重點是每一階段的健康狀況都能從單一個 trace ID 追出來。
    verifies: >-
      the spans are emitted in the OTLP JSON shape -- one trace id, one span per stage, each
      parented to a root -- without the opentelemetry package or a collector, because the exercise
      says the point is traceability rather than dashboards and traceability is a property of the
      spans themselves. The trace is connected: thirteen spans, one root and twelve stages, share
      one traceId, every parentSpanId resolves within the trace, all thirteen are reachable from the
      root and none is orphaned. Of params, tokens_seen, loss and cost, the pipeline can supply cost
      alone -- StageRecord is name, stage_type, input_hashes, output_hash, wall_clock_sec, cost_usd
      and status, and Manifest adds no per-stage numerics -- so three of the four named attributes
      have to be invented, and a span reporting them is reporting a literal the observability layer
      made up, which is the failure mode observability exists to prevent. The one attribute that
      does exist is fabricated upstream: cost_usd comes from simulate_stage's cost_table, so both
      checkpoint stages report 400.0 and the twelve stages carry only eight distinct costs between
      them, meaning tracing the single traceable number across the pipeline recovers the table
      rather than the run. And the untestable half of the exercise is the half that proves nothing
      -- whether a span reached an OTLP endpoint says nothing about whether the trace is well
      formed, while whether every parentSpanId resolves does
    uses_reference:
      - run
      - Manifest
      - StageRecord
      - ArtifactStore
