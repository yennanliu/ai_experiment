lesson: 06-instruction-tuning-sft
phase: 10-llms-from-scratch
source: phases/10-llms-from-scratch/06-instruction-tuning-sft/docs/en.md
exercises:
  - index: 1
    slug: the_system_prompt_pushes_the_answer_out
    kind: code
    tier: T1
    deps_group: math
    en: |
      Add system prompt support. Modify `tokenize_instruction_pair` to accept a system message and prepend it before the instruction. Create 5 examples with different system prompts ("You are a poet", "You are a math tutor") and verify the model sees different system prompts during training.
    zh: |
      加上系統提示詞支援。修改 `tokenize_instruction_pair`，讓它接受一段 system 訊息並放在指令之前。建立 5 筆帶有不同系統提示詞的範例（「You are a poet」、「You are a math tutor」），並驗證模型在訓練時確實看到了不同的系統提示詞。
    verifies: >-
      "prepend it before the instruction" is implemented exactly that way, inside the INST_START
      block ahead of the instruction bytes so create_loss_mask still masks it out, and "verify the
      model sees different system prompts" is treated as a claim to check. 5 of the lesson's 8
      examples already overflow the window: at seq_len=64 the pairs tokenise to 64, 106, 111, 56, 97,
      112, 61 and 117 bytes and sft_train does tokens = tokens[:seq_len], so with the response at the
      end only 245 of 468 response tokens survive truncation before any system prompt exists. A
      16-byte "You are a poet. " takes the lengths to 80, 122, 127, 72, 113, 128, 77 and 133 -- 8 of
      8 past 64 -- and supervised response tokens fall from 245 to 128, 48% less supervision for the
      same eight examples. The mechanism is that the two ends belong to different owners: the system
      prompt is masked out so it contributes no gradient and only costs budget, while the response is
      the only masked-in span, so a longer system prompt strictly reduces supervision per example and
      buys nothing that is trained on. And the verification the exercise asks for cannot be done: the
      five prompts do produce five distinct token sequences, but sft_train updates with
      lr * np.random.randn(...) and never uses its gradient, so five different system prompts leave
      the weights bit-identical to five copies of one
    uses_reference:
      - tokenize_instruction_pair
      - create_loss_mask
      - INSTRUCTION_DATA
  - index: 2
    slug: five_percent_of_examples_is_not_five_percent
    kind: code
    tier: T1
    deps_group: math
    en: |
      Implement data mixing. Create a function that takes an SFT dataset and a raw text corpus, then produces training batches where 5% of examples are raw text (no masking) and 95% are instruction pairs (masked). Run 3 epochs and compare forgetting metrics against pure SFT training.
    zh: |
      實作資料混合。寫一個函式，吃進一份 SFT 資料集與一份原始文字語料，產出訓練批次，其中 5% 的範例是原始文字（不做遮罩）、95% 是指令配對（有遮罩）。跑 3 個回合，把遺忘指標拿來跟純 SFT 訓練比較。
    verifies: >-
      the mix is built at exactly the ratio the exercise names -- 5% of examples, which needs the eight
      pairs repeated 19 times so that 8 raw examples is exactly 5% of 160 -- and the quantity that reaches
      the optimiser is then counted on the batches sft_train receives, after its own seq_len=64 truncation
      and its own shift. A raw example carries 61 of its 63 tokens through the mask and an instruction
      pair 245 of 493, or 49.7%, so the raw share of what receives gradient is 9.5%, 1.9 times the ratio
      that was set. The truncation is where most of that comes from: sft_train cuts each example to 64
      tokens and it cuts from the end, which is where the response is, so the eight pairs go from 724
      tokens with 468 supervised to 493 with 245 -- 48% of the tokens SFT exists to train on never reach
      the loss, and the cut happens inside the trainer where the dataset cannot show it. The ratio is
      specified on examples and the effect lands on tokens, and the gap widens as the supervised share
      falls. The comparison the exercise ends on has no signal either: three epochs of sft_train move the
      lesson's own forgetting metric from 5.524290 to 5.524293 on pure SFT and to 5.524272 on the mix,
      +2.83e-06 and -1.85e-05, because the update is lr * np.random.randn(...) and the gradient is
      discarded, so the two arms are the same random walk. And the metric could not show forgetting
      anyway: the held-out loss sits at 5.5243 against ln(256) = 5.5452, at the uniform baseline, on a
      model whose attention stack and embedding table never move
    uses_reference:
      - INSTRUCTION_DATA
      - tokenize_instruction_pair
      - create_loss_mask
      - measure_forgetting
      - sft_train
      - MiniGPT
  - index: 3
    slug: the_two_filters_point_in_opposite_directions
    kind: code
    tier: T1
    deps_group: math
    en: |
      Build a data quality scorer. For each instruction-response pair, compute: (a) response length in tokens, (b) instruction-to-response ratio, (c) vocabulary diversity (unique tokens / total tokens). Filter out examples with response length < 10 tokens or diversity < 0.3. Show how filtering affects the final loss.
    zh: |
      打造一個資料品質評分器。對每一組指令—回應配對計算：(a) 回應長度（詞元數）、(b) 指令對回應的長度比、(c) 詞彙多樣性（不重複詞元數／總詞元數）。濾掉回應長度小於 10 個詞元或多樣性低於 0.3 的範例。展示過濾如何影響最終損失。
    verifies: >-
      "tokens" means the lesson's tokens, which are bytes, so all three metrics are computed on byte
      tokens and both thresholds applied as written, and the same diversity is then recomputed on
      word tokens because that is the unit 0.3 comes from. The filter drops 4 of the lesson's own 8
      examples and none of them for being short: every response is at least 26 bytes, so
      length < 10 never fires and diversity < 0.3 fires four times. The two filters point in opposite
      directions -- sorted by response length the survivors are 26, 27, 31 and 61 bytes and the
      dropped are 71, 78, 84 and 90, the four shortest against the four longest, because byte
      diversity is unique/total over the ~40 characters English actually uses and falls as a response
      grows, the correlation between length and diversity being -0.99. The mechanism is that 0.3 is a
      word-level threshold on a byte-level tokenizer: the same eight responses score 0.909 to 1.000
      on word tokens, all far above it, against 0.233 to 0.654 on bytes. And "show how filtering
      affects the final loss" shows which example was measured last: the two runs end at 5.5011 and
      5.5042, a gap of 3.1e-03 against a within-run spread of 1.7e-02 across the examples themselves
    uses_reference:
      - INSTRUCTION_DATA
      - sft_train
      - MiniGPT
  - index: 4
    slug: the_mask_never_closes
    kind: code
    tier: T1
    deps_group: math
    en: |
      Implement multi-turn conversation training. Extend the tokenization to handle 3-turn conversations (user-assistant-user-assistant-user-assistant). The loss mask should cover all three assistant turns. Verify the mask is correct by printing the token-mask alignment for one example.
    zh: |
      實作多輪對話訓練。把分詞擴展成能處理 3 輪對話（user-assistant-user-assistant-user-assistant）。損失遮罩要涵蓋全部三段 assistant 的回合。挑一筆範例把詞元與遮罩的對齊印出來，驗證遮罩正確。
    verifies: >-
      the tokenization is extended the obvious way, concatenating three tokenize_instruction_pair
      blocks, and the lesson's own create_loss_mask is then run over the result because "verify the
      mask is correct" is an instruction to check. The mask does cover all three assistant turns --
      and everything else from the first response onward: on the conversation A/B, C/D, E/F it
      selects 9 of 15 positions, of which 3 are the assistant bytes the exercise wants, 2 are the
      user bytes C and E, and 4 are turn markers. The mechanism is that in_response is a latch:
      create_loss_mask sets it True at the first RESP_START and has no branch that clears it, so
      after position 4 the only zeros left are the `continue` on a later RESP_START, at positions 8
      and 13. Single-turn data never shows this, because a single-turn conversation has nothing after
      its response -- the single-turn mask selects the response bytes and nothing else, which is why
      every check the lesson runs passes. The objective this produces is not a noisier version of
      instruction tuning but the opposite one: a model trained to write both halves of the
      conversation, the failure response masking exists to prevent
    uses_reference:
      - tokenize_instruction_pair
      - create_loss_mask
      - SPECIAL_TOKENS
  - index: 5
    slug: the_learning_rate_does_nothing
    kind: code
    tier: T1
    deps_group: math
    en: |
      Compare learning rates. Train the same model three times with lr=1e-4, lr=2e-5, and lr=1e-6. Plot the loss curves. The 1e-4 run should show rapid initial descent but higher final loss (overfitting). The 1e-6 run should barely move. The 2e-5 run should be the sweet spot.
    zh: |
      比較學習率。用 lr=1e-4、lr=2e-5、lr=1e-6 各訓練同一個模型一次，畫出損失曲線。1e-4 那次應該一開始下降很快但最終損失較高（過度擬合）。1e-6 那次幾乎不會動。2e-5 那次應該是甜蜜點。
    verifies: >-
      the three runs are the lesson's own sft_train on its own INSTRUCTION_DATA from the same
      initialisation with only lr changed, plus a fourth at 1e-3. All four end at 5.5011, identical
      to four decimal places, a spread of 6.2e-05 over a 1000x range of lr, so none of the exercise's
      three predictions occurs: no rapid initial descent, no overfitting at 1e-4, no sweet spot at
      2e-5, and "the 1e-6 run should barely move" is right for a reason that applies equally to the
      other three. The mechanism is that sft_train computes dlogits, masks it and divides by the
      response-token count, then updates with
      block.ffn.W1 -= lr * np.random.randn(*block.ffn.W1.shape) * 0.01 -- dlogits appears nowhere on
      the right-hand side, so lr scales a random walk and nothing else. The proof is direct: running
      sft_train on INSTRUCTION_DATA and on eight examples of "zzzz"/"qqqq" from the same seed leaves
      every named array equal bit for bit, and a trainer whose output does not depend on its input is
      not training. Even the random walk reaches only ffn.W1 and ffn.W2 -- W_q, W_out, ln1, ln2,
      token_embed and pos_embed are unchanged
    uses_reference:
      - sft_train
      - MiniGPT
      - INSTRUCTION_DATA
