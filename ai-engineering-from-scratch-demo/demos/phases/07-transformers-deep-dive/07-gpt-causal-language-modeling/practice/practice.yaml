lesson: 07-gpt-causal-language-modeling
phase: 07-transformers-deep-dive
source: phases/07-transformers-deep-dive/07-gpt-causal-language-modeling/docs/en.md
exercises:
  - index: 1
    slug: the_guard_is_for_a_row_the_mask_cannot_make
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Easy.** Run `code/main.py` and verify the causal attention matrix is lower-triangular after softmax. Spot-check: row 3 should have weights only in columns 0–3.
    zh: |
      **簡單。** 執行 `code/main.py`，驗證經過 softmax 後因果注意力矩陣是下三角的。抽查一下：第 3 列應該只在第 0–3 欄有權重。
    verifies: >-
      the matrix is verified exactly rather than visually: row 3 is [0.269, 0.232, 0.439, 0.060, 0.0,
      0.0], weight in columns 0-3 and nowhere else, every upper-triangle entry is the float 0.0 rather
      than an underflow, and the row sums are within 1.1e-16 of 1. The zeros are exact because
      apply_softmax_row writes 0.0 for a -inf entry instead of exponentiating it; the sums are not,
      because adding i+1 floats is not. Row 0 is exactly one-hot with entropy exactly 0 -- position 0
      can attend only to itself -- so the first token of a causal sequence takes nothing from the
      sequence and its row is fixed before any weight is learned. The module ships two softmaxes and
      on every causal row they agree to 0.0, because math.exp(-inf) is already 0.0 and the ordinary
      path handles a -inf entry correctly. They differ on exactly one input, a row that is entirely
      -inf, where softmax computes -inf minus -inf and returns nan while apply_softmax_row returns
      zeros -- and causal_mask cannot produce that row, since its diagonal is 0.0 at every position.
      The guard is dead code for the mask the lesson ships; it exists for padding masks, which this
      lesson does not have. What is verified is the mask and not attention: demo_causal_mask feeds
      rng.gauss(0, 1) straight in with no Q, no K and no 1/sqrt(dk), so triangularity holds for any
      scores at all, and the row entropies stay under their ln(i+1) ceilings
    uses_reference:
      - causal_mask
      - attention_scores_with_mask
      - apply_softmax_row
      - softmax
  - index: 2
    slug: beam_does_not_always_win_even_on_its_own_score
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Medium.** Implement beam search for width 4. Compare perplexity of beam-4 vs greedy on 10 short prompts. Does beam always win? (Hint: usually for translation, not for open-ended chat.)
    zh: |
      **中等。** 實作寬度為 4 的 beam search。在 10 個短提示詞上比較 beam-4 與貪婪的困惑度。beam 總是贏嗎？（提示：翻譯通常是，開放式聊天則不是。）
    verifies: >-
      the lesson has no model, so the scorer is a bigram table over its own 20-token vocabulary built
      through its own softmax, and greedy is beam width 1 in the same function so the two arms cannot
      differ by implementation. The answer to 'does beam always win' is no, and the counterexample is
      on beam's own objective: over 300 bigram models beam-4's best hypothesis has a lower total
      log-probability than greedy's 2 times, 0.67%, because greedy's prefix can be pushed out of the
      beam by four better-scoring prefixes whose own continuations are worse. Width is not monotone
      either -- on one model width 2 scores -18.674 where width 4 scores -18.769. The exercise's own
      sample size cannot find this: on 10 prompts beam wins 8, ties 2 and loses 0 with a mean gain of
      +1.66 nats, and at a 0.67% failure rate 10 draws are expected to see none. The perplexity the
      exercise names does not depend on the decoder at all -- cross_entropy_shifted(logits_per_pos,
      target_ids) takes a model's logits and a reference sequence, giving 22.70 here, and no decoding
      strategy appears in the formula, because perplexity is a property of a model on text it did not
      choose. What can be compared is the perplexity of each decoder's own output, greedy 4.885
      against beam 4.255, and beam maximises exactly the reciprocal of that by construction, so the
      comparison is a definition rather than a result
    uses_reference:
      - softmax
      - cross_entropy_shifted
  - index: 3
    slug: a_two_layer_draft_against_six_is_break_even
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Hard.** Implement speculative decoding: use a tiny 2-layer model as the draft and a 6-layer model as the verifier. Measure wall-clock speedup on 100 completions of length 64. Confirm outputs match greedy of the verifier.
    zh: |
      **困難。** 實作推測解碼：用一個極小的 2 層模型當草稿模型，一個 6 層模型當驗證模型。在 100 次長度 64 的補全上量測實際時間的加速比。確認輸出與驗證模型的貪婪解碼一致。
    verifies: >-
      there are no models in the lesson and nothing to time, so verifier and draft are bigram tables
      over its 20-token vocabulary -- the draft being the verifier with a controlled share of its rows
      pushed onto a different argmax -- and the speedup is counted in verifier forward passes, which
      is what a wall-clock measurement reports once both models sit on the same device. The outputs
      match verifier greedy 100 out of 100 at all three agreement levels, acceptance rates 0.761,
      0.531 and 0.299, and that is by construction rather than luck: the loop accepts the longest
      prefix on which the draft's argmax equals the verifier's and then emits the verifier's own next
      token, so correctness is independent of draft quality. Speed is not. At the exercise's own layer
      ratio c = 2/6 the best speedup over lookaheads 1, 2, 4 and 8 is 1.40x at alpha 0.761, 1.15x at
      0.531 and 0.97x at 0.299 -- at the lowest acceptance rate no lookahead reaches 1.0, so the
      configuration the exercise names can lose. The cost ratio caps it before the acceptance rate
      does: a 4-token lookahead at c = 1/3 spends 1.33 verifier equivalents drafting before one token
      is verified, so even perfect acceptance caps the speedup at (g+1)/(1+g*c) = 2.14x, while the
      same alpha at c = 1/20 gives 2.60x at g = 4 and 2.73x at g = 8. And a bigger lookahead is not a
      bigger win, because E[tokens per call] saturates at 1/(1-alpha) = 4.18 while drafting cost grows
      linearly, so at c = 1/3 the optimum is g = 2
    uses_reference:
      - softmax
