exercises:
  - index: 1
    slug: the_test_it_specifies_rejects_a_true_theorem
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Easy.** Run `code/main.py`. Confirm the speculative token distribution matches the verifier's direct-sample distribution on 50,000 tokens within chi-square p > 0.05.
    zh: |
      **簡單。** 執行 `code/main.py`。在 50,000 個詞元上確認推測式產生的詞元分布，與驗證模型直接取樣的分布在卡方檢定 p > 0.05 的範圍內吻合。
    verifies: >-
      the claim is exact, so it is checked exactly first: the marginal of spec_step_one_token, p_i *
      min(1, q_i/p_i) + P(reject) * res_i, comes to q_i for every i with a worst disagreement of
      1.4e-17, and P(reject) = 0.040306 is 1 - sum(min(p, q)) exactly, the total variation distance.
      No sampling is needed. Running the test the exercise names 40 times then shows what it does to a
      statement that is true. chi_square(spec_counts, direct_counts) compares one sample against
      another, so the expected counts carry their own multinomial noise and the statistic carries
      both: its mean over 40 repeats is 12.79 where a chi-square on 7 degrees of freedom has mean 7,
      while the same draws scored against the true expectation 50000*q average 6.31. The p > 0.05
      critical value at 7 df is 14.067, and the printed statistic exceeds it in 17 of 40 repeats, 42%,
      against 1 of 40 for the correct statistic -- so a reader following the instruction would
      conclude Leviathan's theorem fails on almost half their runs. And the threshold the lesson ships
      cannot fire at all: main() prints PASS below 30, about p = 1e-4, which is exceeded 0 times in
      40. The test as written cannot fail and the test as specified fails half the time
    uses_reference:
      - residual
      - run_distribution_check
      - chi_square
      - perturb
      - spec_step_one_token
  - index: 2
    slug: there_is_no_optimal_n_for_the_metric_named
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Medium.** Plot speedup (tokens per big-model forward) as a function of `N` for `α = 0.5, 0.7, 0.85`. Identify the optimal `N` for each α. (Hint: expected tokens per verify call = `(1 - α^{N+1}) / (1 - α)`.)
    zh: |
      **中等。** 對 `α = 0.5, 0.7, 0.85`，把加速幅度（每次大模型前向傳播產出的詞元數）畫成 `N` 的函式。找出每個 α 的最佳 `N`。（提示：每次驗證呼叫的期望詞元數 = `(1 - α^{N+1}) / (1 - α)`。）
    verifies: >-
      the hint is tokens per big-model forward, so that is the function examined. It has no optimal N:
      (1 - alpha^(N+1))/(1 - alpha) is strictly increasing in N out to N=30 for every alpha and
      saturates at 1/(1 - alpha) -- 2.000, 3.333 and 6.667 at 0.5, 0.7 and 0.85 -- with each extra
      draft position adding exactly alpha^N, a gain that decays to zero and never turns negative. The
      optimum appears as soon as the draft is charged for: E(N)/(1 + N*c) has an interior maximum, at
      N* = 1, 2, 3 for c = 1/3, N* = 2, 4, 7 for c = 1/10 and N* = 3, 6, 10 for c = 1/20 across the
      three alphas, reaching 1.59x, 2.85x and 3.70x at alpha 0.85. The missing variable is the draft
      model's cost, absent from the hint, from expected_tokens_per_verify and from the exercise. The
      formula also assumes alpha does not decay with depth, and spec_step_n makes the same assumption
      -- its docstring says q and p are fixed per call, so it redraws every draft from the same p
      without advancing the draft context. With a 10% per-position decay E(5) at alpha0 = 0.85 falls
      from 4.152 to 3.380, and to 2.927 at 20%. The two guards in expected_tokens_per_verify are both
      redundant: the formula already gives 1 at alpha 0 and N+1 in the limit
    uses_reference:
      - expected_tokens_per_verify
  - index: 3
    slug: truncating_layers_is_not_a_smaller_model
    kind: code
    tier: T1
    deps_group: math
    en: |
      **Hard.** Implement a tiny Medusa: take the capstone GPT from Lesson 14, add 3 extra LM heads that predict positions t+2, t+3, t+4. Train on tinyshakespeare with a joint multi-head loss. Compare acceptance rates vs a vanilla draft made by truncating the same model.
    zh: |
      **困難。** 實作一個迷你 Medusa：拿單元 14 的總結專案 GPT，加上 3 個額外的 LM head 來預測 t+2、t+3、t+4 位置。用多頭聯合損失在 tinyshakespeare 上訓練。把接受率拿去跟「把同一個模型截斷做成的原味草稿」比較。
    verifies: >-
      torch is absent, so the Lesson 14 capstone is rebuilt in numpy at its own configuration with
      three extra d_model x vocab heads and a joint loss weighting each at 0.5. Acceptance is measured
      the way a greedy verifier measures it -- head k's argmax against the true token at t+k, over the
      validation half -- and the truncated draft is the first layer of the same trained network, so
      'the same model' is literal. Every Medusa head beats the truncated draft, the weakest by 1.4x:
      0.202, 0.214, 0.114 and 0.125 for t+1 to t+4 against 0.079. But only two of the four clear the
      unigram baseline: guessing the commonest character scores 0.192 on the validation half, heads 1
      and 2 clear it by +0.010 and +0.022, and heads 3 and 4 land below it -- on 899 training
      characters both arms have learned almost nothing, so the ranking is the only part that survives.
      That head 2 outscores head 1 is the tell, since predicting two ahead cannot genuinely be easier
      than predicting one. The truncation result is the clean one: a 1-layer prefix of the trained
      network agrees with the full one 0.079 of the time, less than half the unigram baseline, because
      the residual stream it hands the head was built for three layers of refinement -- cutting two
      off gives a broken model rather than a weaker one, which is why real draft models are trained
      and not sliced
    uses_reference:
      - TINY_SHAKESPEARE
  - index: 4
    slug: prefix_plus_two_is_what_pins_the_indexing
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Hard.** Implement rollback: start with a 10-token prefix KV cache, feed 5 draft tokens, simulate a rejection at position 3. Verify your cache reads correctly match "prefix + first 2 accepted drafts" at the next iteration.
    zh: |
      **困難。** 實作回捲：從一段 10 個詞元的前綴 KV 快取開始，餵進 5 個草稿詞元，模擬在位置 3 被拒絕。確認下一輪迭代時，你的快取讀出來正好等於「前綴 + 前 2 個被接受的草稿」。
    verifies: >-
      a rejection at position 3 is ambiguous alone -- 0-indexed it leaves 3 accepted drafts and a
      cache of 13, 1-indexed it leaves 2 and a cache of 12 -- and the clause that resolves it is the
      verification target the exercise gives, 'prefix + first 2 accepted drafts'. So the rollback
      keeps 2, and the cache goes 10 to 15 to 12 with all 12 entries bit-identical to a cache replayed
      over the same 12 tokens: length alone would also pass a cache that kept the right number of
      stale rows. The verifier's own corrected token then makes 13, not 12, so a 5-token draft with 2
      accepted nets 3 tokens for one verifier forward and a rollback that stops at 12 drops the token
      the rejection produced. Truncation and rollback agree, which is what makes the cheap
      implementation legal -- a causal KV entry depends only on its own position and the ones before
      it, so the rejected entries can be thrown away instead of recomputed, and the same would not
      hold for a bidirectional cache. Without the rollback the next step attends 15 positions, 3 of
      them keys and values for rejected tokens, with no shape wrong and nothing raising: the failure
      of a missing rollback is silent, which is why the exercise asks for the contents and not the
      length
