      model card Metrics, Training Data and Ethical Considerations and system card Regulatory
      Alignment are placeholder-only, Security Capabilities (1/3) and Incident Response (1/2) partial,
      datasheet clean; the lesson lists 9/7/5 sections, the model card emits 8 and lacks Evaluation
      data; its figures 0.97, +0.03, -0.01 are literals in model_card(), main.py imports only
      __future__, Ethical Considerations admits placeholder and the datasheet's seed line has no
      digits
  - index: 2
    slug: regenerated_from_its_datasheet_the_model_scores_0_996_and_a_0_03_parity_gap_is_inside_the_0_088_noise
    kind: code
    tier: T0
    deps_group: none
    en: |
      Extend the model card with a quantitative disaggregated analysis across two demographic groups (Lesson 20).
    zh: |
      用一份跨兩個人口統計群體的分組拆解量化分析，擴充那份模型卡（第 20 課）。
    verifies: >-
      Lesson 21's train/predict on the datasheet's data (seed 26, 1000/500) gives per group n 250/250,
