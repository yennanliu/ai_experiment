    en: |
      Run `code/main.py`. Inspect the generated cards. Identify sections that are weak (placeholder-only) and specify what evidence would strengthen them.
    zh: |
      跑 `code/main.py`。檢視生成出來的卡片。指出哪些章節很弱（只有佔位文字），並指定什麼證據能把它們補強。
