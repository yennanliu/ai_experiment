exercises:
  - index: 1
    slug: the_map_names_1_of_in_context_schemings_6_apollo_authors_and_2_of_them_are_mats_alumni
    kind: code
    tier: T0
    deps_group: none
    en: |
      Pick one paper from Lessons 7-15 and identify the organisations involved. Cross-check the authors against MATS alumni and current ecosystem affiliations.
    zh: |
      從第 7-15 課裡挑一篇論文，指認出參與的組織。把作者拿去與 MATS 校友名單及當前的生態系隸屬關係對照查核。
    verifies: >-
      Lesson 8's header author list matches arXiv:2412.04984's six authors in order, one organisation
      (Apollo), and ECOSYSTEM cites the same arXiv id; Hobbhahn is on MATS's alumni page and Balesni
      self-reports MATS, so 2 of 6; 5 of 6 are on Apollo's team page, Balesni not. The lesson names 1
      of the 6 (Meinke) and no MATS alumnus. Of its 4 multi-org examples In-Context Scheming is
      single-org, which the skill file hard-rejects, and it credits Sleeper Agents to Anthropic +
      Redwood while Lesson 7's header names no org and its page mentions Redwood 0 times
  - index: 2
    slug: only_3_of_metrs_9_elements_are_in_all_12_policies_and_the_lessons_three_labs_agree_on_all_9
    kind: code
    tier: T0
    deps_group: none
    en: |
      Read METR's "Common Elements of Frontier AI Safety Policies." Identify the three cross-lab convergences they emphasize and the two largest divergences.
    zh: |
      讀 METR 的〈Common Elements of Frontier AI Safety Policies〉。指出他們強調的三項跨實驗室收斂，以及最大的兩項分歧。
    verifies: >-
      from METR's December 2025 presence table, Deployment Mitigations, Accountability and Updating
      Policies are the only elements in all 12 policies; Capability Elicitation (7/12) and Halting
      Development (8/12) are the least shared, and the 3 policies without Capability Thresholds
      include both of METR's domain-specific outliers, NVIDIA and Cohere. Lesson 18's LABS rows
      (Anthropic, OpenAI, Google DeepMind) have 9 of 9 each. The same URL is labelled a three-pillar
      framework in Lesson 8, UK AISI + METR control safety cases in Lesson 10 and a comparison in
      Lessons 18 and 28, and Lesson 28's METR section names 0 of the 9 elements
  - index: 3
    slug: a_filter_cutting_heterodox_intake_from_31_to_23pct_still_reads_83pct_so_the_80pct_decides_nothing
    kind: code
    tier: T0
    deps_group: none
    en: |
      MATS career outcomes are ~80% safety/security. Argue whether this selection pressure is adaptive (trains the field) or biased (filters out heterodox positions).
    zh: |
      MATS 的職涯結果約有 80% 走向安全／資安。論證這種選擇壓力究竟是適應性的（培養了這個領域），還是有偏的（把非主流立場過濾掉了）。
    verifies: >-
      with the lesson's 90 scholars, 40 mentors and 80% parsed from the page, 12 cohorts x 10 seeds: a
      consensus filter at s = 0/0.25/0.5/1/2 gives heterodox intake 0.312/0.228/0.167/0.092/0.031 and
      safety careers 0.799/0.828/0.849/0.868/0.887, a 71% cut at s = 1; nearest-of-40-mentor matching
      at s = 8 gives 0.291 heterodox and 0.81 safety against 0.317 unfiltered. The lesson's
      527/180/10K/47 compares with MATS's homepage 631/220/19,000/59
