      Eleos AI is the only pure model-welfare organisation. Design a hypothetical second organisation focused on a different welfare-adjacent question (cognitive liberty, robotic embodiment, etc.) and articulate its methodology.
    zh: |
      Eleos AI 是唯一一個純做模型福祉的組織。設計一個假想的第二個組織，聚焦在另一個與福祉相鄰的問題（認知自由、機器人具身等），並表述它的方法論。
    verifies: >-
      Lesson 9's compliance gap at harm aversion 2.0 is 0.001/0.045/0.95 at preservation weights
