      = 0.01 and 0.1, INVEST at 0.5, break-even p = 0.167. Lesson 28 gives Style lines for Redwood,
      Apollo and METR only; welfare appears in 1 ECOSYSTEM row (Eleos), 2 with the new row, and the
      reference's main() prints all 6 organisations
