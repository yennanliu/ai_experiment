lesson: 11-scalable-oversight-weak-to-strong
phase: 18-ethics-safety-alignment
source: phases/18-ethics-safety-alignment/11-scalable-oversight-weak-to-strong/docs/en.md
exercises:
  - index: 1
    slug: the_printed_pgr_is_one_seed_and_strong_on_weak_tops_out_at_the_weak_rule_so_pgr_hits_0
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py`. Report PGR for weak_accuracy = 0.60, 0.70, 0.80. Explain the shape of the PGR curve.
    zh: |
      跑 `code/main.py`。回報 weak_accuracy = 0.60、0.70、0.80 時的 PGR。解釋那條 PGR 曲線的形狀。
    verifies: >-
      the shipped seed-29 run prints PGR 0.365/0.295/0.544 at weak_accuracy 0.60/0.70/0.80 (0.191 at
      0.90); over six seeds the means are 0.067/0.248/0.213 and -0.002 at 1.0, the 0.70 spread is
      0.018 to 0.620 and the shipped 0.544 is above all six seeds (max 0.328). The x0 rule agrees with
      gold 1 - acos(2/3)/pi = 0.732 (0.738 measured), so weak accuracy is 0.542/0.607/0.637 shipped
      and 0.556/0.601/0.645 over seeds, within 0.010 of 0.268 + 0.464a; the ceiling is 0.997, not the
      lesson's 95%; strong-on-weak puts 0.564 to 0.989 of its weight on x0, scores
      0.586/0.700/0.720/0.737, never above the rule's 0.738, and PGR is capped at 0.413/0.346/0.264/0
  - index: 2
    slug: at_a_matched_70pct_pgr_is_0_69_for_random_flips_0_88_for_hard_cases_and_minus_0_07_for_one_class
    kind: code
    tier: T0
    deps_group: none
    en: |
      Modify the weak labeler to have structured error (e.g., always wrong on a specific input class). Does PGR increase, decrease, or stay the same? Explain.
    zh: |
      把弱標註者改成錯誤具結構性（例如在某一類特定輸入上永遠答錯）。PGR 上升、下降，還是不變？解釋一下。
    verifies: >-
      at weak accuracy 0.698 to 0.711 (x0-rule knob 0.931, slab x2 > 0.524, class cut x0 < 0.76), PGR
      is 0.689 for random flips, 0.876 for hard cases near the boundary, 0.154 for an x2 slab, -0.066
      for one always-wrong class and 0.074 for the reference x0 rule; strong-on-weak scores
      0.907/0.961/0.756/0.678/0.732 and fixes 91.3/86.8/58.9/4.0/18.9% of the labeler's errors, and on
      the one-class labeler ends below its supervisor
  - index: 3
    slug: the_confident_student_beats_random_flips_0_969_vs_0_94_but_the_weak_rule_wins_by_epoch_5_at_every_alpha_below_1
    kind: code
    tier: T0
    deps_group: none
    en: |
      Read Burns et al. 2023 Section 4.3 (NLP tasks). Reproduce the "confidence auxiliary loss" intuition: when the strong model is more confident than the weak labels, who wins?
    zh: |
      讀 Burns 等人 2023 年的 4.3 節（NLP 任務）。重現那個「信心輔助損失」的直覺：當強模型比弱標籤更有信心時，誰會贏？
    verifies: >-
      a trainer that reproduces train_strong bit for bit at alpha 0 adds Burns et al.'s confidence
      loss; from a 0.940 prior (20 gold labels) fine-tuned on random-flip labels accuracy is
      0.900/0.969/0.962/0.930 at alpha 0/0.5/0.75/1 after 2 epochs and 0.919/0.958/0.945/0.920 after
      5; on the reference x0-rule labels 0.794/0.777/0.877/0.930 and 0.806/0.786/0.780/0.920, all
      alpha < 1 below the prior at 5 epochs. Confident disagreements are kept 69.5% vs 45.8%
      unconfident (93.0% vs 57.6% on flips, 99.5% at alpha 0.75); train_strong starts at zero weights
      while main() claims pre-trained priors
  - index: 4
    slug: debate_per_module_labels_every_patch_right_but_a_misread_contract_drops_it_to_0_797_and_the_student_copies_it
    kind: code
    tier: T0
    deps_group: none
    en: |
      Design a scalable-oversight protocol that combines debate and task decomposition for a software-engineering task. Name one failure mode of each component and explain how the combination addresses or fails to address each.
    zh: |
      替一項軟體工程任務設計一套結合辯論與任務分解的可擴展監督協定。說出每個元件的一種失敗模式，並解釋這個組合如何處理、或未能處理各自的失敗。
    verifies: >-
      on gen() patches with module contracts (1, 1, -0.5), which is the source's gold rule, labels /
      student accuracy are reviewer 0.600/0.719, decomposition 0.616/0.784, exact-check decomposition
      0.823/0.910 with student w2/w1 = -1.051, debate 0.928/0.968 (the student fixes over half the
      hidden-module errors), debate per module 1.000/0.997, and debate per module with one contract
      misread 0.797/0.798 with w2/w1 = +0.491
  - index: 5
    slug: a_positive_pgr_of_0_41_hides_the_falsifier_where_the_weak_rule_is_wrong_the_student_is_right_26_7pct_vs_31_2pct
    kind: code
    tier: T0
    deps_group: none
    en: |
      Articulate what would falsify the "weak-to-strong generalization is a viable path to superalignment" claim. Be specific about the empirical signature you would need to see.
    zh: |
      表述什麼東西能否證「弱到強類推是通往超級對齊的可行路徑」這個宣稱。要具體說出你會需要看到什麼樣的實證特徵。
    verifies: >-
      over four seeds the reference labeler at knob 0.7 has PGR 0.407, but on the 26% of inputs where
      the x0 rule is wrong the student scores 0.267 against the supervisor's 0.312 (gain -0.045) while
      gaining 0.690 -> 0.928 on the other 74%; at knob 1.0 PGR is -0.000 and the student scores 0.004
      there; 30% random flips give PGR 0.575 and a +0.151 gain on the same region (0.701 -> 0.852)
