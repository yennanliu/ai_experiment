lesson: 27-data-provenance-training-governance
phase: 18-ethics-safety-alignment
source: phases/18-ethics-safety-alignment/27-data-provenance-training-governance/docs/en.md
exercises:
  - index: 1
    slug: a_y_with_a_note_drops_the_cpra_flag_and_5_of_12_missing_fields_crash_the_generator
    kind: code
    tier: T0
    deps_group: none
    en: |
      Run `code/main.py`. Produce a 12-field summary for a toy dataset and identify which fields are under-specified.
    zh: |
      跑 `code/main.py`。替一個玩具型資料集產出一份 12 欄位摘要，並指出哪些欄位交代得不夠。
    verifies: >-
      a forum-crawl toy fails the statute-text rules on items 3, 6, 9, 10 and 11 while the shipped
      TOY_EXAMPLE fails none, and render_markdown prints all 12 lines of both with no warning although
      the skill file asks to flag placeholder-only fields. flag_followups drops CPRA on item 7 = 'Y
      (usernames and signatures)' and raises it on bare 'Y'; an all-'Y (note)' summary raises 2 of 5
      follow-ups, all bare 'Y' 5. Removing items 5, 6, 7, 8 or 12 raises KeyError, the other 7 render
      '(missing)'. The shipped toy's only follow-up is the synthetic base-model line, for random.gauss
      data, while main() says items 5 and 7 trigger cascading obligations
  - index: 2
    slug: robots_txt_honours_12_of_24_opt_out_cases_c2pa_16_and_a_purpose_keyed_record_20
    kind: code
    tier: T0
    deps_group: none
    en: |
      The EU Copyright Directive TDM opt-out is machine-readable. Propose a standard format for the opt-out signal and compare it to robots.txt and C2PA "No AI Training."
    zh: |
      歐盟著作權指令的 TDM 退出是機器可讀的。替那個退出訊號提出一種標準格式，並與 robots.txt 及 C2PA 的「No AI Training」做比較。
    verifies: >-
      against the intent 'no training, search fine, any crawler, any copy' over 24 cases (2 crawlers x
      2 purposes x html/image x origin/mirror/stripped) robots.txt honours 12, C2PA 16 and the
      proposed tdm-reservation record 20, its 4 misses all stripped copies asked to train.
      urllib.robotparser denies GPTBot and CCBot and allows NewAIBot. C2PA honours 4 of 4 image cases
      per crawler at origin and mirror and misses all 6 HTML train cases. None of the 12 AB 2013
      fields names an opt-out, a crawl declared public domain raises no TDM flag, and the lesson
      spells 'TDM.Reservation', never 'tdm-reservation'
  - index: 3
    slug: a_2023_crawl_keeps_the_25pct_of_top_sources_a_2024_entrant_loses_and_ab_2013_flags_both_alike
    kind: code
    tier: T0
    deps_group: none
    en: |
      Read the Data Provenance Initiative's "Consent in Crisis" (July 2024). Describe the three fastest-restricting content categories and argue one economic consequence.
    zh: |
      讀資料來源倡議的〈Consent in Crisis〉（2024 年 7 月）。描述限制增加最快的三類內容，並論證一項經濟後果。
    verifies: >-
      with the lesson's 'about 25%' applied to a 20-source robots.txt panel, urllib.robotparser opens
      20 of 20 sources to a 2023 crawl, 15 to a named 2024 crawl and 20 to an unnamed NewAIBot;
      compounding gives 0.75, 0.562 and 0.422 open after 1-3 years and a 2.41-year half-life. The
      incumbent's and entrant's AB 2013 summaries differ only in item 10 and get the same two
      follow-ups. docs/en.md names no news, forum or encyclopedia category before its Exercises
  - index: 4
    slug: the_lessons_interest_plus_opt_out_rule_clears_health_and_minors_posts_that_need_consent
    kind: code
    tier: T0
    deps_group: none
    en: |
      The 2025 DPA alignment accepts legitimate interest for public-content training. Construct a scenario in which legitimate interest would not suffice and identify the legal basis a provider would need instead.
    zh: |
      2025 年各資料保護機關的趨同，接受了以正當利益訓練公開內容。建構一個「正當利益不足以支撐」的情境，並指出提供者屆時需要的替代法律基礎。
    verifies: >-
      main() prints 'legitimate interest + opt-out = lawful' and the lesson says 'Consent is not
      required'; over five scenarios that rule and a GDPR reading disagree on 2, B (patient-forum
      diagnosis posts, explicit consent Art 9(2)(a)) and D (minors, parental consent Art 8), both
      cleared by the lesson's rule. Summaries for A and B differ only in item 4 and get identical CPRA
      + TDM follow-ups. docs/en.md dates the ANPD suspension both 'June 2024' and '2 July 2024'
  - index: 5
    slug: cleaning_breaks_every_source_signature_erasure_breaks_the_chain_and_a_kept_hash_leaks_the_record
    kind: code
    tier: T0
    deps_group: none
    en: |
      Sketch a training-data-provenance manifest that composes with the AB 2013 fields and a C2PA-signed provenance chain for each dataset. Identify one technical and one legal barrier.
    zh: |
      勾勒一份訓練資料來源清單，讓它與 AB 2013 的欄位、以及每份資料集的 C2PA 簽章來源鏈組合起來。指出一項技術障礙與一項法律障礙。
    verifies: >-
      a 3-step HMAC-signed Merkle chain verifies, fails at step 1 when one record is edited, and
      derives item 9 from its actions; 8 of the reference's 12 field names are not identifiers and the
      normalised 12 render with 0 '(missing)'. 1 of 10 records still matches its source hash after a
      whitespace strip and 0 after lowercasing. Erasing the personal record fails the chain at step 1;
      keeping its leaf hash re-verifies, and that hash is reversed by guessing ages 0-120 on attempt
      38
