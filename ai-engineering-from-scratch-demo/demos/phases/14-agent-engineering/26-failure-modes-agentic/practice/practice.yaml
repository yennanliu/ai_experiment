lesson: 26-failure-modes-agentic
phase: 14-agent-engineering
source: phases/14-agent-engineering/26-failure-modes-agentic/docs/en.md
exercises:
  - index: 1
    slug: the_detector_is_shipped_and_gated_on_a_verb_list
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a detector for "success hallucination": agent returns success but the target state is unchanged.
    zh: |
      加一個「成功幻覺」偵測器：代理回傳成功，但目標狀態根本沒變。
    verifies: >-
      detect_success_hallucination is already in DETECTORS and fires only when the request text
      contains one of six verbs, so over 12 traces claiming success with state unchanged it catches 5
      where probing state with no gate catches 12 at 4 false positives and gating on a mutating tool
      call catches 12 at 0; the verb list misses delete, send, deploy, rename, archive, publish and
      revoke, 7 requests flagged zero times; target_state_changed is one of Trace's 6 fields supplied
      by the caller and 0 of the module's 10 functions computes it; a trace whose call errored, that
      claims success and changed nothing, is tagged by 0 of the 6 detectors
  - index: 2
    slug: the_mode_that_dominates_by_count_is_the_cheapest_to_fix
    kind: code
    tier: T0
    deps_group: none
    en: |
      Tag 100 real traces from a product you've built. Which mode dominates? What's the cost of fixing it?
    zh: |
      從你做過的產品裡挑 100 條真實軌跡貼標。哪種模式佔多數？修好它的成本是多少？
    verifies: >-
      running the demo's own seven trace shapes scaled to 100 through tag() gives scope_creep 29 and
      hallucinated_action, cascading_errors, tool_misuse and success_hallucination 14 each, with
      context_loss 0; priced at incident cost per occurrence over engineering days to fix, tool_misuse
      returns 42.0 against scope_creep's 8.3; detect_context_loss takes the first word after 'do not'
      -- a verb -- and searches the arguments for it, tagging 0 of 100 including the traces that write
      to the forbidden path; counting occurrences instead of traces moves hallucinated_action from 14
      to 42 and flips the dominant mode; the 100 traces carry 85 tags and 14 carry more than one
  - index: 3
    slug: the_tag_is_a_boolean_and_the_radius_is_thrown_away
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement a "cascade radius" metric: given a failure at step N, how many downstream steps did it affect?
    zh: |
      實作一個「連鎖半徑」指標：給定第 N 步的一次失敗，它影響了多少下游步驟？
    verifies: >-
      counting every tool call after the first error gives radii [1, 2, 3, 4, 5, 1, 3, 4, 5, 3]
      averaging 3.1, where counting only calls whose arguments carry the failed step's value gives [1,
      1, 1, 2, 3, 1, 1, 2, 3, 1] averaging 1.6 -- positional radius overstates blast by 1.9x;
      downstream_ops >= 2 tags 8 of 10 traces, leaving 2 clean that really did propagate the failed
      value; saw_error is never reset, so a trace with 3 separate errors reports one cascade of 9
      steps where the per-error radii are 4, 2 and 1; tag() returns a list of strings and the 6
      detectors return 0 step indices, so traces of radius 2 and 5 produce identical output
  - index: 4
    slug: read_masft_s_14
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Read MASFT's 14 failure modes. Pick three that apply to your product. Write detectors.
    zh: |
      讀 MASFT 的 14 種失敗模式。挑三種適用於你產品的。替它們寫偵測器。
    cites: >-
      MASFT (Berkeley, arXiv:2503.13657)
  - index: 5
    slug: a_five_percent_gate_on_a_hundred_traces_is_five_traces
    kind: code
    tier: T0
    deps_group: none
    en: |
      Wire one detector into a CI job: fail the build if >=5% of traces tag a mode.
    zh: |
      把其中一個偵測器接進 CI 工作：若有 >=5% 的軌跡被貼上某個模式，就讓建置失敗。
    verifies: >-
      over 200 seeded CI runs of 100 traces against a true tool_misuse rate of exactly 0.05, a >=5%
      gate fails 112 builds and passes 88, so 44.0% of runs get the minority verdict on identical
      code, and ten times the traces makes it 47.5% rather than less, while moving the true rate to
      0.02 or 0.10 gives 2.0% and 4.5%; the corpus tags 5 distinct modes with 72.0% of traces carrying
      at least one, 14.4x the threshold, so an any-mode gate is an unconditional failure; the
      threshold is absolute, so 29% halving to 12% still fails and 4% doubling to 4.9% still passes;
      wiring detect_context_loss in gives 0 hits on a corpus containing 14 forbidden-path writes
