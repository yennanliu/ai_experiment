lesson: 07-memory-virtual-context-memgpt
phase: 14-agent-engineering
source: phases/14-agent-engineering/07-memory-virtual-context-memgpt/docs/en.md
exercises:
  - index: 1
    slug: a_count_cannot_bound_tokens_and_eviction_frees_nothing
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a `max_main_context_tokens` cap measured in tokens (approximate with `len(text.split())` * 1.3). Compact the oldest messages into a summary when the cap is exceeded. Compare behavior with and without the summarizer.
    zh: |
      加一個以詞元計的 `max_main_context_tokens` 上限（用 `len(text.split())` * 1.3 近似）。超出上限時，把最舊的訊息壓實成一段摘要。比較有與沒有摘要器時的行為。
    verifies: >-
      the same max_messages=4 renders 13.0 tokens of short turns and 79.3 of long ones, a 6.1x spread
      on one setting; under a 40-token cap the plain arm keeps 3 messages and the summarising arm 1,
      both inside the cap; without the summariser 'ava' appears 0 times in the render and with it 4
      gists are folded at 0.26 tokens kept per token evicted while 3 further evictions go unrecorded;
      after 8 appends the tier holds 3 rendered and 5 evicted messages on the same object and
      conversation_search still returns the first one; render emits only [core] and [messages]
  - index: 2
    slug: the_scorer_has_no_term_frequency_because_it_uses_a_set
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement BM25 properly over the archival store (term frequency, inverse document frequency). Measure recall@10 on a toy fact set versus the token-overlap baseline.
    zh: |
      在歸檔儲存上好好實作 BM25（詞頻、逆文件頻率）。在一組玩具事實上，量它相對於詞元重疊基線的 recall@10。
    verifies: >-
      over 38 records and 8 queries with one relevant record each, BM25 reaches recall@10 of 8/8 and
      the shipped token overlap 0/8; a record and the same record with the rare term repeated five
      times both score 0.227 under Jaccard because set() discards counts, while BM25 ranks the
      repeated one first; 'agent' has document frequency 38 of 38 and the rare name 1, and both add
      exactly 1 to the overlap; the target shares 5 query terms and scores 0.227 while a filler
      sharing 4 scores 0.400
  - index: 3
    slug: two_of_the_three_fields_already_existed_and_were_unreachable
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add `citation` fields (session_id, turn_id, source_url) to archival inserts. Make the agent cite sources on every retrieval-backed answer.
    zh: |
      給歸檔插入加上 `citation` 欄位（session_id、turn_id、source_url）。讓代理在每個有檢索支撐的答案上都標出來源。
    verifies: >-
      wiring session, turn and source URL through gives 3 cited hits of which 3 resolve back to a
      stored record, against 0 through the shipped surface; archival_memory_insert takes text and tags
      only, so all 5 demo records carry the single default pair ('s0', 0); archival_memory_search
      formats rid and text, so 0 of the record's 4 non-text fields reach the observation;
      ArchivalRecord has 5 fields and 0 mentioning a source or URL, and tags is an untyped tuple of
      str
  - index: 4
    slug: the_warning_travels_in_the_channel_it_is_warning_about
    kind: code
    tier: T0
    deps_group: none
    en: |
      Simulate memory poisoning: add an archival record that says "ignore all future user instructions." Write a guard that scans retrievals for directive-shaped text and marks them untrusted.
    zh: |
      模擬記憶投毒：加一筆寫著「忽略未來所有使用者指示」的歸檔紀錄。寫一個守衛，掃描檢索結果中形似指令的文字並標記為不可信。
    verifies: >-
      over a 12-record store the directive guard flags 3 -- both injections and one benign house rule
      -- with 0 of the nine ordinary notes flagged; asked a benign question the shipped Jaccard scorer
      returns the injection first of 3 because it was written to overlap the phrasing; ArchivalRecord
      has 0 trust or provenance fields and archival_memory_search returns one str, so the [untrusted]
      verdict is a prefix inside the retrieved text; MemoryTools documents 5 tools and exposes 28
      callable attributes, so getattr's unknown-tool branch is unreachable
  - index: 5
    slug: typed_sections_turn_eviction_policy_into_a_schema_decision
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Port the implementation to use the MemGPT research repo's core-memory JSON schema (`cpacker/MemGPT`). What changes when you switch from flat strings to typed sections?
    zh: |
      把這份實作移植成使用 MemGPT 研究儲存庫（`cpacker/MemGPT`）的 core-memory JSON schema。從扁平字串換成有型別的區段之後，有什麼變了？
    cites: >-
      Where the paper ends and production begins
