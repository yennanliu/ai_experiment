      exist and 1 is a commit the log knows, so 8 of 8 receipts resolve; dropping every confidence to
      0.01 changes neither the ratio nor the status
  - index: 2
    slug: four_reported_claims_and_the_tree_corroborates_two
    kind: code
    tier: T0
    deps_group: none
    en: |
      Interview a user and mark every claim that still lacks direct evidence.
    zh: |
      Interview a user and mark every claim that still lacks direct evidence.
    verifies: >-
      of four claims taken from the instruction that started this work, 2 are corroborated by the log
      -- 8 recent lesson commits carrying 8 distinct lesson numbers, and a branch that is on its
      remote -- and 2 have no artifact in the repository; recording the corroboration moves
      direct_evidence_ratio from 0.0 to 0.5; 'commit and push once a lesson is completed' is
      corroborated only as 'one commit whose subject names one lesson', which is narrower than the
      sentence; audit returns 5 keys and names no weak claim, so a reader must walk steps to find the
      2 unsupported ones
  - index: 3
    slug: the_recovery_step_is_a_loop_and_the_model_is_a_list
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add one authority boundary and one failure-recovery step.
    zh: |
      Add one authority boundary and one failure-recovery step.
    verifies: >-
