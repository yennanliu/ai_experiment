    kind: code
    tier: T0
    deps_group: none
    en: |
      Reconstruct one workflow from a log without interviewing anyone.
    zh: |
      Reconstruct one workflow from a log without interviewing anyone.
    verifies: >-
      reconstructing the per-lesson workflow from this repository's git history and artifacts gives 8
      ordered steps with 0 ordering issues, every one supported by an artifact, so
      direct_evidence_ratio is 0.0 and audit reports needs-evidence about a correct reconstruction --
      'grounded' requires evidence a log cannot contain; the documented ladder has 4 rungs and
