lesson: 45-delegate-with-isolation
phase: 14-agent-engineering
source: phases/14-agent-engineering/45-delegate-with-isolation/docs/en.md
exercises:
  - index: 1
    slug: the_only_shared_path_is_the_one_a_script_writes
    kind: code
    tier: T0
    deps_group: none
    en: |
      Decompose a real change into two independent work units and one integrator.
    zh: |
      Decompose a real change into two independent work units and one integrator.
    verifies: >-
      two lesson practice directories in this repository overlap in 0 paths and schedule as
      [['lesson-43', 'lesson-44'], ['integration']] at status ready, while the top-level README is
      touched by 6 of the last 6 lesson commits because scripts/coverage.py rewrites it, so it belongs
      to the integrator; the documented contract lists 6 fields and WorkUnit carries 5, missing goal
      and handoff; a unit with paths=() validates ready, so a read-only worker and a decomposition
      error look alike; conflicts compares only distinct units, so one bad boundary reports twice
      while two nested paths inside one unit are never checked
  - index: 2
    slug: the_shipped_split_is_two_workers_writing_the_same_status_code
    kind: code
    tier: T0
    deps_group: none
    en: |
      Find a proposed parallel split that only looks independent. State the shared decision.
    zh: |
      Find a proposed parallel split that only looks independent. State the shared decision.
    verifies: >-
      the lesson's own example scores ready with 0 conflicts and schedules api and docs together
      although both write down the duplicate-signup response, and neither proof can catch the
      disagreement -- a unit test and a link checker; the only cross-unit proof, integration, depends
      on both and runs in wave 2, and WorkUnit has no field for the interface the merge contract is
      meant to fix first; hoisting the decision into a contract unit both workers depend on gives 3
      waves and 0 conflicts
  - index: 3
    slug: read_only_is_the_one_thing_the_contract_cannot_say
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a read-only research worker whose output is a fact table.
    zh: |
      Add a read-only research worker whose output is a fact table.
    verifies: >-
      a research unit owning one output path returns a 5-row fact table whose receipts all resolve to
      the lines they cite, with the plan at ready and 0 conflicts; WorkUnit's 5 fields describe writes
      only -- no reads field, no flag, and the module never runs a worker -- so read-only is a promise
      the artifact cannot carry; paths_overlap('outputs', 'outputs/facts.md') is True and two distinct
      files under outputs do not collide, so state isolation is enforced to the depth of the declared
      strings; wiring the researcher as a dependency gives 3 waves instead of 2
  - index: 4
    slug: the_merge_gate_finds_the_file_no_contract_claims
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a merge gate that checks the final changed-file set against all unit contracts.
    zh: |
      Add a merge gate that checks the final changed-file set against all unit contracts.
    verifies: >-
      on a real temp checkout git reports 6 changed paths and a merge gate flags 2 --
      scripts/release.sh claimed by no contract and tests/test_api.py written by a worker that does
      not own it -- while delegation_plan said ready beforehand; membership in the union of owned
      paths catches only the unclaimed one, so the gate has to attribute each change to its author
      using the owner field; paths_overlap('app/**', 'app/api/routes.py') is False while the
      directory-prefix form is True; delegation_plan takes one argument and the module never imports
      subprocess, so every pre-merge check is a check on the plan's internal consistency
  - index: 5
    slug: cancelling_by_deletion_makes_the_planner_raise
    kind: code
    tier: T0
    deps_group: none
    en: |
      Define a cancellation rule for a worker whose dependency becomes invalid.
    zh: |
      Define a cancellation rule for a worker whose dependency becomes invalid.
    verifies: >-
      deleting a unit whose dependents remain makes delegation_plan raise ValueError('unknown
      dependency') rather than return a blocked document, so cancellation must mark: marking keeps 3
      units, cancels api and its 1 transitive dependent and leaves docs running; waves is guarded
      against duplicate ids alone, so unknown dependencies and cycles escape as exceptions while
      duplicate ids, conflicts and missing proofs come back as fields; the cascade is a graph walk --
      1 further unit in the shipped example, 3 in a five-unit chain -- and the cancelled units' paths
      stay reserved at 0 conflicts
