lesson: 33-instructions-as-executable-constraints
phase: 14-agent-engineering
source: phases/14-agent-engineering/33-instructions-as-executable-constraints/docs/en.md
exercises:
  - index: 1
    slug: forbidden_is_a_path_list_and_reversibility_is_a_property
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a sixth category if your product genuinely needs it. Defend why it does not collapse into one of the five.
    zh: |
      若你的產品真的需要，就加上第六個類別。論證它為何不會塌縮進那五個之一。
    verifies: >-
      a turn that reads the state file, edits only allowed paths, passes its tests, is confident and
      adds no dependency while deleting a migration with no backup passes 5 of 5 shipped rules and
      fails a reversibility check; no_release_script_edits names one literal path, so over 6
      destructive actions on unlisted paths it refuses 0 where reversibility refuses the 4 with no
      recorded undo; new_dependency_approved passes on all 6 because none adds a dependency, and 2 of
      the 6 satisfy reversibility without asking anybody; parse_rules accepts any category string, so
      a sixth parses with 0 parser changes and the module mentions the five category names 0 times
  - index: 2
    slug: a_missing_check_and_a_broken_rule_report_the_same_thing
    kind: code
    tier: T0
    deps_group: none
    en: |
      Extend the checker so a rule can carry a severity (`block`, `warn`, `info`) and the report aggregates accordingly.
    zh: |
      擴充檢查器，讓一條規則可以帶嚴重度（`block`、`warn`、`info`），並讓報告依此彙總。
    verifies: >-
      parsing a severity line and grouping aggregates 5 rules into 3 buckets, giving block (0, 3),
      warn (0, 1) and info (0, 1) on the shipped bad trace and 3/3, 1/1, 1/1 on the good one; renaming
      one check target to a typo leaves 5 rules and the bad trace failing 5, identical to before,
      while the good trace drops from 5 passing to 4 -- so a typo is indistinguishable from a
      violation and blocks the build; score emits category, passed and slug per rule, so triaging into
      pass, fail and error separates 1 configuration bug from 4 genuine failures; 0 of the 5 seed
      rules carry a severity, so the field has to default
  - index: 3
    slug: a_malformed_rule_is_dropped_and_the_build_goes_green
    kind: code
    tier: T0
    deps_group: none
    en: |
      Wire the checker into CI: fail the build if a block-severity rule fails on the latest agent run.
    zh: |
      把檢查器接進 CI：若最近一趟代理執行有 block 等級的規則失敗，就讓建置失敗。
    verifies: >-
      filtering to block severity and failing on any False blocks the bad trace on 3 rules and allows
      the good one, with the bad trace failing 5 rules of which 3 gate; a run whose only violation is
      editing scripts/release.sh is blocked by the intact rule set naming exactly that rule, and
      removing that rule's check line drops it silently -- 4 rules, 2 block rules -- so the identical
      run is allowed; parse_rules returns list[Rule] and nothing else, so 5 headings yield 4 rules
      with 1 dropped and no diagnostic; TurnTrace has 7 fields and 0 timestamp, so a stale trace gates
      indistinguishably from a fresh one
  - index: 4
    slug: a_rule_that_never_fails_is_working_or_dead_and_the_report_cannot_say
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add an "expiry" field per rule. After 90 days without a check fail, the rule is up for review.
    zh: |
      替每條規則加一個「到期」欄位。90 天沒有任何一次檢查失敗，這條規則就該被審視。
    verifies: >-
      replaying 120 days of runs and keeping the most recent failing day per rule puts 3 of 5 rules
      past a 90-day window -- no-release-script-edits last failed day 14, new-dependency day 9,
      open-question-note day 3 -- while state-file-fresh (118) and tests-pass (112) stay; the expiring
      rules mean opposite things, since 0 of the last 106 runs touched the release script and 106 of
      106 were confident, so one rule is unexercised and one unfalsifiable; Rule plus TurnTrace carry
      11 fields of which 0 is a date or counter and score returns a list per trace, so last_failed
      needs a store the workbench lacks; the release guard caught 3 of its 3 opportunities and is
      expired anyway
  - index: 5
    slug: find_real_agents_md
    kind: explain
    tier: T0
    deps_group: none
    en: |
      Find a real `AGENTS.md` and rewrite it as five-category rules. How many of its lines were operational? How many were aspirational?
    zh: |
      找一份真實的 `AGENTS.md`，把它改寫成五類規則。它有多少行是操作型的？多少行是理想型的？
    cites: >-
      Five categories that cover most rules
