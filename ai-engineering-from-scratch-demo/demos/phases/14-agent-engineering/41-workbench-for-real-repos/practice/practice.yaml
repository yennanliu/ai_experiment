  - index: 5
    slug: what_survives_the_cut_is_the_two_outcomes_with_units_a_reader_owns
    kind: code
    tier: T0
    deps_group: none
    en: |
      Author a one-page summary aimed at a non-engineer. What survives the cut?
    zh: |
      寫一份給非工程師看的一頁摘要。什麼撐得過刪減？
    verifies: >-
      of the 5 outcomes a one-page summary keeps 2 -- tests_actually_run as a yes/no and
      files_outside_scope as a count -- in 264 words against a 350-word budget with 0 snake_case
      identifiers left in the text; all 5 outcome names are snake_case and 3 name a workbench surface
      the reader has never heard of, and reviewer_total (/10) is a scale with no external referent;
      the report's one explanatory paragraph runs 50 words and names 3 surfaces while the summary
      makes the same claim naming 0; the benchmark's literals claim 9/10 and 0 off-scope files while
      Exercise 2's checkable numbers on a shipped commit say 1 off-scope file and a missing handoff
