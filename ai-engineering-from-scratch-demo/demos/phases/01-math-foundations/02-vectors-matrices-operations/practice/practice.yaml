lesson: 02-vectors-matrices-operations
phase: 01-math-foundations
source: phases/01-math-foundations/02-vectors-matrices-operations/docs/en.md
exercises:
  - index: 1
    slug: verify_inverse
    kind: code
    tier: T0
    deps_group: math
    en: |
      **Verify the inverse.** Multiply `A @ A.inverse_2x2()` and confirm you get the identity matrix. Try it with three different 2x2 matrices. What happens when the determinant is zero?
    zh: |
      **驗證反矩陣。** 計算 `A @ A.inverse_2x2()`，確認你拿到的是單位矩陣。換三個不同的 2x2 矩陣各試一次。行列式為零的時候會發生什麼事？
    verifies: A A-inverse equals I within 1e-12 for 3 matrices including a det=1e-8 near-singular one, worst residual reported; and a det=0 matrix raises ValueError rather than returning a wrong answer
    uses_reference:
      - Matrix
      - Matrix.inverse_2x2
      - Matrix.determinant
  - index: 2
    slug: implement_3x3_inverse
    kind: code
    tier: T0
    deps_group: math
    en: |
      **Implement 3x3 inverse.** Extend the Matrix class to compute inverses for 3x3 matrices using the adjugate method. Test it against NumPy's `np.linalg.inv`.
    zh: |
      **實作 3x3 反矩陣。** 擴充 Matrix 類別，用伴隨矩陣（adjugate）法計算 3x3 矩陣的反矩陣。拿 NumPy 的 `np.linalg.inv` 來對答案。
    verifies: an adjugate-method 3x3 inverse gives A A-inverse == I within 1e-9 on generic, permutation and Hilbert matrices, and matches np.linalg.inv entry-wise within 1e-9; Matrix is subclassed, never edited
    uses_reference:
      - Matrix
  - index: 3
    slug: build_two_layer_network
    kind: code
    tier: T0
    deps_group: none
    en: |
      **Build a two-layer network.** Using only your Matrix class (no NumPy), create a two-layer neural network: input (3) -> hidden (4) -> output (2). Initialize random weights, run a forward pass, and verify all shapes are correct.
    zh: |
      **做一個兩層網路。** 只用你自己的 Matrix 類別（不用 NumPy），建一個兩層神經網路：輸入 (3) -> 隱藏 (4) -> 輸出 (2)。隨機初始化權重，跑一次前向傳播，並確認所有形狀都正確。
    verifies: all 7 intermediate shapes match (1,3)(3,4)(4,2)->(1,2), relu is applied elementwise against the pre-activation, and the run is seeded so the forward pass is reproducible; no numpy, enforced by deps_group none
    uses_reference:
      - Matrix
      - relu_matrix
