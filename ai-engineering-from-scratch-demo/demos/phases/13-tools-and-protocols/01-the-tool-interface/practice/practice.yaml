exercises:
  - index: 1
    slug: registering_a_tool_does_not_route_to_it
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add a fourth tool to `code/main.py` called `get_stock_price(ticker)`. Write its description as "Use when the user asks for a current stock price by ticker. Do not use for historical prices or market summaries." Run the harness and confirm the fake decider routes queries mentioning tickers to the new tool.
    zh: |
      在 `code/main.py` 加上第四個工具，叫做 `get_stock_price(ticker)`。把它的描述寫成「當使用者依代號詢問當前股價時使用。不要用於歷史股價或市場摘要。」跑一次測試框架，確認那個假決策器會把提到代號的查詢導向新工具。
    verifies: >-
      the fourth tool is built to the exercise's spec -- name get_stock_price, the quoted description,
      a required string ticker -- and joins the registry as entry 4; its schema accepts {'ticker':
      'AAPL'}, rejects {} with "missing required field 'ticker'" and executes to a price. fake_decide
      then routes 0 of 5 ticker queries to it. Walking fake_decide's AST with its docstring stripped
      shows REGISTRY is not among the names its code touches, though it does appear in the docstring;
      routing is three hard-coded branches naming add, get_time and get_weather as string literals.
      describe_registry prints the registry rather than passing it to the decider.
  - index: 2
    slug: the_extra_field_is_ignored_and_a_boolean_is_a_number
    kind: code
    tier: T0
    deps_group: none
    en: |
      Break the schema validator. Pass a call whose `arguments` object is missing a required field, and confirm the host rejects it before execution. Then pass a call with an extra unknown field. Decide: should the host reject or ignore? Justify your choice with a safety argument.
    zh: |
      把 schema 驗證器弄壞。傳入一個 `arguments` 物件缺少必填欄位的呼叫，確認宿主在執行之前就把它擋下。接著傳入一個帶有多餘未知欄位的呼叫。決定：宿主該拒絕還是忽略？用一個安全上的論據為你的選擇辯護。
    verifies: >-
      {'a': 1} returns ["missing required field 'b'"] and never reaches the executor; {'a': 1, 'b': 2,
      'evil': 'x'} returns [] and executes to {'sum': 3}, because validate walks the declared
      properties and never enumerates the supplied keys -- it has no additionalProperties support. The
      host should reject rather than ignore, since the undeclared key survives into
      executor(call['arguments']). And {'a': True, 'b': False} validates clean and tool_add returns
      {'sum': 1}: isinstance(True, int) is True, so the type gate admits a value JSON Schema excludes.
  - index: 3
    slug: the_gate_is_live_code_that_no_shipped_tool_reaches
    kind: code
    tier: T0
    deps_group: none
    en: |
      Classify each tool in the harness as pure or consequential. Add a `consequential: true` flag to the registry entries that need it, and change the loop to print a "would confirm with user" line whenever a consequential tool is chosen. This is the shape of the confirmation gate every production host needs.
    zh: |
      把測試框架裡的每個工具分類成純粹或有後果。替需要的登錄項目加上 `consequential: true` 旗標，並修改迴圈，讓它在選到有後果的工具時印出一行「將向使用者確認」。這就是每個生產級宿主都需要的那道確認閘門的形狀。
    verifies: >-
      all three tools carry consequential=False and 0 need the flag; add and get_weather replay
      identically. tool_get_time calls datetime.now, so it reads external state without mutating any
      -- an axis the pure/consequential dichotomy has no cell for, and which the docs' trust split
      calls deterministic. The lesson's four demo queries print GATE 0 times; flipping
      get_weather.consequential and re-running prints it once, so the branch is reachable and
      unreached. MAX_TURNS is 5 while the deepest turn reached is 2, and 'LOOP TERMINATED' prints 0
      times.
