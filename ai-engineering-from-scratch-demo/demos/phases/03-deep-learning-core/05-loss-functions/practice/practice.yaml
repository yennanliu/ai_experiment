lesson: 05-loss-functions
phase: 03-deep-learning-core
source: phases/03-deep-learning-core/05-loss-functions/docs/en.md
exercises:
  - index: 1
    slug: huber_outliers
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement Huber loss (smooth L1 loss), which is MSE for small errors and MAE for large errors. Train a regression network predicting y = sin(x) with MSE vs Huber when 5% of training targets have random noise added (outliers). Compare final test error.
    zh: |
      實作 Huber 損失（smooth L1 loss）：小誤差時像 MSE，大誤差時像平均絕對誤差（MAE）。訓練一個預測 y = sin(x) 的迴歸網路，並在 5% 的訓練目標被加上隨機雜訊（離群值）的情況下比較 MSE 與 Huber。比較最終的測試誤差。
    verifies: ANSWER Huber's test error is 71x lower, measured in MSE's own units - mean squared error against clean sin(x) over 3 seeds is 0.13844 MSE-trained against 0.00194 Huber-trained, 71.5x, and 51.4x at the worst seed; MECHANISM 3 rows in 60 own a quarter of the MSE gradient - the corrupted 5% carry 28.8% of sum|dL/dy_pred| at the zero start under MSE against 5.8% under Huber, whose per-row gradient is clipped at delta/n = 0.0083; MECHANISM inside delta, Huber *is* MSE at half the step size - at delta = 1e9 and lr = 1.0 it reproduces the MSE run at lr = 0.5 to a weight deviation of exactly 0.0, and on outlier-free targets it costs 1.44x MSE's error, which is the gap a half-rate run leaves after 1000 epochs; CONTROL halving MSE's learning rate does not recover it - MSE at lr = 0.25 scores 0.12440 against 0.13844 at lr = 0.5 and is still 64.3x worse than Huber, so the win is the clip and not the smaller step it implies; both arms descend the loss they claim to, the worst gap to a central difference over four residuals from 0.05 to 3.5 (one either side of the delta = 0.5 kink) being 2.4e-10 for the lesson's `mse_gradient` and for `huber_gradient` alike
    uses_reference:
      - mse
      - mse_gradient
  - index: 2
    slug: focal_imbalance
    kind: code
    tier: T0
    deps_group: none
    en: |
      Add focal loss to the binary classification training loop. Create an imbalanced dataset (90% class 0, 10% class 1). Compare standard BCE vs focal loss (gamma=2) on the minority class recall after 200 epochs.
    zh: |
      在二元分類的訓練迴圈裡加上 Focal Loss。造一個不平衡的資料集（90% 類別 0、10% 類別 1）。跑 200 個 epoch 之後，比較標準 BCE 與 Focal Loss（gamma=2）在少數類別上的召回率。
    verifies: ANSWER focal loss at gamma = 2 does not move minority recall - over 90 positives after 200 epochs, BCE scores 0.700 against focal's 0.711, and no single seed differs by more than 1 of 30 positives; FINDING focal moves calibration rather than detection - mean probability on negatives goes 0.056 -> 0.158 and on positives 0.680 -> 0.629 while AUC moves only 0.9536 -> 0.9613, so both classes drift toward 0.5 and the 0.5 cut still lands between them; FINDING the lesson's (1-p_t)^gamma weights the loss and not the gradient - the docs quote 0.0100 at p_t = 0.9 ('ignored') and 0.8100 at 0.1 ('full gradient signal'), where the gradient factors are 0.0290 and 1.2245 (a central difference agrees to 2.9e-11), and the factor peaks at 1.2246 (p_t = 0.1040) before decaying to 1.0000 as p_t -> 0, so focal only ever damps; CONTROL alpha moves recall, and moves it by moving the threshold - alpha = 0.75 at gamma = 0 lifts recall to 0.811 while AUC goes 0.9536 -> 0.9553, and simply letting plain BCE call its own top 152 scores positive recovers 0.822
    uses_reference:
      - LossComparisonNetwork
  - index: 3
    slug: semi_hard_triplets
    kind: code
    tier: T0
    deps_group: none
    en: |
      Implement triplet loss with semi-hard negative mining. Generate 2D embedding data for 5 classes. For each anchor, find the hardest negative that is still farther than the positive (semi-hard). Compare convergence to random triplet selection.
    zh: |
      實作帶半困難負樣本挖掘（semi-hard negative mining）的三元組損失。為 5 個類別產生 2D 嵌入資料。對每個 anchor，找出仍然比 positive 更遠的最困難負樣本（semi-hard）。把收斂情況和隨機挑三元組的做法比較。
    verifies: ANSWER semi-hard mining converges in fewer epochs at all three seeds - epochs to the first with no violated triplet are [21, 21, 24] against random selection's [29, 23, 33], 1.4x, 1.1x and 1.4x fewer; FINDING and in more work at all three seeds, so the epoch is the unit that flatters mining - gradient steps actually taken are [597, 495, 641] against [391, 328, 393], 1.5-1.6x more, so per step random selection is ahead and only per epoch is semi-hard; MECHANISM mining raises the hit rate rather than the gradient - violating triplets found in the first epoch out of 100 anchors are [75, 77, 68] for semi-hard against [37, 34, 43] for random, because the hardest negative farther than the positive is by construction near the margin and almost always violates; FINDING the 'still farther than the positive' clause almost never binds - the semi-hard set is empty on 11 of 45,000 anchor draws, since five blobs two units apart leave almost every negative farther than the positive, and the exercise's wording says nothing about the case where it does bind; CONTROL both rules end at the same place and it is structure rather than scale - 1-NN label agreement goes 0.370 -> 1.000 under both, and the lesson's own cosine `contrastive_loss`, which no rescaling can move, falls 7.567 -> 0.007 and 0.015, even though the semi-hard arm's mean embedding norm grew 3.12 -> 4.06 and random's did not move
    uses_reference:
      - contrastive_loss
      - cosine_similarity
  - index: 4
    slug: mse_vs_cross_gradients
    kind: code
    tier: T0
    deps_group: math
    en: |
      Run the MSE vs cross-entropy comparison but track gradient magnitudes at each layer during training. Plot the average gradient norm per epoch. Verify that cross-entropy produces larger gradients in early epochs when the model is most uncertain.
    zh: |
      跑一次 MSE vs 交叉熵的比較，但在訓練過程中追蹤每一層的梯度大小。畫出每個 epoch 的平均梯度範數。驗證在模型最不確定的早期 epoch 裡，交叉熵確實產生較大的梯度。
    verifies: ANSWER on the same weights cross-entropy's gradient is larger at every sample of every epoch, by exactly 1/(2p(1-p)) - over 200 epochs x 200 points x 2 arms the measured |d_bce/dz| / |d_mse/dz| never leaves that closed form by more than 1.4e-15 relative, because the sigmoid derivative cancels in cross-entropy (d/dz is exactly p - t) and MSE keeps it at 2(p - t)p(1 - p); FINDING the exercise has the direction backwards - 1/(2p(1-p)) is *minimised* at p = 0.5, the most uncertain the model can be, where it is exactly 2.0000, and it grows without bound as the model becomes confidently wrong, reaching 1.5e+31 in this run, so cross-entropy's edge is largest where the model is most certain; the per-epoch curve agrees, rising 2.72 at epoch 0 to 3.95 at epoch 199 rather than falling; FINDING two separately trained arms stop being a comparison at the first update - training MSE and cross-entropy separately as the exercise says gives layer-1 ratios of 1.58 at epoch 0 falling to 1.08, below the 2.0 the closed form guarantees on shared weights, because the lesson's net updates after every sample and the arms are different networks after one point; CONTROL the two arms end in the same place and their losses are not comparable numbers - mse 0.0048/100.0% against bce 0.0134/99.5%, the same accuracy to within a point, with the loss column in different units in each row
    uses_reference:
      - LossComparisonNetwork
      - make_circle_data
  - index: 5
    slug: kl_and_soft_targets
    kind: code
    tier: T0
    deps_group: math
    en: |
      Implement KL divergence loss and verify that minimizing KL(true || predicted) gives the same gradients as cross-entropy when the true distribution is one-hot. Then try soft targets (like knowledge distillation) where the "true" distribution comes from a teacher model's softmax output.
    zh: |
      實作 KL 散度損失，並驗證當真實分布是 one-hot 時，最小化 KL(true || predicted) 給出的梯度與交叉熵相同。接著試試軟目標（像知識蒸餾那樣），此時的「真實」分布來自教師模型的 softmax 輸出。
    verifies: ANSWER with a one-hot target KL is cross-entropy in both value and gradient - over 200 random 5-class logit vectors the largest gap to the lesson's `categorical_cross_entropy` is 8.9e-16 and the largest gap between a central difference of KL and its own `cce_gradient` is 1.4e-09, the quotient's own O(h^2); MECHANISM KL(q||p) = CE(q,p) - H(q) and one-hot has H(q) = 0 - the gradient is p - q under both targets (worst deviation 1.4e-09 one-hot, 1.7e-09 soft) because H(q) does not depend on the logits, so the two are the same objective plus a constant and only one-hot makes that constant zero; FINDING with soft targets the loss moves and the gradient does not, so KL values are not comparable across teachers - cross-entropy exceeds KL by exactly the teacher's entropy (0.1369 nats here, worst mismatch 3.6e-15 over 200 teachers), so a blunter teacher at H = 1.5750 reports a smaller KL for the same student and a distillation run can only be compared to itself; MECHANISM the temperature the technique needs is not in this formula - d/dz KL(q || softmax(z/T)) is exactly (softmax(z/T) - q)/T, worst deviation 1.7e-09 at T = 1, 2, 4, and that 1/T is why distillation multiplies the loss by T^2, while the exercise's 'teacher's softmax output' leaves T at 1; CONTROL KL is zero at a perfect match and is not symmetric - feeding the teacher's own log-probabilities back as logits gives 2.2e-16, and swapping the arguments moves it by up to 10.3113 nats, so KL(true || predicted), the one the exercise names, is the direction that penalises a student for missing mass the teacher put somewhere
    uses_reference:
      - softmax
      - categorical_cross_entropy
      - cce_gradient
