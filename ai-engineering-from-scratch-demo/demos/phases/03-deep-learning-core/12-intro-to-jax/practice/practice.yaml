lesson: 12-intro-to-jax
phase: 03-deep-learning-core
source: phases/03-deep-learning-core/12-intro-to-jax/docs/en.md
exercises:
  - index: 1
    slug: dropout_keys
    kind: code
    tier: T1
    deps_group: llm
    en: |
      Add dropout to the MLP. In JAX, dropout requires a PRNG key -- thread a key through the forward pass and split it for each dropout layer. Compare test accuracy with and without.
    zh: |
      為這個 MLP 加上 dropout。在 JAX 裡，dropout 需要一把 PRNG 金鑰 —— 把金鑰一路穿過前向傳播，並為每一層 dropout 分裂出一把。比較有 dropout 與沒有 dropout 的測試準確率。
    verifies: ANSWER dropout does not buy test accuracy on this fixture - 600 steps each at p = 0.0 / 0.2 / 0.5 gives train 0.9536 / 0.9502 / 0.3354 and test 0.3018 / 0.2988 / 0.1475, so p=0.2 moves held-out accuracy -0.29 points and p=0.5 costs 15.4 by stopping the net fitting at all, while the train/test gap dropout was meant to close survives untouched at 0.6519 against 0.6514 because the labels carry noise the net memorises; FINDING leaving dropout on at eval costs more than dropout ever wins - the same p=0.2 parameters score 0.2988 with dropout off and 0.2324 with it on, 6.6 points, 20x the effect the exercise asks about, and the key being a required argument is what makes it easy: the eval path must pass one, and passing one keeps dropout live; MECHANISM one key reused is not two masks, the second is a prefix of the first - `bernoulli(k, .8, (256,))[:128]` and `bernoulli(k, .8, (128,))` agree on 100% of positions, because the counter PRNG indexes by position and a new shape does not decorrelate a key, which is exactly why the exercise says 'split it for each dropout layer'; MECHANISM split is a pure function of its key, so it repeats exactly - splitting PRNGKey(1234) twice gives bit-identical subkeys, the two siblings of one split differ, and PRNGKey(1235) differs again, so reproducibility is a property of the value passed in and no interleaved draw shifts it; CONTROL inverted dropout preserves the mean and p=0 is the identity - 20000 ones at p=0.5 return mean 0.99840 against 0.49920 without the 1/(1-p) rescale, and at p=0.0 this forward is bit-identical to the lesson's own
    uses_reference:
      - init_params
      - forward
      - accuracy
      - optimizer
  - index: 2
    slug: per_example_grads
    kind: code
    tier: T1
    deps_group: llm
    en: |
      Use `jax.vmap` to compute per-example gradients for a batch of 32 MNIST images. Compute the gradient norm for each example. Which examples have the largest gradients, and why?
    zh: |
      用 `jax.vmap` 為一個 32 張 MNIST 圖片的批次算出逐樣本梯度。算出每筆樣本的梯度範數。哪些樣本的梯度最大，為什麼？
    verifies: ANSWER the examples the model gets wrong carry the biggest gradients - after 200 steps mean ||g|| is 32.86 over the 8 misclassified examples against 16.46 over the 24 correct ones, 2.00x, with the three largest at p(true class) 0.189, 0.118, 0.283 and the three smallest at 0.927, 0.920, 0.891; MECHANISM the output-layer error is exactly softmax - onehot - the per-example gradient w.r.t. `layer3.b` matches p - y elementwise to 5.96e-08, and every other gradient in the tree is that vector back-propagated, so ||g_i|| is a monotone read-out of how wrong the model is about example i (correlation with the loss 0.906); FINDING at initialisation the question has almost no answer - untrained the 32 norms span only 1.56x with correlation 0.636 to ||p - y||, against 12.23x at 0.953 after 200 steps, because a near-uniform softmax makes p - y nearly the same vector for every example, so 'which examples dominate' is a property the model acquires and not one the data has; FINDING vmap is 24x faster than the loop it replaces, but most of that is dispatch - best of 5 gives vmap+jit 2.84 ms, an eager Python loop 68.8 ms and a loop over a *jitted* per-example grad 4.28 ms, so the lesson's '10-100x faster than a Python loop' holds against the eager loop and shrinks to 1.5x against a compiled one; CONTROL the per-example gradients average to the batch gradient - the mean over the 32 rows matches `grad(loss_fn)` on the whole batch to 8.94e-08, since `loss_fn` ends in `jnp.mean`, so the batch gradient throws away exactly the spread the first check measures
    uses_reference:
      - init_params
      - forward
      - loss_fn
      - train_step
      - optimizer
  - index: 3
    slug: generic_forward
    kind: code
    tier: T1
    deps_group: llm
    en: |
      Replace the manual forward function with a generic `mlp_forward(params, x)` that works for any number of layers. Use `jax.tree.leaves` to determine the depth automatically.
    zh: |
      把手寫的 forward 函式換成一個通用的 `mlp_forward(params, x)`，讓它對任意層數都能用。用 `jax.tree.leaves` 自動判斷深度。
    verifies: ANSWER one mlp_forward reproduces the lesson's forward bit for bit - identical float32 output on the lesson's own 3-layer params (equal, not close) and an identical gradient (max |delta| 0.0e+00), with depths 1, 2, 4 and 11 all returning (64, 10); MECHANISM jax.tree.leaves gives the depth at two leaves per layer - len(jax.tree.leaves(params)) // 2 recovers 1, 2, 4 and 11 for those nets - but the flattening is by *sorted key*, so within a layer it yields layer1.b before layer1.w, and pairing leaves as (w, b) in flatten order silently transposes every layer; FINDING past nine layers the key order stops meaning depth order - `sorted(params)` on an 11-layer net gives layer1, layer10, layer11, layer2, ... because `layer10` sorts before `layer2` as a string, so jax.tree.leaves still counts 11 layers correctly while the same forward driven by `sorted` fails on shapes with 'dot_general requires contracting dimensions to have the same shape, got (10,) and (24,)'; CONTROL what the replacement buys is that the lesson's own forward is wired to exactly three layers, and only one of its two failures is loud - on a 1-layer net it raises KeyError('layer2') where mlp_forward returns (64, 10), and on the 11-layer net it returns shape (64, 24) and raises nothing at all, stopping after layer3 with the remaining eight layers never applied, so the output is a hidden activation wearing the shape of a prediction
    uses_reference:
      - init_params
      - forward
      - loss_fn
  - index: 4
    slug: jit_benchmark
    kind: code
    tier: T1
    deps_group: llm
    en: |
      Benchmark the training step with and without `@jax.jit`. Time 100 steps of each. How large is the speedup on your hardware? What is the compilation overhead on the first call?
    zh: |
      為訓練步驟做基準測試，比較有 `@jax.jit` 與沒有的差別。各跑 100 步計時。在你的硬體上加速多少倍？第一次呼叫的編譯開銷是多少？
    verifies: ANSWER jit wins per step and its first call costs many steps - 100 steps at batch 128 run at 0.500 ms/step jitted against 3.595 undecorated, 7.2x, while the first call takes 110 ms, 220 compiled steps' worth, so jit only goes net ahead at step 36 of the 100; MECHANISM the compile is one-off and not a per-call tax - the cache holds 0 entries before the first call and 1 after, and still 1 once several hundred more calls at that shape have run; FINDING a different batch size is a different program and recompiles - one call at batch 64 takes the cache from 1 to 2 and costs 109 ms, another 217 steps' worth, and the lesson's loop dodges it only by dropping the ragged tail, since `len(X_train) // batch_size` discards 96 of 60000 rows an epoch; FINDING the speedup is Python dispatch and it collapses with batch size - 12.3x at batch 16 against 2.1x at batch 2048, 128x the arithmetic, with the jitted step slowing 12.6x over that range and the eager step only 2.1x, because eager time is Python dispatch of a fixed number of primitives and what jit removes is mostly the interpreter; CONTROL jit changes the clock and nothing else - 100 identical steps down each path from one init leave the parameters agreeing to 2.5e-07, which is not free a priori since XLA fuses and reorders float32 arithmetic
    uses_reference:
      - init_params
      - train_step
      - optimizer
  - index: 5
    slug: clip_by_global_norm
    kind: code
    tier: T1
    deps_group: llm
    en: |
      Implement gradient clipping by composing `optax.chain(optax.clip_by_global_norm(1.0), optax.adam(1e-3))`. Train with and without clipping. Plot the gradient norm over training to see the effect.
    zh: |
      用 `optax.chain(optax.clip_by_global_norm(1.0), optax.adam(1e-3))` 組合出梯度裁剪。分別在有裁剪與沒裁剪的情況下訓練。把訓練過程中的梯度範數畫出來，看看效果。
    verifies: ANSWER the chain costs training loss and buys a little held-out accuracy on all three seeds - 300 steps at seeds (0, 1, 2) go from 0.535/0.2529, 0.408/0.2764, 0.517/0.2627 without the clip to 0.601/0.2900, 0.621/0.2969, 0.914/0.2734 with it, a mean +2.28 accuracy points against a 2.34-point spread across the unclipped seeds alone, so it regularises rather than stabilises; FINDING plotting the gradient norm shows the clip doing nothing - the norms a training loop can record are the raw ones, and in the clipped run they still cross 1.0 on 298 of 300 steps (2.55 at step 0, 1.70 at 10, 3.71 at 150, 3.12 at 299), because the clip sits between `grad` and `apply_updates` and never enters that curve; MECHANISM the clip is a pure rescale, so SGD feels all of it and Adam almost none - ||g|| is 2.553 at init and 6.177 after 300 Adam steps, both clipping to norm 1.000000 at cosine 1.000000 to the raw gradient, which costs SGD exactly 1/||g|| of its step (0.3917, 0.1619) and costs Adam 0.01% and 23%, since at t=1 Adam's update is g/(|g|+eps) elementwise and later sqrt(v_hat) still carries most of the same factor, so `chain(clip, adam)` largely undoes its own clip; CONTROL the same chain in front of optax.sgd is decisive - sgd(0.5) peaks at ||g|| 125 and ends at loss 2.300, 2.298, 2.297, which is chance, while `chain(clip, sgd)` peaks at 7.0 and ends at 1.845, 1.903, 1.776, so the clip is no no-op and Adam is what makes it one
    uses_reference:
      - init_params
      - loss_fn
      - accuracy
